    let cardStartPos = new THREE.Vector3(attacker.pos.x, attacker.pos.y+1.05, attacker.pos.z);
    if(attacker.mesh.userData.handR){
      attacker.mesh.userData.handR.getWorldPosition(cardStartPos);
    }
    // find whoever is actually under the crosshair first (same approach as
    // the normal attack) - aiming a slow-traveling object at a fixed far
    // point instead would only ever converge with the crosshair way out at
    // max range, badly missing anyone standing closer than that
    let hitDist = maxRange;
    for(const target of players){
      if(target === attacker || !target.alive) continue;
      if(isFriendlyFire(attacker, target)) continue;
      const t = rayHitsBody(origin, aimDir, target.pos, 0.6 + TARGET_HIT_RADIUS, hitDist);
      if(t === null) continue;
      if(t < hitDist) hitDist = t;
    }
    const endPoint = origin.clone().addScaledVector(aimDir, hitDist);
    playCardFlickSound(0.35);
    spawnStickyCardThrow(attacker, cardStartPos, endPoint, maxRange, (stickInfo, mesh, stuckTarget)=>{
      attacker.stickyCards.push({getPos:stickInfo.getPos, mesh});
      if(stuckTarget && stuckTarget.alive){
        const dir = new THREE.Vector3(stuckTarget.pos.x-attacker.pos.x, 0, stuckTarget.pos.z-attacker.pos.z);
        if(dir.lengthSq() < 0.0001) dir.set(0,0,1); else dir.normalize();
        applyHit(attacker, stuckTarget, dir, 2, 1, computeDamageWithPassives(attacker, stuckTarget, char.skillStickDamage||20));
        trackKineticCharge(attacker, stuckTarget);
      }
    });
    return;
  }
  if(attacker.skillCooldown > 0) return;
  attacker.skillCooldown = withCooldownExtension(attacker, char.skillCooldownMax || 5);

  const fwd = new THREE.Vector3(Math.sin(attacker.yaw), 0, Math.cos(attacker.yaw));

  if(char.skillType === 'grenade'){
    // ローカルプレイヤーは押しっぱなし操作で直接throwGrenadeを呼ぶので、
    // ここを通るのはボットだけ
    throwGrenade(attacker);
  } else if(char.skillType === 'lunge'){
    attacker.vel.x += fwd.x * char.skillLungeForce;
    attacker.vel.z += fwd.z * char.skillLungeForce;
    attacker.vel.y = Math.max(attacker.vel.y, 4.5);
    attacker.attacking = 0.28;
    for(const target of players){
      if(target === attacker || !target.alive) continue;
      if(isFriendlyFire(attacker, target)) continue;
      const toTarget = new THREE.Vector3(target.pos.x-attacker.pos.x, 0, target.pos.z-attacker.pos.z);
      const dist = toTarget.length();
      if(dist > char.skillRange + TARGET_HIT_RADIUS || dist < 0.0001) continue;
      const dirToTarget = toTarget.clone().normalize();
      const ang = Math.acos(THREE.MathUtils.clamp(fwd.dot(dirToTarget), -1, 1));
      if(ang > Math.PI/2.6) continue;
      applyHit(attacker, target, dirToTarget, char.skillKnockback, char.skillKnockUp, computeDamageWithPassives(attacker, target, char.skillDamage));
    }
  } else if(char.skillType === 'aoe'){
    spawnAoeBurst(new THREE.Vector3(attacker.pos.x, attacker.pos.y+0.15, attacker.pos.z), char.skillRadius, 0xFFCC66);
    for(const target of players){
      if(target === attacker || !target.alive) continue;
      if(isFriendlyFire(attacker, target)) continue;
      const toTarget = new THREE.Vector3(target.pos.x-attacker.pos.x, 0, target.pos.z-attacker.pos.z);
      const dist = toTarget.length();
      if(dist > char.skillRadius + TARGET_HIT_RADIUS || dist < 0.0001) continue;
      const dirToTarget = toTarget.clone().normalize();
      applyHit(attacker, target, dirToTarget, char.skillKnockback, char.skillKnockUp, computeDamageWithPassives(attacker, target, char.skillDamage));
    }
  } else if(char.skillType === 'pull'){
    attacker.attacking = 0.28;

    // aim like the gun does: from the camera for the local player, so it
    // matches the on-screen crosshair; bots use their own computed pitch so
    // they can aim up/down too
    let origin = new THREE.Vector3(attacker.pos.x, attacker.pos.y+1.05, attacker.pos.z);
    let aimDir = fwd.clone();
    if(attacker.isLocal){
      origin = camera.position.clone();
      aimDir = new THREE.Vector3();
      camera.getWorldDirection(aimDir);
    } else {
      const pitch = attacker.aimPitch || 0;
      aimDir = new THREE.Vector3(Math.sin(attacker.yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(attacker.yaw)*Math.cos(pitch));
    }
    const maxRange = char.skillRange || 55;
    const hitRadius = (char.skillHitRadius || 1.3) + TARGET_HIT_RADIUS;

    // 1) does it hit a player first?
    let hitTarget = null, hitDist = maxRange;
    for(const t of players){
      if(t === attacker || !t.alive) continue;
      if(isFriendlyFire(attacker, t)) continue;
      const tt = rayHitsBody(origin, aimDir, t.pos, hitRadius, hitDist);
      if(tt === null) continue;
      hitDist = tt; hitTarget = t;
    }

    if(hitTarget){
      const hitPoint = new THREE.Vector3(hitTarget.pos.x, hitTarget.pos.y+1.0, hitTarget.pos.z);
      spawnTracer(origin, hitPoint);
      // pull them in only as far as the attacker's own normal attack range,
      // so they land right in melee follow-up distance, not on top of you
      const pullToDist = char.attackRange || 3;
      const awayDir = new THREE.Vector3(hitTarget.pos.x-attacker.pos.x, 0, hitTarget.pos.z-attacker.pos.z);
      const dist0 = Math.max(0.001, awayDir.length());
      awayDir.normalize();
      const clampedDist = Math.min(dist0, pullToDist);
      const dest = new THREE.Vector3(
        attacker.pos.x + awayDir.x*clampedDist,
        attacker.pos.y,
        attacker.pos.z + awayDir.z*clampedDist
      );
      if(hitTarget.isRemote){
        netSendGrapplePull(hitTarget.netId, dest.x, dest.y, dest.z, computeDamageWithPassives(attacker, hitTarget, char.skillDamage));
      } else {
        startGrapplePull(hitTarget, dest);
        applyDamageLocal(hitTarget, computeDamageWithPassives(attacker, hitTarget, char.skillDamage), attacker);
      }
      spawnHitSpark(new THREE.Vector3(hitTarget.pos.x, hitTarget.pos.y+1.1, hitTarget.pos.z), 0xFFFFFF);
    } else {
      // 2) no player hit - did it hit the stage instead? if so, pull US there
      const hitPoint = raycastPlatformsForGrapple(origin, aimDir, maxRange);
      if(hitPoint){
        spawnTracer(origin, hitPoint);
        startGrapplePull(attacker, hitPoint);
      } else {
        spawnTracer(origin, origin.clone().addScaledVector(aimDir, maxRange));
      }
    }
  } else if(char.skillType === 'shieldbash'){
    attacker.attacking = 0.28;
    const distance = char.skillDashDistance || 8;
    const dest = new THREE.Vector3(
      attacker.pos.x + fwd.x*distance,
      attacker.pos.y,
      attacker.pos.z + fwd.z*distance
    );
    startGrapplePull(attacker, dest);
    attacker.pendingShieldBash = true;
    attacker.shieldBashHitSet = new Set();
    spawnPunchTrail(attacker, distance, fwd, 0x4D96FF);
  } else if(char.skillType === 'sleeporb'){
    // same style of shot as the normal attack (straight, then falls under
    // gravity), just a different color, and it puts whoever it touches to
    // sleep - either directly, or by catching them in the small explosion
    // it leaves wherever it lands
    attacker.attacking = 0.28;
    let orbStartPos = new THREE.Vector3(attacker.pos.x, attacker.pos.y+1.05, attacker.pos.z);
    if(attacker.mesh.userData.handR){
      attacker.mesh.userData.handR.getWorldPosition(orbStartPos);
    }
    let orbOrigin = new THREE.Vector3(attacker.pos.x, attacker.pos.y+1.05, attacker.pos.z);
    let orbAimFwd = fwd.clone();
    if(attacker.isLocal){
      orbOrigin = camera.position.clone();
      orbAimFwd = new THREE.Vector3();
      camera.getWorldDirection(orbAimFwd);
    } else {
      const pitch = attacker.aimPitch || 0;
      orbAimFwd = new THREE.Vector3(Math.sin(attacker.yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(attacker.yaw)*Math.cos(pitch));
    }
    // aim FROM where the orb actually starts (the hand) TOWARD the exact
    // point the crosshair is looking at - find whoever's actually under the
    // crosshair first (same approach as the normal attack), otherwise this
    // would always aim at the far max-range point and badly miss anyone
    // standing closer than that
    const orbRange = char.skillOrbRange || char.attackRange || 45;
    let hitDist = orbRange;
    for(const target of players){
      if(target === attacker || !target.alive) continue;
      if(isFriendlyFire(attacker, target)) continue;
      const t = rayHitsBody(orbOrigin, orbAimFwd, target.pos, 0.6 + TARGET_HIT_RADIUS, hitDist);
      if(t === null) continue;
      if(t < hitDist) hitDist = t;
    }
    const orbTargetPoint = orbOrigin.clone().addScaledVector(orbAimFwd, hitDist);
    const orbDir = orbTargetPoint.clone().sub(orbStartPos).normalize();
    spawnOrbProjectile(attacker, orbStartPos, orbDir, char, {
      color: 0x9B59E0, glowColor: 0xC9A0F5,
      damage: char.skillDamage, hitRadius: char.skillHitRadius,
      knockback: char.skillKnockback, knockUp: char.skillKnockUp,
      speed: char.skillOrbSpeed || char.attackOrbSpeed,
      straightDist: char.skillStraightDistance || char.attackStraightDistance,
      sleepDuration: char.skillSleepDuration || 2,
      explosionOnFloor: true, explosionRadius: char.skillExplosionRadius || 2,
    });
    playPewSound(0.38, 1700, 260, 0.19);
  } else if(char.skillType === 'unibeam'){
    attacker.attacking = 0.28;

    let origin = new THREE.Vector3(attacker.pos.x, attacker.pos.y+1.05, attacker.pos.z);
    let aimDir = fwd.clone();
    if(attacker.isLocal){
      origin = camera.position.clone();
      aimDir = new THREE.Vector3();
      camera.getWorldDirection(aimDir);
    } else {
      const pitch = attacker.aimPitch || 0;
      aimDir = new THREE.Vector3(Math.sin(attacker.yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(attacker.yaw)*Math.cos(pitch));
    }
    const maxRange = char.skillRange || 26;
    const hitRadius = (char.skillHitRadius || 1.6) + TARGET_HIT_RADIUS;

    let beamStartPos = new THREE.Vector3(attacker.pos.x, attacker.pos.y+1.18, attacker.pos.z);
    if(attacker.mesh.userData.arcReactor){
      attacker.mesh.userData.arcReactor.getWorldPosition(beamStartPos);
    }
    spawnBeamEffect(beamStartPos, origin.clone().addScaledVector(aimDir, maxRange), 0xBFEFFF, 0.32, 0.3);

    for(const target of players){
      if(target === attacker || !target.alive) continue;
      if(isFriendlyFire(attacker, target)) continue;
      const t = rayHitsBody(origin, aimDir, target.pos, hitRadius, maxRange);
      if(t === null) continue;
      const dirToTarget = new THREE.Vector3(target.pos.x-attacker.pos.x, 0, target.pos.z-attacker.pos.z).normalize();
      applyHit(attacker, target, dirToTarget, char.skillKnockback, char.skillKnockUp, computeDamageWithPassives(attacker, target, char.skillDamage));
    }
  }
}

// 龍墜 (Dragon Fall): a circular shockwave centered on wherever the leap
// comes back down, damaging and knocking back anyone caught in the radius.
// シールドチャージ: dash to a stop, then bash anyone caught nearby at the end
// シールドチャージ(スキル2)・シールドバッシュ(スキル1)共通の突進着弾処理
// アイアンフィストの通常攻撃など、突進しながらのパンチが、ボタンを押した
// 瞬間だけでなく突進で前進している間もずっと道中の敵に当たるようにする
function updatePunchLungeHits(p, dt){
  if(!(p.punchLungeTimer > 0)) return;
  p.punchLungeTimer -= dt;
  const char = p.character;
  if(!char || !p.alive){ p.punchLungeTimer = 0; return; }
  if(!p.punchLungeHitSet) p.punchLungeHitSet = new Set();
  const fwd = new THREE.Vector3(Math.sin(p.yaw), 0, Math.cos(p.yaw));
  for(const target of players){
    if(target === p || !target.alive || p.punchLungeHitSet.has(target)) continue;
    if(isFriendlyFire(p, target)) continue;
    const toTarget = new THREE.Vector3(target.pos.x-p.pos.x, 0, target.pos.z-p.pos.z);
    const dist = toTarget.length();
    if(dist > char.attackRange + TARGET_HIT_RADIUS || dist < 0.0001) continue;
    const dirToTarget = toTarget.clone().normalize();
    const ang = Math.acos(THREE.MathUtils.clamp(fwd.dot(dirToTarget), -1, 1));
    if(ang > char.attackAngle/2) continue;
    p.punchLungeHitSet.add(target);
    applyHit(p, target, dirToTarget, char.knockback, char.knockUp, computeDamageWithPassives(p, target, char.attackDamage));
  }
}

function triggerBashImpact(attacker, radius, damage, knockback, knockUp, hitSet, onHit){
  for(const target of players){
    if(target === attacker || !target.alive) continue;
    if(hitSet && hitSet.has(target)) continue;
    if(isFriendlyFire(attacker, target)) continue;
    const dx = target.pos.x-attacker.pos.x, dz = target.pos.z-attacker.pos.z;
    const dist = Math.hypot(dx, dz);
    if(dist > radius + TARGET_HIT_RADIUS || dist < 0.0001) continue;
    const dir = new THREE.Vector3(dx, 0, dz).normalize();
    applyHit(attacker, target, dir, knockback, knockUp, computeDamageWithPassives(attacker, target, damage));
    if(onHit) onHit(target);
  }
}

function triggerDragonfallLanding(attacker){
  const char = attacker.character;
  if(!char) return;
  const radius = char.skill2Radius || 8;
  const directRadius = char.skill2DirectRadius || 2;
  spawnAoeBurst(new THREE.Vector3(attacker.pos.x, attacker.pos.y+0.15, attacker.pos.z), radius, 0xFFD93D);
  attacker.dragonfallLandPoseTimer = 0.4;
  for(const target of players){
    if(target === attacker || !target.alive) continue;
    if(isFriendlyFire(attacker, target)) continue;
    const dx = target.pos.x-attacker.pos.x, dz = target.pos.z-attacker.pos.z;
    const dist = Math.hypot(dx, dz);
    if(dist > radius + TARGET_HIT_RADIUS || dist < 0.0001) continue;
    const dir = new THREE.Vector3(dx, 0, dz).normalize();
    const dmg = dist <= directRadius ? (char.skill2DamageDirect || 100) : (char.skill2Damage || 40);
    applyHit(attacker, target, dir, char.skill2Knockback, char.skill2KnockUp, computeDamageWithPassives(attacker, target, dmg));
  }
}

// シールドアサルト: 一定時間、前方に走り続ける突進状態を開始/終了する
function startAssault(p){
  p.assaultActive = true;
  p.assaultTimer = (p.character && p.character.assaultDuration) || 6;
  p.assaultHitCooldowns = new Map();
}
function endAssault(p){
  p.assaultActive = false;
  p.assaultTimer = 0;
  p.skill2Cooldown = (p.character && p.character.skill2CooldownMax) || 12;
  if(p.mesh.userData.shieldMesh2) p.mesh.userData.shieldMesh2.visible = true;
  if(p.isLocal) updateSkillCooldownUI();
}

// 空中ホバー: 高く飛び上がり、頂点に達したらその高さで静止する
function startHover(p){
  p.hoverActive = true;
  p.hoverPhase = 'ascending';
  // always end up hovering at the same absolute height, whether this was
  // used standing on the ground or already mid-air - work out the launch
  // speed needed to just barely reach that fixed target from wherever we
  // are right now, instead of always launching at a fixed speed (which
  // made using it mid-jump overshoot higher than using it from the ground)
  const groundY = STAGE_HEIGHT + 0.155;
  const riseHeight = (p.character && p.character.hoverRiseHeight) || 7;
  const targetY = groundY + riseHeight;
  const heightNeeded = Math.max(0.1, targetY - p.pos.y);
  p.vel.y = Math.sqrt(2 * Math.abs(GRAVITY) * heightNeeded);
  p.hoverTargetY = targetY;
  p.vel.x *= 0.4; p.vel.z *= 0.4;
  p.onGround = false;
}
function endHover(p){
  p.hoverActive = false;
  p.hoverPhase = null;
  p.hoverTimer = 0;
  p.skill2Cooldown = (p.character && p.character.skill2CooldownMax) || 10;
  if(p.isLocal) updateSkillCooldownUI();
  // 保険: ボットがホバー中に何らかの理由で足場の外へ流されていた場合、
  // 終了した瞬間にそのまま奈落へ落ちてしまわないよう、最寄りの足場の
  // 真上に位置を戻す
  if(p.isBot){
    let onPlatform = false;
    let nearest = null, nearestD = Infinity;
    for(const pl of platforms){
      const d = Math.hypot(p.pos.x-pl.x, p.pos.z-pl.z);
      if(d < pl.radius) onPlatform = true;
      if(d < nearestD){ nearestD = d; nearest = pl; }
    }
    if(!onPlatform && nearest){
      p.pos.x = nearest.x;
      p.pos.z = nearest.z;
    }
  }
}

function trySkill2(attacker){
  const char = attacker.character;
  if(!char || !char.skill2Type || attacker.skill2Cooldown > 0 || !attacker.alive || attacker.hitstun > 0) return;
  // ホバー/アサルト中にまた発動要求が来た場合は、新たに開始せず解除する
  // (クールタイムが「終了時」にしか始まらないため、そうしないと発動要求が
  // 繰り返し来るたびに再スタートしてしまい、無限に継続してしまうバグになる)
  if(char.skill2Type === 'hover' && attacker.hoverActive){
    endHover(attacker);
    return;
  }
  if(char.skill2Type === 'assault' && attacker.assaultActive){
    endAssault(attacker);
    return;
  }
  // シールドアサルト・空中ホバーは開始時ではなく、終了/解除した瞬間にクールタイムが始まる
  if(char.skill2Type !== 'assault' && char.skill2Type !== 'hover'){
    attacker.skill2Cooldown = withCooldownExtension(attacker, char.skill2CooldownMax || 5);
  }

  if(char.skill2Type === 'smoke'){
    // ローカルプレイヤーは押しっぱなし操作で直接throwSmokeを呼ぶので、
    // ここを通るのはボットだけ
    throwSmoke(attacker);
  } else if(char.skill2Type === 'dash'){
    // dash the way the move stick is tilted; if it's centered, dash the way
    // we're currently facing (the camera direction, since everyone always
    // faces the camera now)
    let dashDirX, dashDirZ;
    if(attacker.isLocal){
      const mag = Math.hypot(attacker.moveInput.x, attacker.moveInput.y);
      if(mag > 0.08){
        const camForward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
        const camRight = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));
        const dir = new THREE.Vector3();
        dir.addScaledVector(camForward, attacker.moveInput.y);
        dir.addScaledVector(camRight, attacker.moveInput.x);
        if(dir.lengthSq() > 0.0001){ dir.normalize(); dashDirX = dir.x; dashDirZ = dir.z; }
      }
    } else if(attacker.moveInput.worldDir){
      dashDirX = attacker.moveInput.worldDir.x;
      dashDirZ = attacker.moveInput.worldDir.z;
    }
    if(dashDirX === undefined){
      dashDirX = Math.sin(attacker.yaw);
      dashDirZ = Math.cos(attacker.yaw);
    }
    // a real short-range blink: move a fixed, reliable distance instead of
    // just adding velocity (which was getting damped away almost
    // immediately by the normal movement blending)
    const distance = char.skill2DashDistance || 11;
    const dest = new THREE.Vector3(
      attacker.pos.x + dashDirX*distance,
      attacker.pos.y,
      attacker.pos.z + dashDirZ*distance
    );
    startGrapplePull(attacker, dest);
  } else if(char.skill2Type === 'assault'){
    startAssault(attacker);
  } else if(char.skill2Type === 'hover'){
    startHover(attacker);
  } else if(char.skill2Type === 'dragonfall'){
    // leap high into the air - the actual shockwave triggers on landing,
    // handled in updatePlayer where ground contact is detected
    attacker.vel.y = char.skill2JumpForce || 24;
    attacker.vel.x *= 0.3; attacker.vel.z *= 0.3; // kill most horizontal drift for a mostly-vertical leap
    attacker.onGround = false;
    attacker.pendingDragonfall = true;
    attacker.dragonfallApexDone = false;
    spawnVerticalStreak(attacker.pos, 1, 0xFFD93D); // launch - shoots upward
  } else if(char.skill2Type === 'chargebash'){
    // dash forward and slam down wherever it ends - the actual AOE hit is
    // resolved once the dash/grapple finishes (see the pendingChargeBash
    // check in the grapple-completion code)
    attacker.attacking = 0.28;
    // aim in full 3D (including looking up/down), not just flat forward
    let bashFwd;
    if(attacker.isLocal){
      bashFwd = new THREE.Vector3();
      camera.getWorldDirection(bashFwd);
    } else {
      const pitch = attacker.aimPitch || 0;
      bashFwd = new THREE.Vector3(Math.sin(attacker.yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(attacker.yaw)*Math.cos(pitch));
    }
    const distance = char.skill2DashDistance || 8;
    // clamp how far down the dash can plunge - going through solid ground
    // (or worse, all the way into the void) is not what "aim downward"
    // should mean here, so cap the vertical drop to something modest
    let dirY = bashFwd.y;
    if(dirY*distance < -2) dirY = -2/distance;
    const dashDir3 = new THREE.Vector3(bashFwd.x, dirY, bashFwd.z);
    // check the whole dash path (not just where it ends up) for solid
    // ground/pillars in the way - including the SIDE of a pillar, not just
    // clipping down into its top - and stop just short of it instead of
    // teleporting straight through
    const blockDist = findStageBlockDistance(attacker.pos, dashDir3, distance);
    const actualDistance = blockDist !== null ? Math.max(0.3, blockDist - 0.6) : distance;
    const dest = new THREE.Vector3(
      attacker.pos.x + dashDir3.x*actualDistance,
      attacker.pos.y + dashDir3.y*actualDistance,
      attacker.pos.z + dashDir3.z*actualDistance
    );
    // extra safety: if the (possibly shortened) destination still ends up
    // inside a pillar's footprint below its surface, snap up onto it
    // rather than leaving the character buried in solid ground
    for(const pl of platforms){
      const ddx = dest.x-pl.x, ddz = dest.z-pl.z;
      if(Math.hypot(ddx,ddz) < pl.radius && dest.y < pl.topY){
        dest.y = pl.topY;
        break;
      }
    }
    startGrapplePull(attacker, dest);
    attacker.pendingChargeBash = true;

    // pull out the bo staff for the duration of the dash, and swing it in
    // a big arc like Daredevil's normal attack
    const staff = attacker.mesh.userData.gambitStaff;
    if(staff){
      staff.visible = true;
      if(attacker.gambitStaffHideTimer) clearTimeout(attacker.gambitStaffHideTimer);
      attacker.gambitStaffHideTimer = setTimeout(()=>{ staff.visible = false; }, 900);
    }
    spawnChainSwingTrail(attacker, distance*1.1);
    spawnPunchTrail(attacker, distance, new THREE.Vector3(bashFwd.x, 0, bashFwd.z).normalize(), 0xCF6FFF);
  } else if(char.skill2Type === 'aoe'){
    spawnAoeBurst(new THREE.Vector3(attacker.pos.x, attacker.pos.y+0.15, attacker.pos.z), char.skill2Radius, 0x9B7EDE);
    for(const target of players){
      if(target === attacker || !target.alive) continue;
      if(isFriendlyFire(attacker, target)) continue;
      const toTarget = new THREE.Vector3(target.pos.x-attacker.pos.x, 0, target.pos.z-attacker.pos.z);
      const dist = toTarget.length();
      if(dist > char.skill2Radius || dist < 0.0001) continue;
      const dirToTarget = toTarget.clone().normalize();
      applyHit(attacker, target, dirToTarget, char.skill2Knockback, char.skill2KnockUp, computeDamageWithPassives(attacker, target, char.skill2Damage));
      // パニックウェーブ: 当たった相手を一定時間鈍足にし、スキルのクール
      // タイムも延長して混乱させる
      if(char.skill2SlowMult){
        target.slowMult = char.skill2SlowMult;
        target.slowUntil = nowSec() + (char.skill2SlowDuration || 3);
      }
      if(char.skill2CooldownExtend){
        // 当たった瞬間ではなく、この後6秒の間にクールタイムに入った技を
        // 延長する(withCooldownExtensionが実際の設定箇所でチェックする)
        target.cooldownExtendUntil = nowSec() + (char.skill2CooldownExtendWindow || 6);
        target.cooldownExtendAmount = char.skill2CooldownExtend;
        // 既にクールタイム中の技があれば、それも今から延長しておく
        if(target.skillCooldown > 0) target.skillCooldown += char.skill2CooldownExtend;
        if(target.skill2Cooldown > 0) target.skill2Cooldown += char.skill2CooldownExtend;
      }
    }
  }
}

/* ---------------- AI (bots) ---------------- */
function updateBotAI(p, dt){
  p.aiTimer -= dt;
  p.aiFacingLock = false;

  // ホバー中(空中静止フェーズ)は、移動先を追いかけて足場の外へ流されて
  // しまうと、ホバーが終わった瞬間に足場のない空中から落下してしまう。
  // ホバー中は移動だけ止め、攻撃などは通常通り行う。
  const isHoveringInPlace = p.hoverActive && p.hoverPhase === 'hovering';
  if(isHoveringInPlace) p.moveInput.worldDir = null;

  // which platform are we standing on right now (if any)?
  let currentPlatform = null;
  for(const pl of platforms){
    const d = Math.hypot(p.pos.x-pl.x, p.pos.z-pl.z);
    if(d < pl.radius && Math.abs(p.pos.y-pl.topY) < 0.6){ currentPlatform = pl; break; }
  }

  if(!isHoveringInPlace && (p.aiTimer <= 0 || !p.aiTarget)){
    // only consider platforms that are actually within a safe, jumpable gap
    // from here, so bots don't attempt (and fail) huge leaps into the void
    let candidates = platforms;
    if(currentPlatform){
      candidates = platforms.filter(pl=>{
        if(pl === currentPlatform) return false;
        const centerDist = Math.hypot(pl.x-currentPlatform.x, pl.z-currentPlatform.z);
        const gap = centerDist - pl.radius - currentPlatform.radius;
        return gap < 4.5;
      });
      if(candidates.length === 0) candidates = [currentPlatform]; // boxed in - just stay put
    }

    // melee/short-range characters lean toward hunting the nearest enemy
    // instead of wandering fully at random, so they actually close distance
    // and fight; kept modest so bots don't all pile onto one target
    const attackRange = (p.character && p.character.attackRange) || ATTACK_RANGE;
    const isMelee = attackRange < 6;
    let picked = null;
    if(isMelee && Math.random() < 0.45){
      let nearestEnemy = null, nearestD = Infinity;
      for(const other of players){
        if(other === p || !other.alive || other.isDummy) continue;
        const d = Math.hypot(other.pos.x-p.pos.x, other.pos.z-p.pos.z);
        if(d < nearestD){ nearestD = d; nearestEnemy = other; }
      }
      if(nearestEnemy){
        let crowd = 0;
        for(const other of players){
          if(other === p || !other.isBot || !other.alive) continue;
          if(Math.hypot(other.pos.x-nearestEnemy.pos.x, other.pos.z-nearestEnemy.pos.z) < 6) crowd++;
        }
        if(crowd < 2){
          if(currentPlatform && nearestD < currentPlatform.radius*1.3){
            picked = currentPlatform;
          } else {
            let enemyPlat = null, bestD = Infinity;
            for(const pl of platforms){
              const d = Math.hypot(nearestEnemy.pos.x-pl.x, nearestEnemy.pos.z-pl.z);
              if(d < bestD){ bestD = d; enemyPlat = pl; }
            }
            if(enemyPlat && candidates.includes(enemyPlat)) picked = enemyPlat;
          }
        }
      }
    }
    p.aiTarget = picked || candidates[Math.floor(Math.random()*candidates.length)];
    p.aiTimer = 1.4 + Math.random()*1.8;
  }
  let dist = 0;
  if(isHoveringInPlace || !p.aiTarget){
    p.moveInput.worldDir = null;
  } else {
    const tx = p.aiTarget.x, tz = p.aiTarget.z;
    const dx = tx - p.pos.x, dz = tz - p.pos.z;
    dist = Math.hypot(dx,dz);
    if(dist > 0.6){
      // move dir in world space -> convert to a "moveInput" relative to nothing; bots move directly in world space
      p.moveInput.worldDir = {x: dx/dist, z: dz/dist};
    } else {
      p.moveInput.worldDir = null;
    }
  }

  // jump only when actually heading toward a different platform and near
  // our current platform's edge - not randomly, and not just because we're
  // standing near an edge for some unrelated reason
  if(p.onGround && currentPlatform && p.aiTarget !== currentPlatform && dist > 1){
    const d = Math.hypot(p.pos.x-currentPlatform.x, p.pos.z-currentPlatform.z);
    if(d > currentPlatform.radius - 1.2){
      p.wantJump = true;
    }
  }

  // attack (and occasionally use skill) on nearby alive players
  const range = (p.character && p.character.attackRange) || ATTACK_RANGE;
  // スキルの射程は通常攻撃と違うことが多い(例: デアデビルのチェインプルは
  // 通常攻撃よりずっと長い)ので、スキル発動の判定はそれ専用の距離で見る
  const skillRange = (p.character && (p.character.skillRange || p.character.skillRadius)) || range;
  const skill2Range = (p.character && p.character.skill2Range) || range;
  let dangerNearby = false;
  let nearestEnemyDist = Infinity;
  // ボット対戦は基本的にプレイヤーの練習台なので、始まった瞬間からボット
  // 同士が一気に潰し合うと面白くない。開始5秒間だけ攻撃頻度を控えめにする
  const earlyFightMult = (nowSec() - roundFightStartedAt < 5) ? 0.35 : 1;
  const charId = p.character && p.character.id;
  const isRanged = range > 15;
  // 遠距離キャラは近接キャラが距離を詰める時間を作れるよう連射は抑えつつ、
  // たまには当たるくらいの頻度に
  const attackChance = (isRanged ? 0.032 : 0.05) * earlyFightMult;
  for(const other of players){
    if(other===p || !other.alive) continue;
    const dxz = Math.hypot(other.pos.x-p.pos.x, other.pos.z-p.pos.z);
    const dy = (other.pos.y+1.0) - (p.pos.y+1.05);
    const d3 = Math.hypot(dxz, dy);
    // 龍盾は近距離だけでなく、相手の攻撃射程内に入っている遠距離の脅威にも
    // 反応して構えられるようにする
    const otherRange = (other.character && other.character.attackRange) || 6;
    if(dxz < 6){
      dangerNearby = true; // always treat close-range enemies as danger
    } else if(dxz < otherRange*0.9){
      // a long-range enemy is within their firing distance - only count it
      // as danger if they're actually facing roughly toward us (i.e. likely
      // aiming/about to shoot), not just "somewhere far away in range"
      const dirToUs = Math.atan2(p.pos.x-other.pos.x, p.pos.z-other.pos.z);
      let angDiff = Math.abs(other.yaw - dirToUs);
      if(angDiff > Math.PI) angDiff = 2*Math.PI - angDiff;
      if(angDiff < 0.5) dangerNearby = true; // roughly facing us (~28 degrees)
    }
    if(dxz < nearestEnemyDist) nearestEnemyDist = dxz;
    if(d3 < range*0.9){
      // yaw/pitch here stay perfectly clean (used for facing + animation
      // every frame) - the inaccuracy jitter is generated separately below,
      // only at the instant a shot is actually fired, so the character
      // doesn't visibly shake every frame from the aim randomness
      p.yaw = Math.atan2(other.pos.x-p.pos.x, other.pos.z-p.pos.z);
      p.aiFacingLock = true; // keep facing this target for the rest of this frame
      p.aimPitch = Math.atan2(dy, Math.max(0.001, dxz));
      if(Math.random() < attackChance){
        p.wantAttack = true;
        if(isRanged){
          const inaccuracy = Math.min(0.22, dxz*0.01);
          p.aimJitterYaw = (Math.random()-0.5)*inaccuracy*2;
          p.aimJitterPitch = (Math.random()-0.5)*inaccuracy;
        } else {
          p.aimJitterYaw = 0; p.aimJitterPitch = 0;
        }
      }
    }
    // スキルは通常攻撃と射程が違うことがあるので、別の距離判定を使う
    if(d3 < skillRange*0.9 || d3 < skill2Range*0.9){
      p.yaw = Math.atan2(other.pos.x-p.pos.x, other.pos.z-p.pos.z);
      p.aiFacingLock = true;
      p.aimPitch = Math.atan2(dy, Math.max(0.001, dxz));
      // some skills are disabled for bots specifically (too strong/buggy
      // for bots to use well right now)
      if(charId !== 'captain' && charId !== 'ironman' && d3 < skillRange*0.9){
        if(Math.random() < 0.015*earlyFightMult) p.wantSkill = true;
      }
      if(charId !== 'captain' && d3 < skill2Range*0.9){
        if(Math.random() < 0.015*earlyFightMult) p.wantSkill2 = true;
      }
    }
  }
  // Dragon Shield (Iron Fist) is a hold-to-block ability with no equivalent
  // in the normal skill queue, so bots need their own logic for it: raise
  // it while still closing the distance on an enemy, then drop it once
  // actually within attack range so they swing instead of just blocking
  // forever.
  if(p.character && p.character.skillType === 'shield'){
    const lockedOut = p.shieldBrokenUntil && nowSec() < p.shieldBrokenUntil;
    p.shieldActive = !lockedOut && dangerNearby && nearestEnemyDist > range*0.9;
  }
  // スティッキーカード(ガンビット)を刺したままにせず、近くに敵がいる時に
  // たまに起爆させるボット専用ロジック
  if(p.character && p.character.skillType === 'stickycard' && p.stickyCards && p.stickyCards.length > 0 && dangerNearby){
    if(Math.random() < 0.02*earlyFightMult) detonateStickyCards(p);
  }
}

/* ---------------- Main update ---------------- */
const clock = new THREE.Clock();
let gameStarted = false;

function updateRemoteVisual(p, dt){
  if(!p.net) return;
  const k = Math.min(1, dt*10);
  const dxMove = p.net.x - p.pos.x, dzMove = p.net.z - p.pos.z;
  p.pos.x += dxMove * k;
  p.pos.y += (p.net.y - p.pos.y) * k;
  p.pos.z += dzMove * k;

  let dyaw = p.net.yaw - p.yaw;
  while(dyaw > Math.PI) dyaw -= Math.PI*2;
  while(dyaw < -Math.PI) dyaw += Math.PI*2;
  p.yaw += dyaw * k;

  p.mesh.visible = p.alive;
  p.mesh.position.copy(p.pos);
  p.mesh.rotation.y = p.yaw;

  const spd = Math.hypot(dxMove, dzMove);
  if(spd > 0.02){
    p.walkPhase += dt*10;
    const swing = Math.sin(p.walkPhase)*0.5;
    p.mesh.userData.legL.rotation.x = swing;
    p.mesh.userData.legR.rotation.x = -swing;
    if(p.attacking <= 0){
      p.mesh.userData.armL.rotation.x = -swing*1.3;
      p.mesh.userData.armR.rotation.x = swing*1.3;
    }
  } else {
    p.mesh.userData.legL.rotation.x *= 0.8;
    p.mesh.userData.legR.rotation.x *= 0.8;
  }
  if(p.dragonfallLandPoseTimer > 0){
    p.dragonfallLandPoseTimer -= dt;
    const lt = THREE.MathUtils.clamp(p.dragonfallLandPoseTimer / 0.4, 0, 1);
    const leased = lt*lt; // ease out quickly back to neutral
    p.mesh.userData.armR.rotation.x = -0.9 * leased;
    p.mesh.userData.armR.rotation.z = 0.5 * leased;
    p.mesh.userData.armL.rotation.x = -0.9 * leased;
    p.mesh.userData.armL.rotation.z = -0.5 * leased;
    p.mesh.userData.legL.rotation.x = 0.5 * leased;
    p.mesh.userData.legR.rotation.x = -0.5 * leased;
  } else if(p.attacking > 0){
    p.attacking -= dt;
    const t = 1 - Math.max(0,p.attacking)/0.28;
    const isChainWeapon = p.character && p.character.weapon === 'chain';
    const isBeamWeapon = p.character && p.character.weapon === 'beam';
    if(isChainWeapon){
      p.mesh.userData.armR.rotation.x = -0.15 - 0.2*Math.sin(t*Math.PI);
      p.mesh.userData.armR.rotation.y = 0.35 * Math.sin(t*Math.PI*0.9 - 0.3);
      p.mesh.userData.armL.rotation.x = -0.5 * Math.sin(t*Math.PI);
      p.mesh.userData.armL.rotation.z = 0.7 * Math.sin(t*Math.PI);
    } else if(isBeamWeapon){
      // raise the firing arm up to horizontal (parallel to the floor),
      // hold it there briefly while the beam fires, then lower it back down
      let raiseAmt;
      if(t < 0.15) raiseAmt = t/0.15;
      else if(t < 0.7) raiseAmt = 1;
      else raiseAmt = Math.max(0, 1 - (t-0.7)/0.3);
      const raiseAngle = -(Math.PI/2) * raiseAmt;
      const firingArm = p.attackingHandRight ? p.mesh.userData.armR : p.mesh.userData.armL;
      const restingArm = p.attackingHandRight ? p.mesh.userData.armL : p.mesh.userData.armR;
      firingArm.rotation.x = raiseAngle;
      firingArm.rotation.y = 0;
      restingArm.rotation.x *= 0.8;
    } else {
      // punchier 3-phase motion: wind up (pull back + cross the body),
      // then a fast snapping strike forward, then a smooth retraction -
      // instead of one plain sine swing
      // a long staff exaggerates this same rotation a lot more than a bare
      // fist does, so tone the extension down while one's actually out
      const staffOut = p.mesh.userData.gambitStaff && p.mesh.userData.gambitStaff.visible;
      const swingCap = staffOut ? 1.3 : 2.55;
      let swing, crossRot;
      if(t < 0.28){
        const wt = t/0.28;
        swing = -0.55 * wt;
        crossRot = 0.25 * wt;
      } else if(t < 0.55){
        const ft = (t-0.28)/0.27;
        const eased = 1 - Math.pow(1-ft, 4); // sharp ease-out = snappy strike
        swing = -0.55 + eased * swingCap;
        crossRot = 0.25 - eased * 0.45;
      } else {
        const rt = (t-0.55)/0.45;
        const eased = rt*rt*(3-2*rt); // smoothstep back to neutral
        swing = (-0.55 + swingCap) * (1-eased);
        crossRot = -0.2 * (1-eased);
      }
      p.mesh.userData.armR.rotation.x = -swing;
      p.mesh.userData.armR.rotation.y = crossRot;
      p.mesh.userData.armL.rotation.x = swing*0.25 - 0.15;
      p.mesh.userData.armL.rotation.z = -0.15;
    }
  } else if(p.assaultActive){
    // シールドアサルト: bring the right arm (holding the shield) in tight
    // across the belly, braced forward, while the shield itself is
    // repositioned separately (see updateAssaultShieldPose)
    const wobble = Math.sin(nowSec()*8) * 0.025;
    p.mesh.userData.armR.rotation.x = 0.75 + wobble;
    p.mesh.userData.armR.rotation.y = -0.5;
    p.mesh.userData.armR.rotation.z = 0.25;
    p.mesh.userData.armL.rotation.x = 0.35 - wobble;
    p.mesh.userData.armL.rotation.z = -0.15;
  } else if(p.shieldActive){
    // braced, crossed-arm guard stance while the shield is held up
    const wobble = Math.sin(nowSec()*5) * 0.03;
    p.mesh.userData.armR.rotation.x = 0.95 + wobble;
    p.mesh.userData.armR.rotation.y = -0.35;
    p.mesh.userData.armR.rotation.z = 0.12;
    p.mesh.userData.armL.rotation.x = 0.95 - wobble;
    p.mesh.userData.armL.rotation.y = 0.35;
    p.mesh.userData.armL.rotation.z = -0.12;
  } else if(p.chargingPunch && p.character && p.character.weapon === 'melee'){
    // holding the wind-up pose steady while the punch is charging, with a
    // faint tension wobble so it doesn't look frozen
    const wobble = Math.sin(nowSec()*14) * 0.03;
    p.mesh.userData.armR.rotation.x = 0.55 + wobble;
    p.mesh.userData.armR.rotation.y = -0.25;
    p.mesh.userData.armL.rotation.x = 0.15 - wobble*0.5;
    p.mesh.userData.armL.rotation.z = 0.15;
  } else if(p.character && p.character.weapon === 'chain'){
    p.mesh.userData.armL.rotation.z *= 0.8;
    p.mesh.userData.armR.rotation.x *= 0.8;
    p.mesh.userData.armR.rotation.y *= 0.8;
  } else {
    // nothing special going on - make sure any x/y/z rotation left over
    // from a guard stance, wind-up pose, or a state interrupted by death/
    // respawn (e.g. dying mid-Shield-Assault) actually decays back to
    // neutral, instead of staying stuck if the character never happens to
    // walk (which is what normally resets rotation.x via the walk-cycle)
    p.mesh.userData.armR.rotation.x *= 0.8;
    p.mesh.userData.armR.rotation.y *= 0.8;
    p.mesh.userData.armR.rotation.z *= 0.8;
    p.mesh.userData.armL.rotation.x *= 0.8;
    p.mesh.userData.armL.rotation.y *= 0.8;
    p.mesh.userData.armL.rotation.z *= 0.8;
  }
  updateChainWeaponVisual(p);
}

function updatePlayer(p, dt){
  if(p.isRemote){
    updateRemoteVisual(p, dt);
    return;
  }
  if(p.isDummy){
    updateDummyHpBar(p);
    return;
  }
  if(!p.alive){
    return;
  }

  if(p.isGrappled){
    p.grappleTimer -= dt;
    const frac = THREE.MathUtils.clamp(1 - Math.max(0,p.grappleTimer)/p.grappleDuration, 0, 1);
    const eased = Math.sin(frac*Math.PI/2);
    p.pos.lerpVectors(p.grappleFrom, p.grappleTo, eased);
    p.mesh.position.copy(p.pos);
    p.mesh.rotation.y = p.yaw;
    updateChainWeaponVisual(p);
    // シールドバッシュ: 突進が終わった瞬間だけでなく、移動中も道中の敵に当たる
    if(p.pendingShieldBash){
      if(!p.shieldBashHitSet) p.shieldBashHitSet = new Set();
      const char = p.character || {};
      const hitR = 1.3 + TARGET_HIT_RADIUS;
      for(const other of players){
        if(other === p || !other.alive || p.shieldBashHitSet.has(other)) continue;
        if(isFriendlyFire(p, other)) continue;
        const dx = other.pos.x-p.pos.x, dz = other.pos.z-p.pos.z;
        const dist = Math.hypot(dx, dz);
        if(dist > hitR) continue;
        p.shieldBashHitSet.add(other);
        const dir = dist > 0.0001 ? new THREE.Vector3(dx, 0, dz).normalize() : new THREE.Vector3(Math.sin(p.yaw),0,Math.cos(p.yaw));
        applyHit(p, other, dir, char.skillKnockback, char.skillKnockUp, computeDamageWithPassives(p, other, char.skillDamage));
      }
    }
    if(p.grappleTimer <= 0){
      p.isGrappled = false;
      if(p.pendingChargeBash){
        p.pendingChargeBash = false;
        triggerBashImpact(p, p.character.skill2Radius||3, p.character.skill2Damage, p.character.skill2Knockback, p.character.skill2KnockUp, null, (target)=>trackKineticCharge(p, target));
      }
      if(p.pendingShieldBash){
        p.pendingShieldBash = false;
        triggerBashImpact(p, p.character.skillRadius||3, p.character.skillDamage, p.character.skillKnockback, p.character.skillKnockUp, p.shieldBashHitSet);
        p.shieldBashHitSet = null;
      }
    }
    if(p.pos.y < FALL_Y){
      p.alive = false;
      p.mesh.visible = false;
      spawnFallBurst(new THREE.Vector3(p.pos.x, Math.max(p.pos.y,VOID_Y+2), p.pos.z), p);
      if(p.isLocal){
        youFellEl.classList.add('show');
        if(isPracticeMode){ setTimeout(respawnPracticePlayer, 1000); }
        else{ startSpectating(); }
      }
      refreshAliveChips();
      checkRoundOutcome();
    }
    return;
  }

  if(p.isBot){
    updateBotAI(p, dt);
  }

  // hitstun countdown (limited control while stunned)
  if(p.hitstun > 0) p.hitstun -= dt;

  // ----- compute desired horizontal move direction -----
  let moveX = 0, moveZ = 0;
  const controlFactor = p.onGround ? 1 : AIR_CONTROL;

  if(p.isLocal){
    const kb = keyboardVector();
    let ix = local.moveInput.x + kb.x;
    let iy = local.moveInput.y + kb.y;
    const mag = Math.hypot(ix,iy);
    if(mag > 1){ ix/=mag; iy/=mag; }
    const camForward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
    const camRight = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));
    if(mag > 0.05){
      const dir = new THREE.Vector3();
      dir.addScaledVector(camForward, iy);
      dir.addScaledVector(camRight, ix);
      if(dir.lengthSq() > 0.0001){
        dir.normalize();
        moveX = dir.x; moveZ = dir.z;
      }
    }
    // every character always aims with the camera now, so the crosshair
    // matches where attacks/skills actually go for everyone, not just guns
    p.yaw = camYaw + Math.PI;
  } else {
    if(p.moveInput.worldDir){
      moveX = p.moveInput.worldDir.x;
      moveZ = p.moveInput.worldDir.z;
      // don't stomp on the yaw the AI just aimed at an enemy to attack -
      // otherwise the attack/skill fires facing whichever way we happen to
      // be walking, not at the target we meant to hit
      if(!p.aiFacingLock) p.yaw = Math.atan2(moveX, moveZ);
    }
  }

  // フライトブースト: temporary flight window - timer runs out and it ends
  if(p.flightBoostActive){
    p.flightBoostTimer -= dt;
    if(p.flightBoostTimer <= 0){
      p.flightBoostActive = false;
      p.flightBoostTimer = 0;
    }
  }

  // 空中ホバー: 上昇中は普通に重力の影響を受け、頂点(上昇速度が0以下になった
  // 瞬間)に達したらその高さで静止し、10秒間ホバリングする
  let hoverSpeedMult = 1;
  if(p.hoverActive){
    if(p.hoverPhase === 'ascending'){
      if(p.vel.y <= 0){
        p.hoverPhase = 'hovering';
        p.hoverY = p.hoverTargetY != null ? p.hoverTargetY : p.pos.y;
        p.hoverTimer = (p.character && p.character.hoverDuration) || 10;
      }
    } else if(p.hoverPhase === 'hovering'){
      p.hoverTimer -= dt;
      p.vel.y = 0;
      p.pos.y = p.hoverY;
      hoverSpeedMult = (p.character && p.character.hoverMoveSpeedMult) || 0.4;
      if(p.hoverTimer <= 0){
        endHover(p);
      }
    }
  }

  // ユニビーム: charges up after releasing the button, then auto-fires.
  // While charging, movement/jump/gravity are all frozen - if used in
  // mid-air, the character just hovers in place until it fires.
  if(p.chargingUnibeam){
    p.unibeamChargeTimer -= dt;
    if(p.unibeamChargeTimer <= 0){
      p.chargingUnibeam = false;
      p.unibeamFrozenPos = null;
      if(p.alive && !attacksLocked) p.wantSkill = true;
    } else {
      moveX = 0; moveZ = 0;
      p.vel.set(0,0,0);
      if(p.unibeamFrozenPos) p.pos.copy(p.unibeamFrozenPos);
      p.mesh.position.copy(p.pos);
    }
  }

  // シールドアサルト: forced auto-run straight ahead while it's active
  if(p.assaultActive){
    moveX = Math.sin(p.yaw);
    moveZ = Math.cos(p.yaw);
    p.assaultTimer -= dt;
    if(p.assaultTimer <= 0){
      endAssault(p);
    } else {
      for(const other of players){
        if(other === p || !other.alive) continue;
        if(isFriendlyFire(p, other)) continue;
        const dist = Math.hypot(other.pos.x-p.pos.x, other.pos.z-p.pos.z);
        if(dist > 1.3 + TARGET_HIT_RADIUS) continue;
        const now = nowSec();
        if(!p.assaultHitCooldowns) p.assaultHitCooldowns = new Map();
        const lastHit = p.assaultHitCooldowns.get(other) || 0;
        if(now - lastHit < 0.6) continue;
        p.assaultHitCooldowns.set(other, now);
        const dir = new THREE.Vector3(other.pos.x-p.pos.x, 0, other.pos.z-p.pos.z);
        if(dir.lengthSq() < 0.0001) dir.set(Math.sin(p.yaw), 0, Math.cos(p.yaw)); else dir.normalize();
        const char = p.character || {};
        applyHit(p, other, dir, char.assaultKnockback||10, char.assaultKnockUp||4, computeDamageWithPassives(p, other, char.assaultCollisionDamage||30));
      }
    }
  }

  if(p.hitstun <= 0){
    const speedMult = (p.character && p.character.moveSpeedMult) || 1;
    const assaultMult = p.assaultActive ? ((p.character && p.character.assaultSpeedMult) || 1.25) : 1;
    const slowMult = (p.slowUntil && nowSec() < p.slowUntil) ? (p.slowMult || 1) : 1;
    const targetVelX = moveX * MOVE_SPEED * speedMult * assaultMult * hoverSpeedMult * slowMult;
    const targetVelZ = moveZ * MOVE_SPEED * speedMult * assaultMult * hoverSpeedMult * slowMult;
    p.vel.x += (targetVelX - p.vel.x) * Math.min(1, controlFactor * dt * 16);
    p.vel.z += (targetVelZ - p.vel.z) * Math.min(1, controlFactor * dt * 16);
  } else {
    // friction during hitstun
    p.vel.x *= 0.98; p.vel.z *= 0.98;
  }

  // walk animation
  const speed = Math.hypot(p.vel.x, p.vel.z);
  if(p.onGround && speed > 0.5){
    p.walkPhase += dt * speed * 0.9;
    const swing = Math.sin(p.walkPhase) * 0.55;
    p.mesh.userData.legL.rotation.x = swing;
    p.mesh.userData.legR.rotation.x = -swing;
    if(!p.attacking){
      p.mesh.userData.armL.rotation.x = -swing*1.3;
      p.mesh.userData.armR.rotation.x = swing*1.3;
    }
  } else {
    p.mesh.userData.legL.rotation.x *= 0.8;
    p.mesh.userData.legR.rotation.x *= 0.8;
    if(!p.attacking){
      p.mesh.userData.armL.rotation.x *= 0.8;
      p.mesh.userData.armR.rotation.x *= 0.8;
    }
  }

  // jump
  if(p.onGround){ p.flightBoostJumpUsed = false; p.airJumpSlowFall = false; }
  if(p.airJumpJetTimer > 0) p.airJumpJetTimer = Math.max(0, p.airJumpJetTimer - dt);
  updatePunchLungeHits(p, dt);
  if(p.wantJump){
    p.wantJump = false;
    if(p.hitstun <= 0 && !p.chargingUnibeam && !(p.hoverActive && p.hoverPhase === 'hovering')){
      if(p.onGround){
        p.vel.y = JUMP_SPEED;
        p.onGround = false;
      } else if(!p.flightBoostJumpUsed && (p.flightBoostActive || (p.character && p.character.passiveDoubleJump))){
        p.vel.y = JUMP_SPEED;
        p.flightBoostJumpUsed = true;
        if(p.character && p.character.passiveDoubleJump){
          p.airJumpSlowFall = true;
          p.airJumpJetTimer = 0.35;
        }
      }
    }
  }

  // attack
  if(p.wantAttack){
    p.wantAttack = false;
    if(p.hitstun <= 0 && !attacksLocked && !p.assaultActive && !p.shieldActive) tryAttack(p);
  }
  if(p.attackCooldown > 0) p.attackCooldown -= dt;

  // skill
  if(p.wantSkill){
    p.wantSkill = false;
    if(!attacksLocked && !p.assaultActive) trySkill(p);
  }
  if(p.skillCooldown > 0) p.skillCooldown -= dt;

  // スティッキーカードの弾数回復(専用のクールタイムで管理)
  if(p.character && p.character.skillType === 'stickycard'){
    const ammoMax = p.character.skillAmmoMax || 3;
    if(p.stickyAmmo < ammoMax){
      p.stickyAmmoRegenTimer += dt;
      if(p.stickyAmmoRegenTimer >= (p.character.skillAmmoRegenTime || 6)){
        p.stickyAmmoRegenTimer = 0;
        p.stickyAmmo = Math.min(ammoMax, p.stickyAmmo + 1);
      }
    } else {
      p.stickyAmmoRegenTimer = 0;
    }
  }

  // skill 2
  if(p.wantSkill2){
    p.wantSkill2 = false;
    if(!attacksLocked && !p.shieldActive) trySkill2(p);
  }
  if(p.skill2Cooldown > 0) p.skill2Cooldown -= dt;

  if(p.dragonfallLandPoseTimer > 0){
    p.dragonfallLandPoseTimer -= dt;
    const lt = THREE.MathUtils.clamp(p.dragonfallLandPoseTimer / 0.4, 0, 1);
    const leased = lt*lt; // ease out quickly back to neutral
    p.mesh.userData.armR.rotation.x = -0.9 * leased;
    p.mesh.userData.armR.rotation.z = 0.5 * leased;
    p.mesh.userData.armL.rotation.x = -0.9 * leased;
    p.mesh.userData.armL.rotation.z = -0.5 * leased;
    p.mesh.userData.legL.rotation.x = 0.5 * leased;
    p.mesh.userData.legR.rotation.x = -0.5 * leased;
  } else if(p.attacking > 0){
    p.attacking -= dt;
    const t = 1 - Math.max(0,p.attacking)/0.28;
    const isChainWeapon = p.character && p.character.weapon === 'chain';
    const isBeamWeapon = p.character && p.character.weapon === 'beam';
    if(isChainWeapon){
      // right arm stays put - it's the fixed axis. left arm snaps open/away,
      // like actually letting go of its rod.
      p.mesh.userData.armR.rotation.x = -0.15 - 0.2*Math.sin(t*Math.PI);
      p.mesh.userData.armR.rotation.y = 0.35 * Math.sin(t*Math.PI*0.9 - 0.3);
      p.mesh.userData.armL.rotation.x = -0.5 * Math.sin(t*Math.PI);
      p.mesh.userData.armL.rotation.z = 0.7 * Math.sin(t*Math.PI);
    } else if(isBeamWeapon){
      let raiseAmt;
      if(t < 0.15) raiseAmt = t/0.15;
      else if(t < 0.7) raiseAmt = 1;
      else raiseAmt = Math.max(0, 1 - (t-0.7)/0.3);
      const raiseAngle = -(Math.PI/2) * raiseAmt;
      const firingArm = p.attackingHandRight ? p.mesh.userData.armR : p.mesh.userData.armL;
      const restingArm = p.attackingHandRight ? p.mesh.userData.armL : p.mesh.userData.armR;
      firingArm.rotation.x = raiseAngle;
      firingArm.rotation.y = 0;
      restingArm.rotation.x *= 0.8;
    } else {
      // punchier 3-phase motion: wind up (pull back + cross the body),
      // then a fast snapping strike forward, then a smooth retraction -
      // instead of one plain sine swing
      // a long staff exaggerates this same rotation a lot more than a bare
      // fist does, so tone the extension down while one's actually out
      const staffOut = p.mesh.userData.gambitStaff && p.mesh.userData.gambitStaff.visible;
      const swingCap = staffOut ? 1.3 : 2.55;
      let swing, crossRot;
      if(t < 0.28){
        const wt = t/0.28;
        swing = -0.55 * wt;
        crossRot = 0.25 * wt;
      } else if(t < 0.55){
        const ft = (t-0.28)/0.27;
        const eased = 1 - Math.pow(1-ft, 4); // sharp ease-out = snappy strike
        swing = -0.55 + eased * swingCap;
        crossRot = 0.25 - eased * 0.45;
      } else {
        const rt = (t-0.55)/0.45;
        const eased = rt*rt*(3-2*rt); // smoothstep back to neutral
        swing = (-0.55 + swingCap) * (1-eased);
        crossRot = -0.2 * (1-eased);
      }
      p.mesh.userData.armR.rotation.x = -swing;
      p.mesh.userData.armR.rotation.y = crossRot;
      p.mesh.userData.armL.rotation.x = swing*0.25 - 0.15;
      p.mesh.userData.armL.rotation.z = -0.15;
    }
  } else if(p.assaultActive){
    // シールドアサルト: bring the right arm (holding the shield) in tight
    // across the belly, braced forward, while the shield itself is
    // repositioned separately (see updateAssaultShieldPose)
    const wobble = Math.sin(nowSec()*8) * 0.025;
    p.mesh.userData.armR.rotation.x = 0.75 + wobble;
    p.mesh.userData.armR.rotation.y = -0.5;
    p.mesh.userData.armR.rotation.z = 0.25;
    p.mesh.userData.armL.rotation.x = 0.35 - wobble;
    p.mesh.userData.armL.rotation.z = -0.15;
  } else if(p.shieldActive){
    // braced, crossed-arm guard stance while the shield is held up
    const wobble = Math.sin(nowSec()*5) * 0.03;
    p.mesh.userData.armR.rotation.x = 0.95 + wobble;
    p.mesh.userData.armR.rotation.y = -0.35;
    p.mesh.userData.armR.rotation.z = 0.12;
    p.mesh.userData.armL.rotation.x = 0.95 - wobble;
    p.mesh.userData.armL.rotation.y = 0.35;
    p.mesh.userData.armL.rotation.z = -0.12;
  } else if(p.chargingPunch && p.character && p.character.weapon === 'melee'){
    // holding the wind-up pose steady while the punch is charging, with a
    // faint tension wobble so it doesn't look frozen
    const wobble = Math.sin(nowSec()*14) * 0.03;
    p.mesh.userData.armR.rotation.x = 0.55 + wobble;
    p.mesh.userData.armR.rotation.y = -0.25;
    p.mesh.userData.armL.rotation.x = 0.15 - wobble*0.5;
    p.mesh.userData.armL.rotation.z = 0.15;
  } else if(p.character && p.character.weapon === 'chain'){
    p.mesh.userData.armL.rotation.z *= 0.8;
    p.mesh.userData.armR.rotation.x *= 0.8;
    p.mesh.userData.armR.rotation.y *= 0.8;
  } else {
    // nothing special going on - make sure any x/y/z rotation left over
    // from a guard stance, wind-up pose, or a state interrupted by death/
    // respawn (e.g. dying mid-Shield-Assault) actually decays back to
    // neutral, instead of staying stuck if the character never happens to
    // walk (which is what normally resets rotation.x via the walk-cycle)
    p.mesh.userData.armR.rotation.x *= 0.8;
    p.mesh.userData.armR.rotation.y *= 0.8;
    p.mesh.userData.armR.rotation.z *= 0.8;
    p.mesh.userData.armL.rotation.x *= 0.8;
    p.mesh.userData.armL.rotation.y *= 0.8;
    p.mesh.userData.armL.rotation.z *= 0.8;
  }

  // gravity
  const gravityMult = (p.hoverActive && p.hoverPhase === 'hovering') ? 0 : ((p.flightBoostActive || p.airJumpSlowFall) ? 0.5 : 1);
  p.vel.y += GRAVITY * gravityMult * dt;
  p.vel.y = Math.max(p.vel.y, -40);

  // 龍墜: the moment the leap crests and starts coming back down
  if(p.pendingDragonfall && !p.dragonfallApexDone && p.vel.y <= 0){
    p.dragonfallApexDone = true;
    spawnVerticalStreak(p.pos, -1, 0xFFD93D); // shoots downward
  }

  // integrate
  const prevY = p.pos.y;
  const wasOnGroundBeforeMove = p.onGround;
  p.pos.x += p.vel.x * dt;
  p.pos.y += p.vel.y * dt;
  p.pos.z += p.vel.z * dt;

  // collide with platforms
  resolvePlatformCollision(p, prevY);

  // 龍墜: if this jump was the Dragon Fall leap, trigger the shockwave the
  // instant we touch back down
  if(p.pendingDragonfall && !wasOnGroundBeforeMove && p.onGround){
    p.pendingDragonfall = false;
    triggerDragonfallLanding(p);
  }

  // update mesh
  p.mesh.position.copy(p.pos);
  p.mesh.rotation.y = p.yaw;
  updateChainWeaponVisual(p);

  // ユニビーム溜め中は、この一フレームの間に重力や移動で位置がずれていても
  // 最後に必ず固定位置へ戻す(浮遊がちらつかないように)
  if(p.chargingUnibeam && p.unibeamFrozenPos){
    p.pos.copy(p.unibeamFrozenPos);
    p.vel.set(0,0,0);
    p.mesh.position.copy(p.pos);
  }

  // 空中ホバー中も同様に、高さだけは最後に必ず固定し直す
  if(p.hoverActive && p.hoverPhase === 'hovering'){
    p.pos.y = p.hoverY;
    p.vel.y = 0;
    p.onGround = false;
    p.mesh.position.copy(p.pos);
  }

  // fell off?
  if(p.pos.y < FALL_Y){
    p.alive = false;
    p.mesh.visible = false;
    spawnFallBurst(new THREE.Vector3(p.pos.x, Math.max(p.pos.y,VOID_Y+2), p.pos.z), p);
    if(p.isLocal){
      youFellEl.classList.add('show');
      if(isChargingGrenade){ isChargingGrenade = false; clearGrenadePreview(); }
      if(isChargingSmoke){ isChargingSmoke = false; clearSmokePreview(); }
      if(isPracticeMode){ setTimeout(respawnPracticePlayer, 1000); }
      else{ startSpectating(); }
    }
    refreshAliveChips();
    checkRoundOutcome();
  }
}

function updateCamera(dt){
  // when spectating a fallen-off player, follow whoever we're watching instead
  const followTarget = (spectateTarget && spectateTarget.alive) ? spectateTarget : local;

  // camYaw / camPitch are set directly by the screen-swipe input above.
  // Looking steeply upward (camPitch toward CAM_PITCH_MIN) swings the
  // camera's orbit position below the character - and since the character's
  // feet sit right at the platform surface, "below the character" means
  // literally inside/under the solid platform mesh, showing nothing but
  // its underside. Floor the camera's height so it can never drop below a
  // small margin above the character - and raise the look target by that
  // same amount, so the actual viewing angle (and aim) stays correct
  // instead of flattening out once the position gets clamped.
  const horizDist = CAM_DIST * Math.cos(camPitch);
  const rawHeight = CAM_DIST * Math.sin(camPitch);
  const height = Math.max(rawHeight, 1.4);
  const heightLift = height - rawHeight; // how much we had to raise the camera to avoid the floor

  const back = new THREE.Vector3(Math.sin(camYaw)*horizDist, height, Math.cos(camYaw)*horizDist);

  // over-the-shoulder offset: shifts the player off to one side of the frame
  // so they (and, for gunners, the crosshair) aren't sitting dead-center.
  const camRightNow = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));
  const sideOffset = camRightNow.multiplyScalar(2.1);

  const desired = new THREE.Vector3(followTarget.pos.x, followTarget.pos.y, followTarget.pos.z).add(back).add(sideOffset);

  camPos.lerp(desired, Math.min(1, dt*10));
  camera.position.copy(camPos);

  const lookTarget = new THREE.Vector3(followTarget.pos.x, followTarget.pos.y + CAM_LOOK_HEIGHT + heightLift, followTarget.pos.z).add(sideOffset);
  camLook.lerp(lookTarget, Math.min(1, dt*10));
  camera.lookAt(camLook);
}

function isOnScreen(worldPos, camForward){
  const toTarget = new THREE.Vector3().subVectors(worldPos, camera.position);
  if(toTarget.dot(camForward) <= 0) return false; // behind the camera - definitely offscreen
  const p = worldPos.clone().project(camera);
  return p.x >= -1 && p.x <= 1 && p.y >= -1 && p.y <= 1;
}

// Daredevil's "レーダーセンス" (Radar Sense) passive: enemies who are off
// camera get a red directional marker pinned to the edge of the screen,
// pointing toward where they actually are.
// the "true" base color for each material slot, per character - used to
// restore normal colors for anyone not currently highlighted by smoke vision
function trueBodyColorHex(p){
  if(p.character && p.character.id === 'gunner') return 0x14161c;
  if(p.character && p.character.id === 'chainer') return 0xB01029;
  if(p.character && p.character.id === 'crusher') return 0x1F4A2E;
  if(p.character && p.character.id === 'captain') return 0x1B2A5E;
  if(p.character && p.character.id === 'ironman') return 0x9E1B1B;
  if(p.character && p.character.id === 'gambit') return 0x6B3F2A;
  if(p.character && p.character.id === 'mantis') return 0x3F8F5C;
  return p.color;
}
function trueHeadColorHex(p){
  if(p.character && p.character.id === 'chainer') return 0xB01029;
  if(p.character && p.character.id === 'gunner') return 0xE7B08C;
  if(p.character && p.character.id === 'crusher') return 0xF2C230;
  if(p.character && p.character.id === 'captain') return 0x1B2A5E;
  if(p.character && p.character.id === 'ironman') return 0xD32020;
  return 0xffffff;
}
function trueLegColorHex(p){
  if(p.character && p.character.id === 'chainer') return 0xB01029;
  if(p.character && p.character.id === 'crusher') return 0x1F4A2E;
  if(p.character && p.character.id === 'ironman') return 0x9E1B1B;
  return 0x2b2f45;
}

function isPositionInAnySmokeZone(pos){
  const now = nowSec();
  for(const z of activeSmokeZones){
    if(z.expireAt <= now) continue;
    if(Math.hypot(pos.x-z.x, pos.z-z.z) <= z.radius) return true;
  }
  return false;
}

// Radar Sense's second effect: enemies standing inside a smoke cloud are
// picked out in bright red so the smoke can't be used to hide from us -
// this is a purely local rendering tweak (each client colors what it sees),
// no network sync needed beyond already knowing where the smoke zones are.
function updateSmokeVisionHighlight(){
  const now = nowSec();
  if(activeSmokeZones.length && now % 5 < 0.05){
    activeSmokeZones = activeSmokeZones.filter(z => z.expireAt > now);
  }

  const active = !!(local.character && local.character.id === 'chainer' && local.alive);
  for(const t of players){
    if(t === local) continue;
    const inSmoke = active && t.alive && isPositionInAnySmokeZone(t.pos);
    if(t.mesh.userData.bodyMat){
      t.mesh.userData.bodyMat.color.setHex(inSmoke ? 0xFF2222 : trueBodyColorHex(t));
    }
    if(t.mesh.userData.headMat){
      t.mesh.userData.headMat.color.setHex(inSmoke ? 0xFF2222 : trueHeadColorHex(t));
    }
    if(t.mesh.userData.legMat){
      t.mesh.userData.legMat.color.setHex(inSmoke ? 0xFF2222 : trueLegColorHex(t));
    }
  }
}

// Shows a small icon+name tag floating above each player's head during the
// "3, 2, 1, START!" round-start countdown, so everyone can see who's who
// before the fight actually begins.
// A small blue dot floating above teammates' heads during a team battle, so
// they're easy to pick out at a glance.
function updateTeammateIndicators(){
  const container = document.getElementById('teammate-indicators');
  if(matchMode !== 'team' || !local.team || !local.alive){
    container.innerHTML = '';
    return;
  }
  const w = isForceRotated() ? innerHeight : innerWidth;
  const h = isForceRotated() ? innerWidth : innerHeight;
  container.innerHTML = '';

  for(const p of players){
    if(p === local || !p.alive || p.team !== local.team) continue;
    const headPos = new THREE.Vector3(p.pos.x, p.pos.y + 2.15, p.pos.z);
    const proj = headPos.clone().project(camera);
    if(proj.z > 1) continue;
    const px = (proj.x*0.5 + 0.5) * w;
    const py = (1 - (proj.y*0.5 + 0.5)) * h;
    if(px < -30 || px > w+30 || py < -30 || py > h+30) continue;

    const dot = document.createElement('div');
    dot.className = 'teammate-dot';
    dot.style.left = px + 'px';
    dot.style.top = py + 'px';
    container.appendChild(dot);
  }
}

function updatePlayerTags(){
  const container = document.getElementById('player-tags');
  // hide as soon as we reach the "START!" phase, not just after it's done
  if(roundStartTimer === null || roundStartTimer <= 0.6){
    container.style.display = 'none';
    container.innerHTML = '';
    return;
  }
  container.style.display = 'block';
  const w = isForceRotated() ? innerHeight : innerWidth;
  const h = isForceRotated() ? innerWidth : innerHeight;
  container.innerHTML = '';

  for(const p of players){
    if(!p.alive) continue;
    const headPos = new THREE.Vector3(p.pos.x, p.pos.y + 2.35, p.pos.z);
    const proj = headPos.clone().project(camera);
    if(proj.z > 1) continue; // behind the camera
    const px = (proj.x*0.5 + 0.5) * w;
    const py = (1 - (proj.y*0.5 + 0.5)) * h;
    if(px < -60 || px > w+60 || py < -60 || py > h+60) continue;

    const tag = document.createElement('div');
    tag.className = 'player-tag';
    tag.style.left = px + 'px';
    tag.style.top = py + 'px';

    const icon = document.createElement('div');
    icon.className = 'player-tag-icon';
    const iconUrl = p.isLocal ? customIconDataUrl : p.customIcon;
    if(iconUrl){
      icon.style.backgroundImage = `url('${iconUrl}')`;
    } else {
      icon.style.background = '#' + p.color.toString(16).padStart(6,'0');
    }
    tag.appendChild(icon);

    const nameEl = document.createElement('div');
    nameEl.className = 'player-tag-name';
    nameEl.textContent = p.name;
    tag.appendChild(nameEl);

    container.appendChild(tag);
  }
}

function updateRadarSense(){
  const container = document.getElementById('radar-indicators');
  if(!local.character || local.character.id !== 'chainer' || !local.alive || spectateTarget){
    container.style.display = 'none';
    container.innerHTML = '';
    return;
  }

  const w = isForceRotated() ? innerHeight : innerWidth;
  const h = isForceRotated() ? innerWidth : innerHeight;

  const camForward = new THREE.Vector3(); camera.getWorldDirection(camForward);
  const camRight = new THREE.Vector3().crossVectors(camForward, camera.up).normalize();

  const targets = players.filter(p => p !== local && p.alive);
  container.innerHTML = '';
  if(targets.length === 0){ container.style.display = 'none'; return; }
  container.style.display = 'block';

  const margin = 30;
  const halfW = w/2 - margin;
  const halfH = h/2 - margin;

  targets.forEach(t=>{
    const targetPos = new THREE.Vector3(t.pos.x, t.pos.y+1, t.pos.z);
    if(isOnScreen(targetPos, camForward)) return; // already visible directly

    const toTarget = new THREE.Vector3().subVectors(targetPos, camera.position);

    // a simple "compass" angle using only left/right vs front/back - this is
    // what makes directly-behind reliably land at the bottom-center rather
    // than depending on camera pitch or producing unstable results near the
    // exact-behind case: 0 = straight ahead, +90 = right, ±180 = behind, -90 = left
    const rawRight = toTarget.dot(camRight);
    const rawForward = toTarget.dot(camForward);
    const relAngle = Math.atan2(rawRight, rawForward);

    // map that compass angle onto an ellipse touching the middle of each
    // screen edge: front->top, right->right edge, behind->bottom, left->left edge
    const px = w/2 + halfW * Math.sin(relAngle);
    const py = h/2 - halfH * Math.cos(relAngle);

    const dotEl = document.createElement('div');
    dotEl.className = 'radar-dot';
    dotEl.style.left = px + 'px';
    dotEl.style.top = py + 'px';
    // the triangle shape points "up" by default; rotating by the compass
    // angle itself points it outward/away from screen-center correctly
    dotEl.style.transform = `translate(-50%,-50%) rotate(${relAngle*180/Math.PI}deg)`;
    container.appendChild(dotEl);
  });
}

function updateAllPunchCharges(){
  const now = nowSec();
  for(const p of players){
    let isReady;
    if(p.isRemote){
      isReady = !!p.punchChargeReadySynced;
    } else {
      isReady = !!(p.chargingPunch && p.punchChargeStartTime && (now - p.punchChargeStartTime) >= 1);
    }
    updatePunchChargeGlow(p, isReady);
    let cardTier = 0;
    if(p.chargingCard && p.cardChargeStartTime){
      const held = now - p.cardChargeStartTime;
      cardTier = held >= 3 ? 3 : held >= 2 ? 2 : held >= 1 ? 1 : 0;
    }
    updateCardChargeGlow(p, cardTier, !!p.chargingCard);
    updateShieldVisual(p, !!p.shieldActive);
    updateAssaultGlow(p, !!p.assaultActive);
    updateUnibeamCharge(p, !!p.chargingUnibeam);
    updateHoverJets(p, !!(p.hoverActive && p.hoverPhase === 'hovering') || p.airJumpJetTimer > 0);
    updateSleepIndicator(p, p.alive && p.hitstun > HITSTUN + 0.1);
    updateAssaultShieldPose(p, !!p.assaultActive);
  }
}

// 龍盾 durability regenerates while the shield is up (and not on its
// break-lockout) - this is resolved per-defender on their own client, same
// as HP, so only local/bot players need it ticked here.
// ナノリペア (Iron Man's passive): if not hit recently, slowly heal HP back
function updateNanoRepair(dt){
  const now = nowSec();
  for(const p of players){
    if(p.isRemote) continue;
    if(!p.character || p.character.id !== 'ironman') continue;
    if(!p.alive || p.hp >= p.maxHp) continue;
    if(p.lastDamagedTime && (now - p.lastDamagedTime) < 5) continue;
    p.hp = Math.min(p.maxHp, p.hp + (p.character.nanoRepairRate || 8) * dt);
    if(p.isLocal) updateHpUI();
  }
}

function updateShieldDurabilityRegen(dt){
  const now = nowSec();
  for(const p of players){
    if(p.isRemote) continue;
    if(!p.character || p.character.skillType !== 'shield') continue;
    const max = p.character.shieldMaxDurability || 150;
    if(p.shieldDurability == null) p.shieldDurability = max;
    const lockedOut = p.shieldBrokenUntil && now < p.shieldBrokenUntil;
    if(!p.shieldActive && !lockedOut && p.shieldDurability < max){
      p.shieldDurability = Math.min(max, p.shieldDurability + (p.character.shieldRegenRate||25)*dt);
      if(p.isLocal) updateSkillCooldownUI();
    }
  }
}

function updateSkillCooldownUI(){
  const overlay = document.getElementById('skill-cooldown-overlay');
  if(local.character && local.character.skillType === 'shield'){
    // reuse the same darkened-overlay bar to show shield durability instead
    // of a cooldown timer: full dark while locked out after breaking, and
    // otherwise dark in proportion to how much durability is missing
    const now = nowSec();
    if(local.shieldBrokenUntil && now < local.shieldBrokenUntil){
      overlay.style.height = '100%';
    } else {
      const max = local.character.shieldMaxDurability || 150;
      const durability = local.shieldDurability != null ? local.shieldDurability : max;
      const frac = 1 - THREE.MathUtils.clamp(durability/max, 0, 1);
      overlay.style.height = (frac*100) + '%';
    }
  } else {
    const max = (local.character && local.character.skillCooldownMax) || 0;
    if(max <= 0){ overlay.style.height = '0%'; }
    else {
      const frac = THREE.MathUtils.clamp(local.skillCooldown / max, 0, 1);
      overlay.style.height = (frac*100) + '%';
    }
  }

  const overlay2 = document.getElementById('skill2-cooldown-overlay');
  const max2 = (local.character && local.character.skill2CooldownMax) || 0;
  if(max2 <= 0){ overlay2.style.height = '0%'; }
  else {
    const frac2 = THREE.MathUtils.clamp(local.skill2Cooldown / max2, 0, 1);
    overlay2.style.height = (frac2*100) + '%';
  }

  // スティッキーカードの弾数ドット表示
  if(local.character && local.character.skillType === 'stickycard'){
    const dotsEl = document.getElementById('skill-ammo-dots');
    const ammoMax = local.character.skillAmmoMax || 3;
    if(dotsEl.children.length !== ammoMax){
      dotsEl.innerHTML = '';
      for(let i=0;i<ammoMax;i++){
        const dot = document.createElement('div');
        dot.className = 'ammo-dot';
        dotsEl.appendChild(dot);
      }
    }
    for(let i=0;i<dotsEl.children.length;i++){
      dotsEl.children[i].classList.toggle('filled', i < local.stickyAmmo);
    }
    // ステージ上に自分のカードが1枚もなければ、起爆ボタンは表示しない
    btnDetonate.style.display = (local.stickyCards && local.stickyCards.length > 0) ? 'flex' : 'none';
  }
}

function updateRoundStartCountdown(dt){
  if(roundStartTimer === null) return;
  roundStartTimer -= dt;
  const el = document.getElementById('round-start-countdown');
  el.style.display = 'block';
  if(roundStartTimer > 2.6){ el.textContent = '3'; }
  else if(roundStartTimer > 1.6){ el.textContent = '2'; }
  else if(roundStartTimer > 0.6){ el.textContent = '1'; }
  else if(roundStartTimer > 0){ el.textContent = 'START!'; if(attacksLocked){ attacksLocked = false; roundFightStartedAt = nowSec(); } }
  else { el.style.display = 'none'; roundStartTimer = null; }
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 1/30);
  if(!gameStarted) { renderer.render(scene, camera); return; }

  players.forEach(p=>updatePlayer(p, dt));
  updateCamera(dt);
  updatePendingGrenades(dt);
  updatePendingSmokes(dt);
  if(isChargingGrenade && local.alive) updateGrenadePreview(local);
  if(isChargingSmoke && local.alive) updateSmokePreview(local);
  updateSkillCooldownUI();
  updateAllPunchCharges();
  updateShieldDurabilityRegen(dt);
  updateRoundStartCountdown(dt);
  updateRadarSense();
  updatePlayerTags();
  updateTeammateIndicators();
  updateSmokeVisionHighlight();

  // if we're spectating and our target fell too, hop to whoever's still alive
  if(spectateTarget && !spectateTarget.alive){
    const targets = getSpectatableTargets();
    spectateTarget = targets.length ? targets[0] : null;
    updateSpectateLabel();
  }

  if(!roundActive){
    roundEndTimer -= dt;
    if(roundEndTimer <= 0){
      if(matchOver){
        returnToLobbyAfterMatch();
      } else {
        startRound();
      }
    }
  }

  renderer.render(scene, camera);
}

/* ---------------- Start flow ---------------- */
function tryLockLandscape(){
  try{
    const el = document.documentElement;
    const reqFS = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
    const doLock = ()=>{
      if(screen.orientation && screen.orientation.lock){
        screen.orientation.lock('landscape').catch(()=>{ /* not supported/allowed - rotate overlay still covers portrait */ });
      }
    };
    if(reqFS){
      reqFS.call(el).then(doLock).catch(doLock);
    } else {
      doLock();
    }
  }catch(e){ /* ignore - the CSS force-landscape rotation still applies regardless */ }
}

// Try to go fullscreen (which hides the browser's address bar) on the very
// first tap/click anywhere on the page, not just the start buttons - this
// gives the best chance of hiding it as early as possible.
function firstTapFullscreen(){
  tryLockLandscape();
  document.removeEventListener('pointerdown', firstTapFullscreen);
}
document.addEventListener('pointerdown', firstTapFullscreen, {once:true});

// Explicit fullscreen button (like the expand icon on YouTube) - many mobile
// browsers (especially iOS Safari) don't allow auto-triggered fullscreen at
// all, so this gives people a reliable manual way to hide the address bar.
const btnFullscreen = document.getElementById('btn-fullscreen');
function isInFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function updateFullscreenBtnIcon(){
  btnFullscreen.textContent = isInFullscreen() ? '⤫' : '⛶';
}
btnFullscreen.addEventListener('click', ()=>{
  if(isInFullscreen()){
    const exitFS = document.exitFullscreen || document.webkitExitFullscreen;
    if(exitFS) exitFS.call(document);
  } else {
    tryLockLandscape();
  }
});
document.addEventListener('fullscreenchange', updateFullscreenBtnIcon);
document.addEventListener('webkitfullscreenchange', updateFullscreenBtnIcon);

function beginGame(mode){
  tryLockLandscape();
  const nameVal = document.getElementById('name-input').value.trim();
  local.name = nameVal ? nameVal.slice(0,10) : ('プレイヤー' + Math.floor(Math.random()*900+100));

  const chosenChar = CHARACTERS[selectedCharacterIndex] || CHARACTERS[0];
  setPlayerCharacter(local, chosenChar);
  document.getElementById('crosshair').style.display = 'block';
  document.getElementById('btn-attack').textContent = 'Attack';
  document.getElementById('skill-label').textContent = 'Skil1';
  const btnSkill2El = document.getElementById('btn-skill2');
  if(chosenChar.skill2Name){
    btnSkill2El.style.display = 'flex';
    document.getElementById('skill2-label').textContent = 'Skil2';
  } else {
    btnSkill2El.style.display = 'none';
  }
  const hasStickyCard = chosenChar.skillType === 'stickycard';
  document.getElementById('btn-detonate').style.display = 'none'; // shown once a card is actually stuck somewhere
  document.getElementById('skill-ammo-dots').style.display = hasStickyCard ? 'flex' : 'none';

  document.getElementById('start-overlay').style.display = 'none';
  isPracticeMode = false;

  // どのモードで始めても、前回ネット対戦で設定した「チーム戦」設定が
  // 残ったままにならないよう、ここで必ずリセットしておく
  matchMode = 'solo';
  local.team = null;
  teamWins = {1:0, 2:0};

  if(mode === 'online'){
    localReady = false;
    matchMode = 'solo';
    teamWins = {1:0, 2:0};
    local.team = null;
    const roomVal = document.getElementById('room-input').value;
    startNetworking(roomVal);
    document.getElementById('net-note').textContent =
      'オンライン対戦中(ルーム: ' + NET.room + ')。専用サーバー経由でリアルタイムに対戦相手と同期しています。なまえ・色・位置は同じルームの人に共有されます。';
    document.getElementById('lobby-room-label').textContent = 'ルーム: ' + NET.room;
    updateLobbyCharIcon();
    document.getElementById('lobby-overlay').style.display = 'flex';
  } else if(mode === 'bots'){
    addBots();
    refreshAliveChips();
    document.getElementById('net-note').textContent =
      '現在はこの端末内でボットと対戦する練習モードです。';
    gameStarted = true;
    roundNumber = 0;
    startRound();
  } else if(mode === 'practice'){
    isPracticeMode = true;
    createPracticeDummies();
    refreshAliveChips();
    document.getElementById('net-note').textContent =
      '練習場(一人)モードです。他の柱にマネキンを配置しました。攻撃を当てて練習できます。落ちても自動で復活します。';
    gameStarted = true;
    roundNumber = 0;
    startRound();
  }
}
document.getElementById('start-btn-online').addEventListener('click', ()=>beginGame('online'));
document.getElementById('start-btn-offline').addEventListener('click', ()=>beginGame('bots'));
document.getElementById('start-btn-practice').addEventListener('click', ()=>beginGame('practice'));

animate();

})();
