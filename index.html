<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PILLAR RUMBLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#8FD3FF;
    --sky-bottom:#D9F1FF;
    --accent-yellow:#FFD23F;
    --accent-red:#FF5C5C;
    --accent-teal:#3FD6C2;
    --accent-purple:#8B6BFF;
    --ui-dark:#1F2740;
    --ui-dark-90: rgba(31,39,64,0.90);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    font-family:'Baloo 2', sans-serif;
    background:linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
    touch-action:none;
  }
  #canvas-holder{position:fixed; inset:0;}
  canvas{display:block; width:100%; height:100%;}

  /* ---------- Top HUD ---------- */
  #hud-top{
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding: calc(10px + env(safe-area-inset-top)) 16px 0 16px;
    pointer-events:none; z-index:10;
  }
  .hud-pill{
    background:var(--ui-dark-90);
    color:#fff;
    padding:8px 16px;
    border-radius:999px;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.5px;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
    display:flex; align-items:center; gap:8px;
  }
  .hud-pill .dot{width:10px;height:10px;border-radius:50%;background:var(--accent-teal);box-shadow:0 0 8px var(--accent-teal);}
  #alive-list{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; max-width:220px;}
  .alive-chip{width:22px;height:22px;border-radius:7px;border:2px solid rgba(255,255,255,0.85); box-shadow:0 2px 0 rgba(0,0,0,0.2);}
  .alive-chip.dead{opacity:0.18; filter:grayscale(1);}
  .alive-chip-wrap{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .alive-chip-wins{ font-size:10px; font-weight:800; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.6); line-height:1; }

  /* ---------- Center banner ---------- */
  #banner{
    position:fixed; left:50%; top:32%; transform:translate(-50%,-50%) scale(0.7);
    text-align:center; z-index:20; pointer-events:none;
    opacity:0; transition:opacity 0.25s ease, transform 0.25s ease;
  }
  #banner.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
  #banner h1{
    margin:0; font-size:54px; font-weight:800; letter-spacing:1px;
    color:#fff; -webkit-text-stroke:3px var(--ui-dark);
    text-shadow:0 6px 0 rgba(0,0,0,0.25);
  }
  #banner p{
    margin:6px 0 0; font-size:20px; font-weight:700; color:var(--ui-dark);
    background:rgba(255,255,255,0.85); display:inline-block; padding:4px 18px; border-radius:999px;
  }
  #banner.winner h1{ color: var(--winner-color, #fff); }

  #countdown{
    position:fixed; left:50%; top:14%; transform:translateX(-50%);
    font-size:22px; font-weight:700; color:var(--ui-dark);
    background:rgba(255,255,255,0.85); padding:6px 20px; border-radius:999px;
    z-index:19; opacity:0; transition:opacity 0.2s;
  }
  #countdown.show{opacity:1;}

  #round-start-countdown{
    position:fixed; left:50%; top:38%; transform:translate(-50%,-50%) scale(0.8);
    font-size:72px; font-weight:800; color:#fff;
    -webkit-text-stroke:4px var(--ui-dark); text-shadow:0 8px 0 rgba(0,0,0,0.25);
    z-index:20; display:none; pointer-events:none;
  }

  #hp-bar-wrap{
    position:fixed; left:50%; bottom:calc(6px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    width:150px; height:12px; z-index:18; pointer-events:none;
    background:rgba(20,22,28,0.55); border-radius:999px; border:2px solid rgba(255,255,255,0.65);
    overflow:hidden;
  }
  #hp-bar-fill{
    position:absolute; left:0; top:0; bottom:0; width:100%;
    background:linear-gradient(180deg, #6EDB7A, #3CB84C);
    transition:width 0.2s ease, background 0.2s ease;
  }
  #hp-bar-text{
    position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    font-size:10.5px; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.7);
    z-index:18; pointer-events:none;
  }

  #you-fell{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:32px; font-weight:800; color:#fff; -webkit-text-stroke:2px var(--accent-red);
    z-index:20; opacity:0; transition:opacity 0.3s; pointer-events:none;
    background:var(--ui-dark-90); padding:14px 28px; border-radius:20px;
  }
  #you-fell.show{opacity:1;}

  #spectate-bar{
    position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); transform:translateX(-50%);
    z-index:19; display:none; align-items:center; gap:10px;
    background:var(--ui-dark-90); padding:8px 14px; border-radius:999px;
  }
  #spectate-label{ color:#fff; font-weight:800; font-size:13px; }
  #btn-next-spectate{
    font-family:inherit; font-size:12.5px; font-weight:800; color:var(--ui-dark);
    background:var(--accent-yellow); border:none; border-radius:999px;
    padding:6px 14px; cursor:pointer;
  }

  /* ---------- Controls ---------- */
  #controls{position:fixed; inset:0; z-index:15; pointer-events:none;}
  .stick-zone{
    position:absolute; left:0; bottom:0; width:46%; height:60%;
    pointer-events:auto;
  }
  #joy-base{
    position:absolute; width:130px; height:130px; border-radius:50%;
    background:rgba(31,39,64,0.28);
    border:3px solid rgba(255,255,255,0.55);
    left: calc(24px + env(safe-area-inset-left));
    bottom: calc(24px + env(safe-area-inset-bottom));
    transition:background 0.15s, border-color 0.15s;
  }
  #joy-base.active{
    background:rgba(31,39,64,0.48);
    border-color:rgba(255,255,255,0.95);
  }
  #joy-knob{
    position:absolute; width:56px; height:56px; border-radius:50%;
    background:rgba(255,255,255,0.92);
    border:3px solid var(--accent-teal);
    left:37px; top:37px;
    box-shadow:0 3px 0 rgba(0,0,0,0.2);
    transition:box-shadow 0.15s;
  }
  #joy-base.active #joy-knob{
    box-shadow:0 3px 0 rgba(0,0,0,0.2), 0 0 0 6px rgba(63,214,194,0.28);
  }
  #action-zone{
    position:absolute; right:0; bottom:0; width:52%; height:60%;
    pointer-events:none;
  }
  .action-btn{
    position:absolute; border-radius:50%; pointer-events:auto;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; color:#5a5f6b;
    box-shadow:0 6px 0 rgba(0,0,0,0.25);
    transition:transform 0.06s ease, box-shadow 0.06s ease;
    border:3px solid rgba(255,255,255,0.75);
    letter-spacing:0.5px;
  }
  .action-btn:active, .action-btn.pressed{
    transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.25);
  }
  #btn-jump{
    width:92px; height:92px;
    right: calc(20px + env(safe-area-inset-right));
    bottom: calc(24px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,0.75);
    border:3px solid rgba(120,120,128,0.8);
  }
  #btn-attack{
    width:82px; height:82px;
    right: calc(120px + env(safe-area-inset-right));
    bottom: calc(74px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,0.75);
    border:3px solid rgba(120,120,128,0.8);
  }
  #btn-skill{
    width:70px; height:70px; font-size:12px;
    right: calc(96px + env(safe-area-inset-right));
    bottom: calc(168px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,0.75);
    border:3px solid rgba(120,120,128,0.8);
    overflow:hidden;
  }
  #skill-cooldown-overlay{
    position:absolute; left:0; right:0; bottom:0; height:0%;
    background:rgba(20,22,28,0.72);
    pointer-events:none;
    transition:height 0.1s linear;
  }
  #skill-label{ position:relative; z-index:1; pointer-events:none; text-align:center; }
  #btn-skill:disabled, #btn-skill.on-cooldown{
    filter:grayscale(0.6) brightness(0.75);
  }
  #btn-detonate{
    width:54px; height:54px; font-size:11px;
    right: calc(96px + env(safe-area-inset-right));
    bottom: calc(246px + env(safe-area-inset-bottom));
    background:rgba(207,111,255,0.85);
    border:3px solid rgba(255,255,255,0.85);
    color:#fff;
  }
  #skill-ammo-dots{
    position:absolute; pointer-events:none; display:flex; gap:4px; justify-content:center;
    right: calc(105px + env(safe-area-inset-right));
    bottom: calc(150px + env(safe-area-inset-bottom));
    width:52px;
  }
  #skill-ammo-dots .ammo-dot{
    width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.3);
    border:1px solid rgba(255,255,255,0.6);
  }
  #skill-ammo-dots .ammo-dot.filled{ background:#CF6FFF; }
  #btn-skill2{
    width:62px; height:62px; font-size:10px;
    right: calc(30px + env(safe-area-inset-right));
    bottom: calc(142px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,0.75);
    border:3px solid rgba(120,120,128,0.8);
    overflow:hidden;
    display:none;
  }
  #skill2-cooldown-overlay{
    position:absolute; left:0; right:0; bottom:0; height:0%;
    background:rgba(20,22,28,0.72);
    pointer-events:none;
    transition:height 0.1s linear;
  }
  #skill2-label{ position:relative; z-index:1; pointer-events:none; text-align:center; }

  /* ---------- Crosshair (ranged weapon aim) ---------- */
  #crosshair{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    width:34px; height:34px; z-index:8; pointer-events:none; display:none;
  }
  #crosshair::before, #crosshair::after{
    content:''; position:absolute; background:rgba(255,255,255,0.92);
    box-shadow:0 0 0 1px rgba(31,39,64,0.6);
  }
  #crosshair::before{ left:50%; top:2px; bottom:2px; width:2px; transform:translateX(-50%); }
  #crosshair::after{ top:50%; left:2px; right:2px; height:2px; transform:translateY(-50%); }
  #crosshair .dot{
    position:absolute; left:50%; top:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    border-radius:50%; background:var(--accent-red);
  }

  #radar-indicators{
    position:fixed; left:0; top:0; width:100%; height:100%;
    z-index:9; pointer-events:none; display:none;
  }
  .radar-dot{
    position:absolute; width:0; height:0;
    border-left:8px solid transparent; border-right:8px solid transparent;
    border-bottom:14px solid var(--accent-red);
    filter:drop-shadow(0 0 3px rgba(0,0,0,0.6));
  }

  #player-tags{
    position:fixed; left:0; top:0; width:100%; height:100%;
    z-index:16; pointer-events:none; display:none;
  }
  #teammate-indicators{
    position:fixed; left:0; top:0; width:100%; height:100%;
    z-index:14; pointer-events:none;
  }
  .teammate-dot{
    position:absolute; transform:translate(-50%,-100%);
    width:14px; height:14px; border-radius:50%;
    background:#4D96FF; border:2px solid rgba(255,255,255,0.95);
    box-shadow:0 0 4px rgba(0,0,0,0.5);
  }
  .player-tag{
    position:absolute; transform:translate(-50%,-100%);
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .player-tag-icon{
    width:26px; height:26px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.9); box-shadow:0 2px 0 rgba(0,0,0,0.25);
    background-size:cover; background-position:center;
  }
  .player-tag-name{
    font-size:10px; font-weight:800; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.85);
    background:rgba(20,22,28,0.55); padding:1px 7px; border-radius:999px; white-space:nowrap;
  }

  #start-overlay{
    position:fixed; inset:0; z-index:30;
    background:linear-gradient(160deg, #6FC3F7, #B9E7FF);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    text-align:center; padding:20px 24px 40px;
    overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y;
  }
  #start-overlay h1{
    font-size:38px; font-weight:800; color:#fff; margin:0 0 6px;
    -webkit-text-stroke:3px var(--ui-dark); text-shadow:0 6px 0 rgba(0,0,0,0.2);
  }
  #start-overlay p{ font-size:15px; color:var(--ui-dark); font-weight:700; max-width:340px; margin:4px 0 18px;}

  /* ---- top-left corner: icon + name (always visible on the home screen) ---- */
  #home-topleft{
    position:absolute; top:calc(16px + env(safe-area-inset-top)); left:calc(16px + env(safe-area-inset-left));
    display:flex; align-items:center; gap:8px; z-index:2;
  }
  #char-preview-dot-wrap{ position:relative; flex-shrink:0; }
  #btn-upload-icon{
    position:absolute; right:-4px; bottom:-4px; width:18px; height:18px;
    border-radius:50%; border:2px solid #fff; background:var(--accent-purple);
    font-size:9px; line-height:1; padding:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,0.2);
  }
  #char-preview-dot{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    border:3px solid rgba(255,255,255,0.9); box-shadow:0 3px 0 rgba(0,0,0,0.18);
    background:#FF5C5C;
  }
  #home-topleft #name-input{
    width:150px; font-family:inherit; font-size:14px; font-weight:700;
    color:var(--ui-dark); text-align:left;
    background:rgba(255,255,255,0.85); border:3px solid rgba(255,255,255,0.9);
    border-radius:999px; padding:9px 14px; outline:none;
  }
  #home-topleft #name-input:focus{ border-color:var(--accent-teal); }

  /* ---- bottom-right corner: big PLAY button ---- */
  #btn-goto-play{
    position:absolute; right:calc(20px + env(safe-area-inset-right)); bottom:calc(20px + env(safe-area-inset-bottom));
    font-family:inherit; font-size:24px; font-weight:800; color:var(--ui-dark);
    background:linear-gradient(180deg, #FFE374, var(--accent-yellow));
    border:3px solid rgba(255,255,255,0.9); border-radius:999px;
    padding:16px 38px; box-shadow:0 6px 0 rgba(0,0,0,0.25); cursor:pointer;
    z-index:2;
  }
  #btn-goto-play:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.25); }

  /* ---- home step: character preview card ---- */
  #home-icon-col{
    position:absolute; left:calc(16px + env(safe-area-inset-left)); bottom:calc(16px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; gap:8px; z-index:2;
  }
  #char-preview-body{
    width:150px; height:150px; border-radius:26px;
    background:#FF5C5C; box-shadow:0 5px 0 rgba(0,0,0,0.2);
    border:3px solid rgba(255,255,255,0.85);
  }
  #char-preview-name{
    font-size:19px; font-weight:800; color:var(--ui-dark);
    background:rgba(255,255,255,0.8); padding:3px 16px; border-radius:999px;
  }

  .back-btn{
    align-self:flex-start; font-family:inherit; font-size:14px; font-weight:800;
    color:var(--ui-dark); background:rgba(255,255,255,0.75); border:none;
    border-radius:999px; padding:8px 16px; margin-bottom:10px; cursor:pointer;
  }

  #char-step{ width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center; }
  #char-detail-step{ width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center; }
  #mode-step{ width:100%; max-width:700px; display:flex; flex-direction:column; align-items:center; }
  #char-step h1, #mode-step h1{ font-size:26px; }

  #char-icon-row{ display:flex; flex-direction:row; gap:14px; width:100%; }
  .char-icon-box{
    flex:1; aspect-ratio:1/1; border-radius:18px; cursor:pointer;
    background-size:cover; background-position:center;
    border:4px solid rgba(255,255,255,0.6);
    box-shadow:0 6px 0 rgba(0,0,0,0.2);
    transition:border-color 0.12s, transform 0.08s;
  }
  .char-icon-box:active{ transform:translateY(3px); }
  .char-icon-box.selected{ border-color:var(--accent-teal); }

  #detail-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); grid-auto-rows:130px; gap:10px; width:100%; margin-top:8px;
  }
  #detail-icon{
    border-radius:14px; background-size:cover; background-position:center;
    border:3px solid rgba(255,255,255,0.85); box-shadow:0 4px 0 rgba(0,0,0,0.18);
  }
  .detail-box{
    background:rgba(255,255,255,0.82); border-radius:14px; padding:8px 11px;
    text-align:left; display:flex; flex-direction:column; gap:3px; overflow:hidden;
  }
  .detail-box-title{ font-size:11.5px; font-weight:800; color:#8B5FBF; flex-shrink:0; }
  .detail-box-text{
    font-size:11.5px; font-weight:700; color:var(--ui-dark); line-height:1.3;
    overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1; min-height:0;
  }
  #detail-nameinfo{ text-align:left; padding:4px 2px; overflow:hidden; }
  #detail-name{ font-size:17px; font-weight:800; color:var(--ui-dark); }
  #detail-desc{ font-size:10.5px; font-weight:700; color:rgba(31,39,64,0.7); margin-top:3px; line-height:1.35; }

  #btn-equip-char{
    font-family:inherit; font-size:15px; font-weight:800; color:#fff;
    background:linear-gradient(180deg, #6EDB7A, #3CB84C);
    border:3px solid rgba(255,255,255,0.85); border-radius:999px;
    padding:11px 20px; margin-top:14px; width:100%; cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,0.2);
  }
  #btn-equip-char:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.2); }

  #mode-row{ display:flex; flex-direction:row; gap:16px; width:100%; max-width:640px; align-items:stretch; margin-top:14px; }
  #room-row-wrap{ display:flex; flex-direction:row; gap:16px; width:100%; max-width:640px; }
  .room-row-spacer{ flex:1; }
  #room-row{ flex:1; text-align:left; }
  .input-label{ display:block; font-size:12px; font-weight:800; color:var(--ui-dark); margin:0 0 4px 6px; }
  #room-input{
    width:100%; font-family:inherit; font-size:16px; font-weight:700;
    color:var(--ui-dark); text-align:center;
    background:rgba(255,255,255,0.85); border:3px solid rgba(255,255,255,0.9);
    border-radius:999px; padding:10px 16px; outline:none; box-sizing:border-box;
  }
  #room-input:focus{ border-color:var(--accent-teal); }
  .mode-btn{
    font-family:inherit; font-size:16px; font-weight:800; color:#fff;
    border:3px solid rgba(255,255,255,0.8); border-radius:18px;
    flex:1; min-height:150px; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    box-shadow:0 6px 0 rgba(0,0,0,0.25); cursor:pointer; text-align:center; line-height:1.25;
  }
  .mode-btn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.25);}
  .mode-btn .mode-btn-icon{ font-size:38px; }
  #btn-change-char{ min-height:64px; }
  .mode-btn.online{ background:linear-gradient(180deg, #5AC8FA, var(--accent-teal)); }
  .mode-btn.offline{ background:linear-gradient(180deg, #FFDE6B, var(--accent-yellow)); color:var(--ui-dark);}
  .mode-btn.practice{ background:linear-gradient(180deg, #C4E86A, #8FBF3F); color:var(--ui-dark); }
  #online-note{
    font-size:11.5px; color:rgba(31,39,64,0.7); font-weight:700;
    max-width:300px; margin:10px 0 0; line-height:1.5;
  }
  .hint-row{display:flex; gap:14px; margin-top:22px; flex-wrap:wrap; justify-content:center;}
  .hint{background:rgba(255,255,255,0.7); border-radius:14px; padding:10px 14px; font-size:13px; font-weight:700; color:var(--ui-dark); width:130px;}


  #net-note{
    position:fixed; bottom:6px; left:50%; transform:translateX(-50%);
    font-size:11px; color:rgba(31,39,64,0.55); font-weight:700; z-index:5; pointer-events:none;
    text-align:center; width:90%;
  }

  /* ---------- Lobby / waiting room ---------- */
  #lobby-overlay{
    position:fixed; inset:0; z-index:30; display:none;
    background:linear-gradient(160deg, #6FC3F7, #B9E7FF);
    flex-direction:column; align-items:center; justify-content:flex-start;
    text-align:center; padding:28px 24px 40px;
    overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y;
  }
  #lobby-overlay h1{
    font-size:36px; font-weight:800; color:#fff; margin:0 0 4px;

<script>
(function(){
"use strict";

/* =========================================================================
   PILLAR RUMBLE - simple Roblox-like 3D arena battler
   Single player vs bots, local physics. (see note at bottom of file
   about multiplayer)
   ========================================================================= */

/* ---------------- Renderer / Scene / Camera ---------------- */
const holder = document.getElementById('canvas-holder');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
holder.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9AD8FF);
scene.fog = new THREE.Fog(0x9AD8FF, 60, 160);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 400);

// When the phone is physically portrait, CSS visually rotates the whole page
// -90deg so it always looks/plays like landscape. That's purely visual, so
// any raw pointer clientX/clientY (which the browser reports in the real,
// unrotated viewport) needs to be re-mapped into the same "logical landscape"
// space that the rotated layout and Three.js camera use. Position-only checks
// (DOM hit-testing, element.closest, getBoundingClientRect vs a raw point)
// don't need this - both already agree in real viewport space. Only code that
// turns a raw point into a *direction/delta* fed into game logic needs it.
function isForceRotated(){
  return window.matchMedia('(orientation: portrait)').matches;
}
function remapXY(clientX, clientY){
  if(isForceRotated()){
    return { x: innerHeight - clientY, y: clientX };
  }
  return { x: clientX, y: clientY };
}

function resize(){
  const w = isForceRotated() ? innerHeight : innerWidth;
  const h = isForceRotated() ? innerWidth : innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
resize();

/* ---------------- Lights ---------------- */
const hemi = new THREE.HemisphereLight(0xffffff, 0x6688aa, 0.95);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff3d6, 1.15);
sun.position.set(30, 45, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0015;
scene.add(sun);

/* ---------------- Void / ground way below ---------------- */
const FALL_Y = -22;         // below this = eliminated
const VOID_Y = -34;

const voidGeo = new THREE.PlaneGeometry(400,400);
const voidMat = new THREE.MeshStandardMaterial({color:0x1a2740, roughness:1});
const voidPlane = new THREE.Mesh(voidGeo, voidMat);
voidPlane.rotation.x = -Math.PI/2;
voidPlane.position.y = VOID_Y;
voidPlane.receiveShadow = true;
scene.add(voidPlane);

// faint grid on the void floor so the fall reads as "far down"
const grid = new THREE.GridHelper(400, 40, 0x33507a, 0x243a5c);
grid.position.y = VOID_Y + 0.05;
scene.add(grid);

/* ---------------- Platforms (pillars) ---------------- */
// safety-stripe ring texture (procedural) for platform edges
function makeStripeTexture(colA, colB){
  const c = document.createElement('canvas'); c.width=64; c.height=64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = colA; ctx.fillRect(0,0,64,64);
  ctx.fillStyle = colB;
  for(let i=-64;i<64;i+=16){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(i,0); ctx.lineTo(i+8,0); ctx.lineTo(i+8+64,64); ctx.lineTo(i+64,64);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
const stripeTex = makeStripeTexture('#FFD23F','#1F2740');

function makeSkullTexture(){
  const c = document.createElement('canvas'); c.width=64; c.height=64;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,64,64);
  // cranium
  ctx.fillStyle = '#f2f2f2';

function makeDragonTexture(){
  const c = document.createElement('canvas'); c.width=64; c.height=64;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,64,64);
  ctx.fillStyle = '#14161c';
  ctx.strokeStyle = '#14161c';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // serpentine coiled body
  ctx.beginPath();
  ctx.moveTo(10, 52);
  ctx.quadraticCurveTo(20, 32, 34, 38);
  ctx.quadraticCurveTo(48, 46, 44, 28);
  ctx.quadraticCurveTo(40, 14, 52, 10);
  ctx.stroke();

  // head / snout at the end of the body
  ctx.beginPath();
  ctx.moveTo(52, 10);
  ctx.lineTo(61, 5);
  ctx.lineTo(57, 15);
  ctx.closePath();
  ctx.fill();

  // small horn
  ctx.beginPath();
  ctx.moveTo(49, 9);
  ctx.lineTo(47, 2);
  ctx.lineTo(53, 7);
  ctx.closePath();
  ctx.fill();

  // tapered tail tip
  ctx.beginPath();
  ctx.moveTo(10, 52);
  ctx.lineTo(3, 59);
  ctx.lineTo(14, 56);
  ctx.closePath();
  ctx.fill();

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function makeStarTexture(){
  const c = document.createElement('canvas'); c.width=64; c.height=64;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,64,64);
  ctx.fillStyle = '#ffffff';
  const cx=32, cy=32, spikes=5, outerR=28, innerR=12;
  let rot = -Math.PI/2;
  const step = Math.PI/spikes;
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(rot)*outerR, cy + Math.sin(rot)*outerR);
  for(let i=0;i<spikes;i++){
    rot += step;
    ctx.lineTo(cx + Math.cos(rot)*innerR, cy + Math.sin(rot)*innerR);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot)*outerR, cy + Math.sin(rot)*outerR);
  }
  ctx.closePath();
  ctx.fill();
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
const STAR_TEXTURE = makeStarTexture();

function makeLetterATexture(){
  const c = document.createElement('canvas'); c.width=64; c.height=64;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,64,64);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 50px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('A', 32, 35);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
// ---------------- Sound effects ----------------
// シンプルな効果音再生の仕組み。base64で埋め込んだ音声データをその場で
// 再生する。連続再生できるよう、毎回新しいAudioインスタンスを作る。
// 毎回 new Audio() すると、その都度デコードが走ってわずかに再生が遅れる
// ことがあるので、音源ごとに複数のAudioインスタンスを事前に用意して
// 使い回す(連続で鳴らしても被らないよう、順番に切り替える)
const _sfxPools = new Map(); // base64Uri -> {elements:[], idx:0}
function getSfxPool(base64Uri){
  let pool = _sfxPools.get(base64Uri);
  if(!pool){
    const elements = [];
    for(let i=0;i<4;i++){
      const a = new Audio(base64Uri);
      a.preload = 'auto';
      elements.push(a);
    }
    pool = {elements, idx:0};
    _sfxPools.set(base64Uri, pool);
  }
  return pool;
}
function playSfx(base64Uri, volume){
  try{
    const pool = getSfxPool(base64Uri);
    const audio = pool.elements[pool.idx];
    pool.idx = (pool.idx + 1) % pool.elements.length;
    audio.currentTime = 0;
    audio.volume = volume != null ? volume : 0.55;
    audio.play().catch(()=>{ /* autoplay might be blocked until first user interaction - ignore */ });
  }catch(e){ /* ignore */ }
}

// 音声ファイルが無い技用に、Web Audio APIでその場で「ピュン」というレーザー
// 音を合成する。周波数を高い所から低い所へ急速に落とすことで、
// SF的な発射音になる。
let _sharedAudioCtx = null;
function getSharedAudioCtx(){
  if(!_sharedAudioCtx){
    try{ _sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  return _sharedAudioCtx;
}
function playPewSound(volume, startFreq, endFreq, duration){
  const ctx = getSharedAudioCtx();
  if(!ctx) return;
  try{
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    const now = ctx.currentTime;
    const dur = duration || 0.16;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(startFreq || 1500, now);
    osc.frequency.exponentialRampToValueAtTime(endFreq || 300, now + dur*0.85);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(volume != null ? volume : 0.3, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }catch(e){ /* ignore */ }
}

// 金属バットを振るような、フィルターをかけたノイズ+低い「ドスッ」という
// 音の組み合わせで、鈍く重いスイング音を合成する
// カードを投げる時の「ピシュッ」という鋭く短いフリック音。ノイズの
// 一瞬の弾けと、急激に下がる高い音を組み合わせる。
function playCardFlickSound(volume){
  const ctx = getSharedAudioCtx();
  if(!ctx) return;
  try{
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    const now = ctx.currentTime;
    const vol = volume != null ? volume : 0.35;
    const dur = 0.075;

    const bufferSize = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = Math.random()*2-1; }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.setValueAtTime(2500, now);
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(vol*0.9, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(ctx.destination);
    noise.start(now); noise.stop(now + dur + 0.01);

    const osc = ctx.createOscillator();
    const oscGain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(2600, now);
    osc.frequency.exponentialRampToValueAtTime(900, now + dur);
    oscGain.gain.setValueAtTime(vol*0.6, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(oscGain); oscGain.connect(ctx.destination);
    osc.start(now); osc.stop(now + dur + 0.01);
  }catch(e){ /* ignore */ }
}

// 少しファンタジー風の、キラッとした魔法っぽい破裂音。ノイズの弾けに、
// 上昇してから下降する和音的な響きを重ねる。
function playFantasyPopSound(volume){
  const ctx = getSharedAudioCtx();
  if(!ctx) return;
  try{
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    const now = ctx.currentTime;
    const vol = volume != null ? volume : 0.4;
    const dur = 0.32;

    // 弾ける瞬間のノイズ
    const bufferSize = Math.floor(ctx.sampleRate * 0.08);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = Math.random()*2-1; }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 1200;
    noiseFilter.Q.value = 0.8;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(vol*0.85, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.09);

    // キラキラした和音的なスパークル(3音を少しずらして重ねる)
    const notes = [660, 880, 1320];
    notes.forEach((freq, i)=>{
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'triangle';
      const start = now + i*0.02;
      osc.frequency.setValueAtTime(freq, start);
      osc.frequency.exponentialRampToValueAtTime(freq*1.4, start + dur*0.5);
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(vol*0.35, start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, start + dur);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(start); osc.stop(start + dur + 0.02);
    });
  }catch(e){ /* ignore */ }
}

function playWhooshThud(volume){
  const ctx = getSharedAudioCtx();
  if(!ctx) return;
  try{
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    const now = ctx.currentTime;
    const vol = volume != null ? volume : 0.4;
    const dur = 0.2;

    // ノイズ成分(風切り音)- バンドパスフィルターの周波数を高→低に
    // 素早く動かして「フォッ」という質感を作る
    const bufferSize = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = Math.random()*2-1; }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 1.1;
    filter.frequency.setValueAtTime(1600, now);
    filter.frequency.exponentialRampToValueAtTime(180, now + dur*0.85);
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0, now);
    noiseGain.gain.linearRampToValueAtTime(vol, now + 0.018);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(ctx.destination);
    noise.start(now);
    noise.stop(now + dur + 0.02);

    // 低音の「ドスッ」という鈍い打撃の重み。スマホのスピーカーだと本当に
    // 低い帯域(50-100Hz)は出づらいので、聞こえやすい帯域を使う。
    // 三角波を混ぜて輪郭をはっきりさせ、風切り音が少し収まった
    // "当たった瞬間"のタイミングで鳴らす。
    const impactDelay = 0.05;
    const thud = ctx.createOscillator();
    const thud2 = ctx.createOscillator();
    const thudGain = ctx.createGain();
    thud.type = 'triangle';
    thud2.type = 'sine';
    thud.frequency.setValueAtTime(260, now+impactDelay);
    thud.frequency.exponentialRampToValueAtTime(110, now+impactDelay+0.1);
    thud2.frequency.setValueAtTime(130, now+impactDelay);
    thud2.frequency.exponentialRampToValueAtTime(70, now+impactDelay+0.12);
    thudGain.gain.setValueAtTime(0, now+impactDelay);
    thudGain.gain.linearRampToValueAtTime(vol*1.3, now+impactDelay+0.006);
    thudGain.gain.exponentialRampToValueAtTime(0.001, now+impactDelay+0.16);
    thud.connect(thudGain);
    thud2.connect(thudGain);
    thudGain.connect(ctx.destination);
    thud.start(now+impactDelay); thud.stop(now+impactDelay+0.18);
    thud2.start(now+impactDelay); thud2.stop(now+impactDelay+0.18);
  }catch(e){ /* ignore */ }
}

function makeZzzTexture(){
  const c = document.createElement('canvas'); c.width=96; c.height=96;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,96,96);
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#3F2A5C';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // classic cascading "z Z Z" - small at the bottom-left, growing as it
  // trails up and to the right
  const letters = [
    {x:20, y:78, size:22},
    {x:48, y:52, size:30},
    {x:74, y:24, size:38},
  ];
  for(const l of letters){
    ctx.lineWidth = Math.max(2, l.size*0.09);
    ctx.font = `bold ${l.size}px Arial, sans-serif`;
    ctx.strokeText('Z', l.x, l.y);
    ctx.fillText('Z', l.x, l.y);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function makeCaptainStripeTexture(){
  const c = document.createElement('canvas'); c.width=128; c.height=32;
  const ctx = c.getContext('2d');
  const stripeCount = 8;
  const stripeW = c.width/stripeCount;
  for(let i=0;i<stripeCount;i++){
    ctx.fillStyle = (i%2===0) ? '#C8102E' : '#FFFFFF';
    ctx.fillRect(i*stripeW, 0, stripeW, c.height);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.needsUpdate = true;
  return tex;
}
const STRIPE_TEXTURE = makeCaptainStripeTexture();

const platforms = []; // {mesh, x, z, radius, topY}

function addPlatform(x, z, radius, height, color, opts){
  opts = opts||{};
  // the decorative cap disc + edge stripe sit slightly above the raw
  // cylinder body, so the *true* visual top surface is a bit higher than
  // `height` - match physics to that, not the bare cylinder, or players'
  // feet end up sinking slightly into the floor and ground-level effects
  // render partly underneath it.
  const topY = height + 0.155;
  const geo = new THREE.CylinderGeometry(radius, radius*1.03, height, 28);
  const mat = new THREE.MeshStandardMaterial({color, roughness:0.75, metalness:0.05});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, height/2, z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);

  // top cap accent disc
  const capGeo = new THREE.CylinderGeometry(radius*0.99, radius*0.99, 0.15, 28);
  const capMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.5, emissive:0x111111});
  const cap = new THREE.Mesh(capGeo, capMat);
  cap.position.set(x, height + 0.08, z);
  cap.receiveShadow = true;
  scene.add(cap);

  // caution stripe ring at the edge (signature visual detail)
  const stripeGeo = new THREE.TorusGeometry(radius*0.99, 0.16, 8, 40);
  const stripeTexClone = stripeTex.clone(); stripeTexClone.needsUpdate = true;
  stripeTexClone.repeat.set(Math.max(4, Math.round(radius*2)), 1);
  const stripeMat = new THREE.MeshStandardMaterial({map:stripeTexClone, roughness:0.6});
  const stripe = new THREE.Mesh(stripeGeo, stripeMat);
  stripe.rotation.x = Math.PI/2;
  stripe.position.set(x, height + 0.16, z);
  scene.add(stripe);

  const p = {x, z, radius, topY, mesh};
  platforms.push(p);
  return p;
}

// All platforms share the same top height ("床の高さはすべてそろえて")
const STAGE_HEIGHT = 6;

// キャラの胴体は幅0.85・奥行0.5ほどあるので(buildCharacterMesh参照)、当たり
// 判定でも「中心の一点」ではなく体の大きさぶんを加味する。あらゆる距離ベースの
// ヒットチェックにこの半径を足すことで、実際の体に触れれば当たるようにする。
const TARGET_HIT_RADIUS = 0.45;

// central big pillar - plenty of room for several players
const CENTER = addPlatform(0, 0, 9.5, STAGE_HEIGHT, 0x6B7A99);

const pillarColors = [0xFF6B6B,0x4ECDC4,0xFFD23F,0xA78BFA,0xFF9F1C,0x06D6A0,0xFF6FB1,0x5AC8FA,0xFF9AC1,0x7FD1FF,0xC4E86A,0xFFB4A2];

// 6 medium pillars evenly spaced around the center (slightly smaller than the center)
const MEDIUM_COUNT = 6;
const MEDIUM_RADIUS_DIST = 17;   // distance from origin
const MEDIUM_PILLAR_RADIUS = 5;  // slightly smaller than the center pillar
const MEDIUM_PLATFORMS = [];
for(let i=0;i<MEDIUM_COUNT;i++){
  const a = (i/MEDIUM_COUNT) * Math.PI*2;
  const x = Math.cos(a)*MEDIUM_RADIUS_DIST, z = Math.sin(a)*MEDIUM_RADIUS_DIST;
  MEDIUM_PLATFORMS.push(addPlatform(x, z, MEDIUM_PILLAR_RADIUS, STAGE_HEIGHT, pillarColors[i%pillarColors.length]));
}

// 6 small pillars tucked in the gaps between the medium pillars
const SMALL_COUNT = 6;
const SMALL_RADIUS_DIST = 17;    // same ring distance, offset in angle
const SMALL_PILLAR_RADIUS = 2.3;
for(let i=0;i<SMALL_COUNT;i++){
  const a = ((i+0.5)/SMALL_COUNT) * Math.PI*2; // halfway between two medium pillars
  const x = Math.cos(a)*SMALL_RADIUS_DIST, z = Math.sin(a)*SMALL_RADIUS_DIST;
  addPlatform(x, z, SMALL_PILLAR_RADIUS, STAGE_HEIGHT, pillarColors[(i+6)%pillarColors.length]);
}


/* ---------------- Fall particle effect ---------------- */
function spawnFallBurst(pos, p){
  const group = new THREE.Group();
  const headColor = trueHeadColorHex(p);
  const bodyColor = trueBodyColorHex(p);
  const legColor = trueLegColorHex(p);
  const partDefs = [
    {geo:new THREE.SphereGeometry(0.42,12,12), color:headColor, offset:new THREE.Vector3(0,0.75,0)},
    {geo:new THREE.BoxGeometry(0.85,0.95,0.5), color:bodyColor, offset:new THREE.Vector3(0,0,0)},
    {geo:new THREE.BoxGeometry(0.26,0.75,0.26), color:bodyColor, offset:new THREE.Vector3(0.58,0,0)},
    {geo:new THREE.BoxGeometry(0.26,0.75,0.26), color:bodyColor, offset:new THREE.Vector3(-0.58,0,0)},
    {geo:new THREE.BoxGeometry(0.32,0.65,0.32), color:legColor, offset:new THREE.Vector3(0.22,-0.65,0)},
    {geo:new THREE.BoxGeometry(0.32,0.65,0.32), color:legColor, offset:new THREE.Vector3(-0.22,-0.65,0)},
  ];
  const parts = [];
  for(const def of partDefs){
    const m = new THREE.MeshStandardMaterial({color:def.color});
    const mesh = new THREE.Mesh(def.geo, m);
    mesh.position.copy(pos).add(def.offset);
    const dir = new THREE.Vector3((Math.random()-0.5), Math.random()*0.5+0.35, (Math.random()-0.5)).normalize();
    const spin = new THREE.Vector3((Math.random()-0.5)*6, (Math.random()-0.5)*6, (Math.random()-0.5)*6);
    parts.push({mesh, vel: dir.multiplyScalar(4.5+Math.random()*3), spin});
    group.add(mesh);
  }
  scene.add(group);
  let life = 0;
  function anim(dt){
    life += dt;
    parts.forEach(pt=>{
      pt.vel.y -= 18*dt;
      pt.mesh.position.addScaledVector(pt.vel, dt);
      pt.mesh.rotation.x += pt.spin.x*dt; pt.mesh.rotation.y += pt.spin.y*dt; pt.mesh.rotation.z += pt.spin.z*dt;
      pt.mesh.material.opacity = Math.max(0, 1-life/1.1);
      pt.mesh.material.transparent = true;
    });
    if(life < 1.1) requestAnimationFrame(()=>anim(1/60));
    else scene.remove(group);
  }
  anim(1/60);
}

// A quick burst of yellow "speed lines" trailing behind whoever just
// lunged forward (e.g. Crusher's dash-punch), to sell the sudden burst
// of motion.
function spawnDashBurst(pos, dir, color){
  const group = new THREE.Group();
  const streakMat = new THREE.MeshBasicMaterial({color: color||0xFFD93D, transparent:true, opacity:0.9, side:THREE.DoubleSide, depthWrite:false});
  const perp = new THREE.Vector3(-dir.z, 0, dir.x);
  const angle = Math.atan2(dir.x, dir.z);
  const streaks = [];
  const count = 5;
  for(let i=0;i<count;i++){
    const offset = (i - (count-1)/2) * 0.18;
    const geo = new THREE.PlaneGeometry(0.07, 0.9);
    const streak = new THREE.Mesh(geo, streakMat.clone());
    streak.position.copy(pos).addScaledVector(perp, offset);
    streak.position.y += 0.9;
    streak.position.addScaledVector(dir, -0.35);
    streak.rotation.y = angle;
    group.add(streak);
    streaks.push(streak);
  }
  scene.add(group);
  let t = 0;
  function anim(dt){
    t += dt;
    streaks.forEach(s=>{
      s.position.addScaledVector(dir, -dt*3);
      s.scale.y = 1 + t*4;
      s.material.opacity = Math.max(0, 0.9 - t*4);
    });
    if(t < 0.26){
      requestAnimationFrame(()=>anim(1/60));
    } else {
      scene.remove(group);
      streaks.forEach(s=>{ s.geometry.dispose(); s.material.dispose(); });
    }
  }
  anim(1/60);
}

// シールドアサルト中、キャラの周りに青い光の輪を表示する
// ユニビーム充電中、胸のアークリアクターから光が膨らんでいく演出
function updateUnibeamCharge(p, active){
  if(active){
    if(!p.mesh.userData.reactorCharge){
      const glowMat = new THREE.MeshBasicMaterial({color:0xBFEFFF, transparent:true, opacity:0.6, side:THREE.DoubleSide, depthWrite:false});
      const glow = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), glowMat);
      glow.position.set(0, 1.18, 0.3);
      p.mesh.add(glow);
      p.mesh.userData.reactorCharge = glow;
      p.mesh.userData.reactorChargeStart = nowSec();
      p.mesh.userData.reactorRings = [];
      p.mesh.userData.reactorLastRingTime = 0;
    }
    const glow = p.mesh.userData.reactorCharge;
    glow.visible = true;
    const duration = (p.character && p.character.unibeamChargeDuration) || 1.2;
    const elapsed = nowSec() - (p.mesh.userData.reactorChargeStart || nowSec());
    const growth = Math.min(1, elapsed/duration);
    const pulse = 1 + Math.sin(nowSec()*16)*0.1;
    // grows to a big, unmissable ball of light by the time it's fully charged
    glow.scale.setScalar((0.7 + growth*6) * pulse);
    glow.material.opacity = 0.55 + growth*0.4;

    // periodically spawn expanding torus rings (not flat rings, so they read
    // correctly from every angle - including from directly behind the player)
    const ringInterval = 0.3 - growth*0.15;
    if(nowSec() - (p.mesh.userData.reactorLastRingTime||0) > ringInterval){
      p.mesh.userData.reactorLastRingTime = nowSec();
      const ringMat = new THREE.MeshBasicMaterial({color:0xBFEFFF, transparent:true, opacity:0.85, depthWrite:false});
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.035, 8, 24), ringMat);
      ring.position.set(0, 1.18, 0.3);
      p.mesh.add(ring);
      p.mesh.userData.reactorRings.push({mesh:ring, birth:nowSec()});
    }
    const rings = p.mesh.userData.reactorRings;
    for(let i=rings.length-1;i>=0;i--){
      const r = rings[i];
      const age = nowSec() - r.birth;
      const life = 0.7;
      if(age > life){
        p.mesh.remove(r.mesh);
        rings.splice(i,1);
        continue;
      }
      const frac = age/life;
      r.mesh.scale.setScalar(1 + frac*7);
      r.mesh.material.opacity = 0.85 * (1-frac);
    }
  } else if(p.mesh.userData.reactorCharge){
    p.mesh.userData.reactorCharge.visible = false;
    p.mesh.userData.reactorChargeStart = null;
    if(p.mesh.userData.reactorRings){
      for(const r of p.mesh.userData.reactorRings) p.mesh.remove(r.mesh);
      p.mesh.userData.reactorRings = [];
    }
  }
}

// マンティスのスリープ系スキルで眠っている間、頭上に小さくZZZを表示して

// より明らかに長い硬直が残っている時だけ「寝ている」とみなす。
function updateSleepIndicator(p, isAsleep){
  if(isAsleep){
    if(!p.mesh.userData.zzzSprite){
      const mat = new THREE.MeshBasicMaterial({map:ZZZ_TEXTURE, transparent:true, depthWrite:false, depthTest:false});
      const spr = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.65), mat);
      spr.position.set(0.3, 2.4, 0);
      spr.renderOrder = 999;
      p.mesh.add(spr);
      p.mesh.userData.zzzSprite = spr;
    }
    const spr = p.mesh.userData.zzzSprite;
    spr.visible = true;
    spr.position.y = 2.4 + Math.sin(nowSec()*2.2)*0.08;
    // billboard toward the camera: cancel out the parent's world rotation,
    // then apply the camera's world rotation directly, so this always
    // faces the camera correctly no matter which way the character is facing
    const parentQuat = new THREE.Quaternion();
    p.mesh.getWorldQuaternion(parentQuat);
    const camQuat = new THREE.Quaternion();
    camera.getWorldQuaternion(camQuat);
    spr.quaternion.copy(parentQuat.clone().invert().multiply(camQuat));
  } else if(p.mesh.userData.zzzSprite){
    p.mesh.userData.zzzSprite.visible = false;
  }
}

// A vertical yellow streak for 龍墜's launch (shooting up) and the start of
// its fall (shooting down).
function spawnVerticalStreak(pos, dirSign, color){
  const height = 3.2;
  const start = new THREE.Vector3(pos.x, pos.y + (dirSign>0 ? 0.2 : height), pos.z);
  const end = new THREE.Vector3(pos.x, pos.y + (dirSign>0 ? height : 0.2), pos.z);
  const curve = new THREE.LineCurve3(start, end);
  const geo = new THREE.TubeGeometry(curve, 1, 0.09, 8, false);
  const mat = new THREE.MeshBasicMaterial({color: color||0xFFD93D, transparent:true, opacity:0.9});
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  let t = 0;
  function anim(dt){
    t += dt;
    mat.opacity = Math.max(0, 0.9 - t*3.5);
    if(t < 0.28){
      requestAnimationFrame(()=>anim(1/60));
    } else {
      scene.remove(mesh); geo.dispose();
    }
  }
  anim(1/60);
}

function spawnPunchTrail(attacker, range, fwd, color){
  const dist = Math.min(range*1.4, 5);
  const start = new THREE.Vector3(attacker.pos.x, attacker.pos.y+0.9, attacker.pos.z);
  const end = new THREE.Vector3(
    attacker.pos.x + fwd.x*dist,
    attacker.pos.y+0.9 + fwd.y*dist,
    attacker.pos.z + fwd.z*dist
  );
  const mid = start.clone().lerp(end, 0.5);
  const length = start.distanceTo(end);
  const height = 1.75; // tall enough to read as a body-shaped afterimage

  const geo = new THREE.PlaneGeometry(length, height);
  const mat = new THREE.MeshBasicMaterial({color: color||0xFFD93D, transparent:true, opacity:0.5, side:THREE.DoubleSide, depthWrite:false});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(mid);

  // orient the plane so its width axis actually points along the real 3D
  // travel direction (including any up/down tilt), not just the horizontal
  // yaw - this is what lets it angle diagonally for an upward/downward hit
  const xAxis = fwd.clone().normalize();
  let ref = new THREE.Vector3(0,1,0);
  if(Math.abs(xAxis.dot(ref)) > 0.98) ref = new THREE.Vector3(0,0,1); // avoid a degenerate cross product when aiming nearly straight up/down
  const zAxis = new THREE.Vector3().crossVectors(ref, xAxis).normalize();
  const yAxis = new THREE.Vector3().crossVectors(xAxis, zAxis).normalize();
  mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis));

  scene.add(mesh);

  let t = 0;
  function anim(dt){
    t += dt;
    mat.opacity = Math.max(0, 0.5 - t*2.2);
    if(t < 0.24){
      requestAnimationFrame(()=>anim(1/60));
    } else {
      scene.remove(mesh); geo.dispose();
    }
  }
  anim(1/60);
}

function spawnHitSpark(pos, color){
  const geo = new THREE.RingGeometry(0.1,0.4,16);
  const mat = new THREE.MeshBasicMaterial({color, transparent:true, side:THREE.DoubleSide});
  const ring = new THREE.Mesh(geo, mat);
  ring.position.copy(pos);
  ring.lookAt(camera.position);
  scene.add(ring);
  let t=0;
  function anim(dt){
    t+=dt;
    ring.scale.setScalar(1 + t*6);
    mat.opacity = Math.max(0, 1 - t*2.2);
    ring.lookAt(camera.position);
    if(t<0.45) requestAnimationFrame(()=>anim(1/60));
    else scene.remove(ring);
  }
  anim(1/60);
}

// キャプテンの通常攻撃: 銃弾のトレーサーではなく、実際の盾メッシュを投げて
// 飛ばす。飛んでいる間は右腕の盾を隠し、着弾/最大距離に達したら消して腕に戻す。
function spawnShieldThrow(attacker, fromPos, toPos, hitRadius, onHit){
  if(attacker.mesh.userData.shieldMesh2) attacker.mesh.userData.shieldMesh2.visible = false;

  const rimMat = new THREE.MeshStandardMaterial({color:0xC7CBD1, roughness:0.35, metalness:0.6});
  const frontMat = new THREE.MeshBasicMaterial({map:SHIELD_TEXTURE, transparent:true});
  const backMat = new THREE.MeshStandardMaterial({color:0x8a8f98, roughness:0.5, metalness:0.4});
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.1, 24), [rimMat, frontMat, backMat]);
  // no extra rotation needed - a cylinder's "top" cap already faces straight
  // up by default, so it flies flat/horizontal with the pattern facing skyward
  mesh.position.copy(fromPos);
  scene.add(mesh);

  const dist = fromPos.distanceTo(toPos);
  const duration = THREE.MathUtils.clamp(dist/45, 0.12, 0.5);
  let t = 0;
  function anim(dt){
    t += dt;
    const frac = Math.min(1, t/duration);
    mesh.position.lerpVectors(fromPos, toPos, frac);
    mesh.rotation.y += dt*25; // spins flat, like a thrown frisbee

    // hit the stage (a pillar's solid ground) before reaching anyone or
    // the max range? stop right here instead of clipping through
    if(isPositionInsideStage(mesh.position)){
      scene.remove(mesh);
      if(attacker.mesh.userData.shieldMesh2) attacker.mesh.userData.shieldMesh2.visible = true;
      if(onHit) onHit(null, mesh.position.clone());
      return;
    }

    // real-time collision: check against everyone's ACTUAL current position
    // right now, not where they were when the shield was thrown
    for(const target of players){
      if(target === attacker || !target.alive) continue;
      if(isFriendlyFire(attacker, target)) continue;
      const dx = target.pos.x-mesh.position.x, dz = target.pos.z-mesh.position.z, dy = (target.pos.y+1.0)-mesh.position.y;
      const d3 = Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d3 <= hitRadius + TARGET_HIT_RADIUS){
        scene.remove(mesh);
        if(attacker.mesh.userData.shieldMesh2) attacker.mesh.userData.shieldMesh2.visible = true;
        if(onHit) onHit(target, mesh.position.clone());
        return;
      }
    }

    if(frac < 1){
      requestAnimationFrame(()=>anim(1/60));
    } else {
      scene.remove(mesh);
      if(attacker.mesh.userData.shieldMesh2) attacker.mesh.userData.shieldMesh2.visible = true;
      if(onHit) onHit(null, mesh.position.clone());
    }
  }
  anim(1/60);
}

// ガンビットの通常攻撃: チャージされたトランプカードを投げる。着弾すると
// 小さな爆発の光が弾ける
// マンティスの通常攻撃: 緑のエネルギー球を放つ。一定距離まではまっすぐ飛ぶが、
// そこから先は重力に引かれてどんどん落ちていく(グレネードのような放物線)
// パニッシャーの銃など、ヒットスキャン武器の弾道を見せるためのトレーサー。
// 当たり判定はすでに確定済みなので、これは純粋に見た目だけの演出。
// 発射の瞬間に線がパッと伸び、すぐ消える。
function spawnBulletTracer(fromPos, toPos, color, radius){
  radius = radius != null ? radius : 0.025;
  const dist = fromPos.distanceTo(toPos);
  const geo = new THREE.CylinderGeometry(radius, radius, dist, 8);
  geo.rotateX(Math.PI/2); // cylinder's long axis is Y by default; point it along Z
  geo.translate(0, 0, dist/2); // shift so the origin end sits at the mesh's own position
  const mat = new THREE.MeshBasicMaterial({color: color||0xFFF3B0, transparent:true, opacity:0.95, depthWrite:false});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(fromPos);
  mesh.lookAt(toPos);
  scene.add(mesh);

  // small muzzle flash + impact flash for extra feedback
  const flashMat = new THREE.MeshBasicMaterial({color:0xFFE9A8, transparent:true, opacity:0.9, depthWrite:false});
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), flashMat);
  muzzle.position.copy(fromPos);
  scene.add(muzzle);
  const impact = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), flashMat.clone());
  impact.position.copy(toPos);
  scene.add(impact);

  let t = 0;
  function anim(dt){
    t += dt;
    const fade = Math.max(0, 1 - t/0.12);
    mesh.material.opacity = 0.95 * fade;
    muzzle.material.opacity = 0.9 * fade;
    impact.material.opacity = 0.9 * fade;
    muzzle.scale.setScalar(1 + (1-fade)*1.5);
    impact.scale.setScalar(1 + (1-fade)*1.5);
    if(t < 0.12){
      requestAnimationFrame(()=>anim(1/60));
    } else {
      scene.remove(mesh); scene.remove(muzzle); scene.remove(impact);
    }
  }
  anim(1/60);
}

function spawnOrbProjectile(attacker, fromPos, aimDir, char, opts){
  opts = opts || {};
  const speed = opts.speed || char.attackOrbSpeed || 34;
  const straightDist = opts.straightDist || char.attackStraightDistance || 23;
  const dmg = opts.damage != null ? opts.damage : char.attackDamage;
  const hitRadius = opts.hitRadius != null ? opts.hitRadius : (char.attackHitRadius || 0.45);
  const knockback = opts.knockback != null ? opts.knockback : char.knockback;
  const knockUp = opts.knockUp != null ? opts.knockUp : char.knockUp;
  const color = opts.color || 0x4CFF6B;
  const glowColor = opts.glowColor || 0x9FFFB0;
  const sleepDuration = opts.sleepDuration || 0;
  const explosionRadius = opts.explosionOnFloor ? (opts.explosionRadius || 2) : 0;
  const allyHealAmount = opts.allyHealAmount || 0;

  const orbMat = new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.9});
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 10), orbMat);
  const glowMat = new THREE.MeshBasicMaterial({color:glowColor, transparent:true, opacity:0.4, depthWrite:false});
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.5, 10, 8), glowMat);
  mesh.add(glow);
  mesh.position.copy(fromPos);
  scene.add(mesh);

  function applySleep(target){
    if(!sleepDuration) return;
    target.hitstun = Math.max(target.hitstun, sleepDuration);
    spawnAoeBurst(new THREE.Vector3(target.pos.x, target.pos.y+1.3, target.pos.z), 0.7, glowColor);
  }
  function explodeHere(atPos){
    if(!explosionRadius) return;
    spawnGrenadeBurst(atPos, explosionRadius, color);
    for(const target of players){
      if(target === attacker || !target.alive) continue;
      if(isFriendlyFire(attacker, target)) continue;
      const dx = target.pos.x-atPos.x, dz = target.pos.z-atPos.z, dy = (target.pos.y+1.0)-atPos.y;
      const dist = Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(dist > explosionRadius + TARGET_HIT_RADIUS) continue;
      const dir = Math.hypot(dx,dz) > 0.0001 ? new THREE.Vector3(dx,0,dz).normalize() : new THREE.Vector3(0,0,1);
      applyHit(attacker, target, dir, knockback, knockUp, computeDamageWithPassives(attacker, target, dmg));
      applySleep(target);
    }
  }

  const dir = aimDir.clone().normalize();
  const vel = dir.clone().multiplyScalar(speed);
  let traveledStraight = 0;
  let falling = false;

  function anim(dt){
    if(!falling){
      const step = speed*dt;
      mesh.position.addScaledVector(dir, step);
      traveledStraight += step;
      if(traveledStraight >= straightDist){
        falling = true;
        vel.copy(dir).multiplyScalar(speed); // keep current horizontal speed as the falling-phase starting velocity
      }
    } else {
      vel.y += GRAVITY*dt;
      mesh.position.addScaledVector(vel, dt);
    }
    mesh.rotation.y += dt*10;

    if(isPositionInsideStage(mesh.position) || mesh.position.y < VOID_Y){
      const atPos = mesh.position.clone();
      const surfaceY = findStageSurfaceAt(mesh.position);
      if(surfaceY !== null) atPos.y = surfaceY + 0.1; // sit just above the surface, not buried in it
      scene.remove(mesh);
      explodeHere(atPos); // a slight explosion when it lands, if this variant has one
      return;
    }
    for(const target of players){
      if(target === attacker || !target.alive) continue;
      const dx = target.pos.x-mesh.position.x, dz = target.pos.z-mesh.position.z, dy = (target.pos.y+1.0)-mesh.position.y;
      const d3 = Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d3 > hitRadius + TARGET_HIT_RADIUS) continue;
      if(isFriendlyFire(attacker, target)){
        // チーム戦: 味方に当たった場合はダメージではなく回復になる
        if(!allyHealAmount) continue;
        target.hp = Math.min(target.maxHp || target.hp, target.hp + allyHealAmount);
        if(target.isLocal) updateHpUI();
        spawnAoeBurst(new THREE.Vector3(target.pos.x, target.pos.y+1.0, target.pos.z), 0.8, 0x7CFFB2);
        scene.remove(mesh);
        return;
      }
      const hitDir = Math.hypot(dx,dz) > 0.0001 ? new THREE.Vector3(dx,0,dz).normalize() : new THREE.Vector3(0,0,1);
      applyHit(attacker, target, hitDir, knockback, knockUp, computeDamageWithPassives(attacker, target, dmg));
      applySleep(target);
      const atPos = mesh.position.clone();
      scene.remove(mesh);
      explodeHere(atPos); // also explodes right where it hit, catching anyone else nearby too
      return;
    }
    requestAnimationFrame(()=>anim(1/60));
  }
  anim(1/60);
}

function spawnCardThrow(attacker, fromPos, toPos, char, chargeTier){
  const hitRadius = char.attackHitRadius || 0.3;
  chargeTier = chargeTier || 0;
  const chargeMult = chargeTier >= 3 ? 2.5 : chargeTier === 2 ? 2 : chargeTier === 1 ? 1.5 : 1;
  const explosionRadius = (char.attackExplosionRadius || 2.5) * chargeMult;
  const cardDamage = char.attackDamage;
  const damageByTier = char.attackExplosionDamageByTier;
  const explosionDamage = damageByTier ? damageByTier[Math.min(chargeTier, damageByTier.length-1)]
    : (char.attackExplosionDamage != null ? char.attackExplosionDamage : Math.round(cardDamage*0.5));

  const cardMat = new THREE.MeshBasicMaterial({color:0xF4EDE0, side:THREE.DoubleSide});
  const edgeMat = new THREE.MeshBasicMaterial({color:0xE0335A});
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.02, 0.5), [edgeMat, edgeMat, cardMat, cardMat, edgeMat, edgeMat]);
  mesh.position.copy(fromPos);
  scene.add(mesh);

  // a charged throw carries a pink-purple glow along with it, sized to
  // match how long it was charged
  if(chargeTier > 0){
    const glowMat = new THREE.MeshBasicMaterial({color:0xCF6FFF, transparent:true, opacity:0.55, depthWrite:false});
    const glow = new THREE.Mesh(new THREE.SphereGeometry(0.22 + chargeTier*0.08, 12, 10), glowMat);
    mesh.add(glow);
  }

  // the explosion is its own separate hit check/damage from the card
  // itself - it always goes off wherever the card stops, whether that's
  // because it hit someone directly or because it ran out of range, and it
  // can hit people the card itself never touched (splash)
  function explode(atPos){
    spawnGrenadeBurst(atPos, explosionRadius, 0xCF6FFF);
    playFantasyPopSound(0.4);
    for(const target of players){
      if(target === attacker || !target.alive) continue;
      if(isFriendlyFire(attacker, target)) continue;
      const dx = target.pos.x-atPos.x, dz = target.pos.z-atPos.z, dy = (target.pos.y+1.0)-atPos.y;
      const dist = Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(dist > explosionRadius + TARGET_HIT_RADIUS) continue;
      const dir = Math.hypot(dx,dz) > 0.0001 ? new THREE.Vector3(dx,0,dz).normalize() : new THREE.Vector3(0,0,1);
      applyHit(attacker, target, dir, char.knockback, char.knockUp, computeDamageWithPassives(attacker, target, explosionDamage));
      trackKineticCharge(attacker, target);
    }
  }

  const dist = fromPos.distanceTo(toPos);
  const duration = THREE.MathUtils.clamp(dist/50, 0.1, 0.45);
  let t = 0;
  function anim(dt){
    t += dt;
    const frac = Math.min(1, t/duration);
    mesh.position.lerpVectors(fromPos, toPos, frac);
    mesh.rotation.y += dt*30; // spins flat like a thrown playing card
    mesh.rotation.x += dt*6;

    // hit the stage (a pillar's solid ground) before reaching anyone or
    // the max range? explode right here instead of clipping through
    if(isPositionInsideStage(mesh.position)){
      const hitPos = mesh.position.clone();
      scene.remove(mesh);
      explode(hitPos);
      return;
    }

    // real-time direct-hit check against everyone's ACTUAL current position
    for(const target of players){
      if(target === attacker || !target.alive) continue;
      if(isFriendlyFire(attacker, target)) continue;
      const dx = target.pos.x-mesh.position.x, dz = target.pos.z-mesh.position.z, dy = (target.pos.y+1.0)-mesh.position.y;
      const d3 = Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d3 <= hitRadius + TARGET_HIT_RADIUS){
        const hitPos = mesh.position.clone();
        scene.remove(mesh);
        const dirToTarget = new THREE.Vector3(target.pos.x-attacker.pos.x, 0, target.pos.z-attacker.pos.z).normalize();
        applyHit(attacker, target, dirToTarget, char.knockback, char.knockUp, computeDamageWithPassives(attacker, target, cardDamage));
        trackKineticCharge(attacker, target);
        explode(hitPos); // the explosion still goes off separately, right where the card landed
        return;
      }
    }

    if(frac < 1){
      requestAnimationFrame(()=>anim(1/60));
    } else {
      scene.remove(mesh);
      explode(toPos); // reached max range without a direct hit - still explodes here
    }
  }
  anim(1/60);
}

// ガンビットのスキル1: 爆発しないカードを投げる。床やキャラに当たったら、
// そこで止まって刺さったまま残る(当たった瞬間にダメージも爆発もしない)。
// 起爆ボタンを押した時にまとめて起爆させるため、着地地点とメッシュを
// onStickコールバックで返す。
function spawnStickyCardThrow(attacker, fromPos, toPos, maxRange, onStick){
  // capture which "generation" this throw belongs to - if a round reset
  // happens while this card is still mid-flight (not yet landed/tracked in
  // stickyCards), the generation counter gets bumped and this in-flight
  // card cleans itself up instead of landing/lingering after the reset
  const myGeneration = attacker.stickyCardGeneration;
  const cardMat = new THREE.MeshBasicMaterial({color:0xF4EDE0, side:THREE.DoubleSide});
  const edgeMat = new THREE.MeshBasicMaterial({color:0xCF6FFF});
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.02, 0.5), [edgeMat, edgeMat, cardMat, cardMat, edgeMat, edgeMat]);
  mesh.position.copy(fromPos);
  scene.add(mesh);

  // a bright standing glow so a stuck card is easy to spot from a distance
  // while it's sitting there waiting to be detonated
  const glowMat = new THREE.MeshBasicMaterial({color:0xCF6FFF, transparent:true, opacity:0.6, depthWrite:false});
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 10), glowMat);
  mesh.add(glow);

  const dist = fromPos.distanceTo(toPos);
  const duration = THREE.MathUtils.clamp(dist/50, 0.1, 0.45);
  let t = 0;
  // sticking to the stage: stays at a fixed world position. Sticking to a
  // character: actually attaches to them (parented to their mesh) so it
  // rides along as they move, instead of hanging in the empty air they
  // used to be standing in.
  function stickToStage(atPos){
    mesh.position.copy(atPos);
    function idleSpin(){
      if(!mesh.parent) return; // detonated/removed already
      mesh.rotation.y += 0.02;
      glow.scale.setScalar(1 + Math.sin(nowSec()*4)*0.15);
      requestAnimationFrame(idleSpin);
    }
    idleSpin();
    if(onStick) onStick({getPos: ()=>atPos.clone()}, mesh);
  }
  function stickToTarget(target){
    const worldPos = mesh.position.clone();
    scene.remove(mesh);
    target.mesh.add(mesh);
    mesh.position.copy(target.mesh.worldToLocal(worldPos));
    function idleSpin(){
      if(!mesh.parent) return; // detonated/removed already
      mesh.rotation.y += 0.02;
      glow.scale.setScalar(1 + Math.sin(nowSec()*4)*0.15);
      requestAnimationFrame(idleSpin);
    }
    idleSpin();
    if(onStick) onStick({getPos: ()=>{
      const p = new THREE.Vector3();
      mesh.getWorldPosition(p);
      return p;
    }}, mesh, target);
  }
  function anim(dt){
    if(attacker.stickyCardGeneration !== myGeneration){
      // a round reset happened while this card was still in the air -
      // clean it up instead of landing/lingering after the reset
      if(mesh.parent) mesh.parent.remove(mesh);
      return;
    }
    t += dt;
    const frac = Math.min(1, t/duration);
    mesh.position.lerpVectors(fromPos, toPos, frac);
    mesh.rotation.y += dt*30;
    mesh.rotation.x += dt*6;

    const surfaceY = findStageSurfaceAt(mesh.position);
    if(surfaceY !== null){
      const stuckPos = mesh.position.clone();
      stuckPos.y = surfaceY + 0.03; // sit just on top of the surface, not embedded in it
      stickToStage(stuckPos);
      return;
    }
    for(const target of players){
      if(target === attacker || !target.alive) continue;
      if(isFriendlyFire(attacker, target)) continue;
      const dx = target.pos.x-mesh.position.x, dz = target.pos.z-mesh.position.z, dy = (target.pos.y+1.0)-mesh.position.y;
      const d3 = Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d3 <= 0.3 + TARGET_HIT_RADIUS){
        stickToTarget(target);
        return;
      }
    }

    if(frac < 1){
      requestAnimationFrame(()=>anim(1/60));
    } else {
      // reached max range without hitting anyone or the stage - there's
      // nothing to stick to out here, so the throw is just wasted
      scene.remove(mesh);
    }
  }
  anim(1/60);
}

// 盾の追加効果: 命中した相手の半径4以内に他の敵がいれば、盾はそちらへ軌道を
// 変えて確実に命中する。複数いれば順番に当てていくが、リコシェットで当たった
// 相手からはさらに追加効果は発動しない(最初の命中からの一度きりの分岐)。
function performShieldRicochet(attacker, char, fromPos, primaryTarget){
  const nearby = players
    .filter(p => p !== attacker && p !== primaryTarget && p.alive && !isFriendlyFire(attacker, p))
    .map(p => ({ p, dist: Math.hypot(p.pos.x-primaryTarget.pos.x, p.pos.z-primaryTarget.pos.z) }))
    .filter(o => o.dist <= 4)
    .sort((a,b) => a.dist - b.dist);

  if(nearby.length === 0) return;

  let chainFrom = fromPos.clone();
  let idx = 0;
  function nextHop(){
    if(idx >= nearby.length) return;
    const nextTarget = nearby[idx].p;
    idx++;
    const toPos = new THREE.Vector3(nextTarget.pos.x, nextTarget.pos.y+1.0, nextTarget.pos.z);
    spawnShieldThrow(attacker, chainFrom, toPos, char.attackHitRadius || 1.1, (hitDuring, hitPos)=>{
      // the ricochet is aimed straight at nextTarget, so a real-time miss
      // here would be unusual, but fall back to whichever target actually
      // got hit (or nextTarget if the shield reached the destination clean)
      const actualTarget = hitDuring || nextTarget;
      if(actualTarget && actualTarget.alive){
        const dirToTarget = new THREE.Vector3(actualTarget.pos.x-attacker.pos.x, 0, actualTarget.pos.z-attacker.pos.z).normalize();
        applyHit(attacker, actualTarget, dirToTarget, char.knockback, char.knockUp, computeDamageWithPassives(attacker, actualTarget, char.attackRicochetDamage || char.attackDamage));
      }
      chainFrom = hitPos || toPos;
      nextHop();
    });
  }
  nextHop();
}

// アイアンマンの手のひらビーム用エフェクト - 太めの光る筒が一瞬光って消える
function spawnBeamEffect(origin, endPoint, color, radius, duration){
  const dir = new THREE.Vector3().subVectors(endPoint, origin);
  const len = dir.length();
  if(len < 0.001) return;
  const r = radius || 0.09;
  const dur = duration || 0.2;
  const curve = new THREE.LineCurve3(origin, endPoint);
  const geo = new THREE.TubeGeometry(curve, 1, r, 12, false);
  const mat = new THREE.MeshBasicMaterial({color: color||0xBFEFFF, transparent:true, opacity:0.95});
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);

  const glowGeo = new THREE.TubeGeometry(curve, 1, r*2.4, 12, false);
  const glowMat = new THREE.MeshBasicMaterial({color: color||0xBFEFFF, transparent:true, opacity:0.3});
  const glowMesh = new THREE.Mesh(glowGeo, glowMat);
  scene.add(glowMesh);

  let t = 0;
  function anim(dt){
    t += dt;
    const fade = Math.max(0, 1 - t/dur);
    mat.opacity = 0.95 * fade;
    glowMat.opacity = 0.3 * fade;
    if(t < dur){
      requestAnimationFrame(()=>anim(1/60));
    } else {
      scene.remove(mesh); geo.dispose();
      scene.remove(glowMesh); glowGeo.dispose();
    }
  }
  anim(1/60);
}

function spawnTracer(origin, endPoint){
  const dir = new THREE.Vector3().subVectors(endPoint, origin);
  const len = Math.max(0.05, dir.length());
  const geo = new THREE.CylinderGeometry(0.035, 0.035, len, 6);
  const mat = new THREE.MeshBasicMaterial({color:0xFFE68A, transparent:true, opacity:0.95});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(origin).addScaledVector(dir, 0.5);
  const upAxis = new THREE.Vector3(0,1,0);
  mesh.quaternion.setFromUnitVectors(upAxis, dir.clone().normalize());
  scene.add(mesh);

  const flashGeo = new THREE.SphereGeometry(0.12, 8, 8);
  const flashMat = new THREE.MeshBasicMaterial({color:0xFFF3C0, transparent:true, opacity:0.95});
  const flash = new THREE.Mesh(flashGeo, flashMat);
  flash.position.copy(origin);
  scene.add(flash);

  let t = 0;
  function anim(dt){
    t += dt;
    mat.opacity = Math.max(0, 0.95 - t*5);
    flashMat.opacity = Math.max(0, 0.95 - t*8);
    flash.scale.setScalar(1 + t*10);
    if(t < 0.2) requestAnimationFrame(()=>anim(1/60));
    else { scene.remove(mesh); scene.remove(flash); }
  }
  anim(1/60);
}

function spawnAoeBurst(center, radius, color){
  const geo = new THREE.RingGeometry(0.15, 0.4, 32);
  const mat = new THREE.MeshBasicMaterial({color: color||0xFFCC66, transparent:true, opacity:0.9, side:THREE.DoubleSide});
  const ring = new THREE.Mesh(geo, mat);
  ring.rotation.x = -Math.PI/2;
  ring.position.copy(center);
  scene.add(ring);
  // the ring geometry's own outer edge is at radius 0.4, so scale it up so
  // that its outer edge actually reaches the requested radius - otherwise
  // the visual only ever grows to 0.4x the real hit-detection radius
  const endScale = Math.max(1, radius / 0.4);
  let t = 0;
  function anim(dt){
    t += dt;
    const s = 1 + (endScale - 1) * Math.min(1, t/0.3);
    ring.scale.set(s, s, s);
    mat.opacity = Math.max(0, 0.9 - t*1.7);
    if(t < 0.55) requestAnimationFrame(()=>anim(1/60));
    else scene.remove(ring);
  }
  anim(1/60);
}

// A true 3D spherical burst for the grenade - a bright flash core plus a
// translucent shell that expands out to the actual (now height-aware) blast
// radius, so the effect actually looks like it can reach up and down too.
function spawnGrenadeBurst(center, radius, color){
  const shellMat = new THREE.MeshBasicMaterial({color: color||0xFFCC66, transparent:true, opacity:0.5, side:THREE.DoubleSide, depthWrite:false});
  const shell = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), shellMat);
  shell.scale.setScalar(0.01);
  shell.position.copy(center);
  scene.add(shell);

  const flashMat = new THREE.MeshBasicMaterial({color:0xFFF3C0, transparent:true, opacity:0.95});
  const flash = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 10), flashMat);
  flash.position.copy(center);
  scene.add(flash);

  let t = 0;
  function anim(dt){
    t += dt;
    const s = radius * Math.min(1, t/0.28);
    shell.scale.setScalar(Math.max(0.01, s));
    shellMat.opacity = Math.max(0, 0.5 - t*1.1);
    flash.scale.setScalar(1 + t*16);
    flashMat.opacity = Math.max(0, 0.95 - t*4.5);
    if(t < 0.55){
      requestAnimationFrame(()=>anim(1/60));
    } else {
      scene.remove(shell); scene.remove(flash);
    }

  anim(1/60);
}

// A wide, flat, fading swipe arc showing the path a swung chain weapon just
// carved through the air - makes the swing unmistakable even if the actual
// rod motion is subtle from some camera angles.
function spawnChainSwingTrail(attacker, range){
  const startYaw = attacker.yaw + Math.PI/2.2;   // swing starts out to the side
  const endYaw = attacker.yaw - Math.PI/2.2;      // and sweeps across the front
  const r = Math.min(range*0.85, 3.2);
  const segs = 18;
  const pts = [];
  for(let i=0;i<=segs;i++){
    const a = startYaw + (endYaw-startYaw)*(i/segs);
    pts.push(new THREE.Vector3(Math.sin(a)*r, 0, Math.cos(a)*r));
    pts.push(new THREE.Vector3(Math.sin(a)*(r*0.55), 0, Math.cos(a)*(r*0.55)));
  }
  const shape = new THREE.BufferGeometry().setFromPoints(pts);
  const idx = [];
  for(let i=0;i<segs;i++){
    const a=i*2, b=i*2+1, c=i*2+2, d=i*2+3;
    idx.push(a,b,c, b,d,c);
  }
  shape.setIndex(idx);
  const mat = new THREE.MeshBasicMaterial({color:0xE53939, transparent:true, opacity:0.55, side:THREE.DoubleSide});
  const mesh = new THREE.Mesh(shape, mat);
  mesh.position.set(attacker.pos.x, attacker.pos.y+1.0, attacker.pos.z);
  scene.add(mesh);
  let t=0;
  function anim(dt){
    t+=dt;
    mat.opacity = Math.max(0, 0.55 - t*2.2);
    if(t<0.25) requestAnimationFrame(()=>anim(1/60));
    else { scene.remove(mesh); shape.dispose(); }
  }
  anim(1/60);
}

/* ---------------- Grenade: thrown-projectile skill (aim, preview, throw, detonate) ---------------- */
const GRENADE_SIM_DT = 0.045;
const GRENADE_SIM_STEPS = 70;
const GRENADE_MIN_POWER_RATIO = 0.4; // weakest throw = 40% of max speed (short lob)
const GRENADE_POWER_SENSITIVITY = 0.0022; // per pixel of vertical drag while charging
let grenadeChargePower = 0.6; // 0..1, adjustable while charging; capped at 1 = max range

const GRENADE_BALL_RADIUS = 0.17;

function currentGrenadeSpeed(char){
  const maxSpeed = char.skillThrowSpeed || 22; // <- the range cap
  const minSpeed = maxSpeed * GRENADE_MIN_POWER_RATIO;
  return minSpeed + grenadeChargePower * (maxSpeed - minSpeed);
}

function simulateGrenadeArc(originPos, yaw, angle, speed){
  const dir = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const vy0 = speed * Math.sin(angle);
  const vxz = speed * Math.cos(angle);
  let pos = originPos.clone();
  let vel = new THREE.Vector3(dir.x*vxz, vy0, dir.z*vxz);
  const path = [pos.clone()];
  for(let i=0;i<GRENADE_SIM_STEPS;i++){
    vel.y += GRAVITY * GRENADE_SIM_DT;
    pos = pos.clone().addScaledVector(vel, GRENADE_SIM_DT);
    let landed = false;
    for(const pl of platforms){
      const dx = pos.x-pl.x, dz = pos.z-pl.z;
      if(Math.hypot(dx,dz) < pl.radius && pos.y <= pl.topY && vel.y <= 0){
        pos = pos.clone(); pos.y = pl.topY + GRENADE_BALL_RADIUS;
        landed = true;
        break;
      }
    }
    path.push(pos.clone());
    if(landed || pos.y < VOID_Y+2) break;
  }
  return { landing: path[path.length-1].clone(), path, duration: path.length * GRENADE_SIM_DT };
}

let grenadePreview = null;
let isChargingGrenade = false;

function updateGrenadePreview(attacker){
  const char = attacker.character;
  const origin = new THREE.Vector3(attacker.pos.x, attacker.pos.y+1.2, attacker.pos.z);
  const sim = simulateGrenadeArc(origin, attacker.yaw, char.skillThrowAngle || 0.5236, currentGrenadeSpeed(char));
  if(!grenadePreview){
    const lineMat = new THREE.LineDashedMaterial({color:0xFFCC66, dashSize:0.3, gapSize:0.18, linewidth:2, transparent:true, opacity:0.95});
    const line = new THREE.Line(new THREE.BufferGeometry(), lineMat);
    const ringGeo = new THREE.RingGeometry(0.35, 0.55, 28);
    const ringMat = new THREE.MeshBasicMaterial({color:0xFFCC66, transparent:true, opacity:0.75, side:THREE.DoubleSide});
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI/2;
    scene.add(line); scene.add(ring);
    grenadePreview = {line, ring};
  }
  grenadePreview.line.geometry.dispose();
  grenadePreview.line.geometry = new THREE.BufferGeometry().setFromPoints(sim.path);
  grenadePreview.line.computeLineDistances();
  grenadePreview.ring.position.set(sim.landing.x, sim.landing.y+0.05, sim.landing.z);
}

function clearGrenadePreview(){
  if(grenadePreview){
    scene.remove(grenadePreview.line);
    scene.remove(grenadePreview.ring);
    grenadePreview.line.geometry.dispose();
    grenadePreview = null;
  }
}

const pendingGrenades = [];

// ガンビットのスティッキーカードを起爆する: ステージ上に刺さっている自分の
// カードを全て、それぞれの場所で半径2の球状爆発として同時に爆破する
function detonateStickyCards(attacker){
  const char = attacker.character;
  if(!char || !attacker.stickyCards || attacker.stickyCards.length === 0) return;
  const radius = char.skillRadius || 2;
  const damage = char.skillDamage || 50;
  for(const card of attacker.stickyCards){
    const pos = card.getPos ? card.getPos() : card.pos;
    if(card.mesh && card.mesh.parent) card.mesh.parent.remove(card.mesh);
    spawnGrenadeBurst(pos, radius, 0xCF6FFF);
    playFantasyPopSound(0.4);
    for(const target of players){
      if(target === attacker || !target.alive) continue;
      if(isFriendlyFire(attacker, target)) continue;
      const dx = target.pos.x-pos.x, dz = target.pos.z-pos.z, dy = (target.pos.y+1.0)-pos.y;
      const dist = Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(dist > radius + TARGET_HIT_RADIUS) continue;
      const dir = Math.hypot(dx,dz) > 0.0001 ? new THREE.Vector3(dx,0,dz).normalize() : new THREE.Vector3(0,0,1);
      applyHit(attacker, target, dir, char.skillKnockback, char.skillKnockUp, computeDamageWithPassives(attacker, target, damage));
      trackKineticCharge(attacker, target);
    }
  }
  attacker.stickyCards = [];
}

function throwGrenade(attacker){
  const char = attacker.character;
  attacker.skillCooldown = withCooldownExtension(attacker, char.skillCooldownMax || 6);
  attacker.attacking = 0.2;
  const origin = new THREE.Vector3(attacker.pos.x, attacker.pos.y+1.2, attacker.pos.z);
  const sim = simulateGrenadeArc(origin, attacker.yaw, char.skillThrowAngle || 0.5236, currentGrenadeSpeed(char));

  const geo = new THREE.SphereGeometry(GRENADE_BALL_RADIUS, 10, 10);
  const mat = new THREE.MeshStandardMaterial({color:0x2b2f45, roughness:0.4, metalness:0.3});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(origin);
  mesh.castShadow = true;
  scene.add(mesh);

  pendingGrenades.push({ attacker, char, path: sim.path, landing: sim.landing, mesh, t:0, duration: Math.max(0.15, sim.duration) });
}

function updatePendingGrenades(dt){
  for(let i=pendingGrenades.length-1; i>=0; i--){
    const g = pendingGrenades[i];
    g.t += dt;
    const frac = Math.min(1, g.t / g.duration);
    const idx = Math.min(g.path.length-1, Math.floor(frac*(g.path.length-1)));
    g.mesh.position.copy(g.path[idx]);
    g.mesh.rotation.x += dt*8; g.mesh.rotation.y += dt*6;
    if(frac >= 1){
      scene.remove(g.mesh);
      detonateGrenade(g);
      pendingGrenades.splice(i,1);
    }
  }
}

function detonateGrenade(g){
  spawnGrenadeBurst(new THREE.Vector3(g.landing.x, g.landing.y+0.15, g.landing.z), g.char.skillRadius, 0xE5433D);
  for(const target of players){
    if(target === g.attacker || !target.alive) continue;
    if(isFriendlyFire(g.attacker, target)) continue;
    const dx = target.pos.x-g.landing.x, dy = (target.pos.y+0.8)-g.landing.y, dz = target.pos.z-g.landing.z;
    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz); // full 3D distance - jumping clear of the blast now helps
    if(dist > g.char.skillRadius + TARGET_HIT_RADIUS || dist < 0.0001) continue;
    const dir = new THREE.Vector3(dx, 0, dz).normalize();
    applyHit(g.attacker, target, dir, g.char.skillKnockback, g.char.skillKnockUp, computeDamageWithPassives(g.attacker, target, g.char.skillDamage));
  }
}
