// A lingering, slowly-drifting cloud of soft gray puffs - purely visual (no
// damage/knockback), just marks the area for a few seconds.
function spawnSmokeCloud(center, radius, duration){
  const group = new THREE.Group();
  const puffCount = 26;
  // レーダーセンスで敵を赤く光らせても、煙自体が濃くて隠れてしまっては
  // 意味がない。デアデビル自身の視点では煙を薄く(透けて見える)描画し、
  // 他のキャラの視点では今まで通り濃い煙のままにする
  const isDaredevilViewer = !!(local && local.character && local.character.id === 'chainer');
  const baseOpacity = isDaredevilViewer ? 0.28 : 0.88;
  const mat = new THREE.MeshBasicMaterial({color:0xa9adb2, transparent:true, opacity:baseOpacity});
  const puffs = [];
  for(let i=0;i<puffCount;i++){
    const s = 1.4 + Math.random()*1.5;
    const geo = new THREE.SphereGeometry(s, 8, 6);
    const puff = new THREE.Mesh(geo, mat.clone());
    const a = Math.random()*Math.PI*2;
    const r = Math.random()*radius*0.65;
    puff.position.set(center.x + Math.cos(a)*r, center.y + 0.4 + Math.random()*2.2, center.z + Math.sin(a)*r);
    puff.userData.drift = new THREE.Vector3((Math.random()-0.5)*0.25, 0.12+Math.random()*0.12, (Math.random()-0.5)*0.25);
    group.add(puff);
    puffs.push(puff);
  }
  scene.add(group);
  let t = 0;
  function anim(dt){
    t += dt;
    const growIn = Math.min(1, t/0.5);
    const fadeOut = t > duration-0.8 ? Math.max(0, (duration-t)/0.8) : 1;
    puffs.forEach(p=>{
      p.position.addScaledVector(p.userData.drift, dt);
      p.scale.setScalar(growIn);
      p.material.opacity = baseOpacity * fadeOut;
    });
    if(t < duration){
      requestAnimationFrame(()=>anim(1/60));
    } else {
      scene.remove(group);
      puffs.forEach(p=>{ p.geometry.dispose(); p.material.dispose(); });
    }
  }
  anim(1/60);
}

// --- saved data (name / selected character / custom profile icon) ---
// persists in this browser only, via localStorage - nothing is sent to a
// server, so it won't follow you to a different device or browser.
const SAVE_KEY_NAME = 'pillarRumble_playerName';
const SAVE_KEY_CHAR = 'pillarRumble_charIndex';
const SAVE_KEY_ICON = 'pillarRumble_customIcon';

function loadSaved(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
function saveData(key, value){
  try{ localStorage.setItem(key, value); }catch(e){ /* storage unavailable/full - ignore */ }
}

const NET_SERVER_URL = 'wss://marvel-battle.onrender.com';

let customIconDataUrl = loadSaved(SAVE_KEY_ICON) || null;

let selectedCharacterIndex = 0;
{
  const savedCharIdx = parseInt(loadSaved(SAVE_KEY_CHAR), 10);
  if(!isNaN(savedCharIdx) && savedCharIdx >= 0 && savedCharIdx < CHARACTERS.length){
    selectedCharacterIndex = savedCharIdx;
  }
}

function weaponEmoji(weapon){
  if(weapon === 'gun') return ' 🔫';
  if(weapon === 'chain') return ' ⛓️';
  return ' 👊';
}

function escapeHtmlEarly(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let charPreviewIndex = selectedCharacterIndex;

function renderCharacterCards(){
  const wrap = document.getElementById('char-icon-row');
  if(!wrap) return;
  wrap.innerHTML = CHARACTERS.map((c,i)=>{
    const style = c.icon
      ? `background-image:url('${c.icon}');`
      : `background:#${c.color.toString(16).padStart(6,'0')};`;
    return `<div class="char-icon-box ${i===charPreviewIndex?'selected':''}" style="${style}" data-idx="${i}"></div>`;
  }).join('');
  wrap.querySelectorAll('.char-icon-box').forEach(el=>{
    el.addEventListener('click', ()=>{
      charPreviewIndex = parseInt(el.dataset.idx, 10);
      showCharDetailStep();
    });
  });
}

function showCharDetailStep(){
  const c = CHARACTERS[charPreviewIndex] || CHARACTERS[0];
  const iconEl = document.getElementById('detail-icon');
  if(c.icon){
    iconEl.style.backgroundImage = `url('${c.icon}')`;
  } else {
    iconEl.style.backgroundImage = '';
    iconEl.style.background = '#' + c.color.toString(16).padStart(6,'0');
  }
  document.getElementById('detail-name').textContent = c.name;
  document.getElementById('detail-desc').textContent = c.desc;

  document.getElementById('detail-attack-text').textContent =
    c.attackDesc || ('ダメージ ' + (c.attackDamage != null ? c.attackDamage : '-'));

  const skill1Text = c.skillName + (c.skillCooldownMax ? `(クールタイム${c.skillCooldownMax}秒)` : '(クールタイムなし)');
  document.getElementById('detail-skill1-text').textContent =
    skill1Text + (c.skillDesc ? ' - ' + c.skillDesc : '');

  const skill2Box = document.getElementById('detail-skill2-text').closest('.detail-box');
  if(c.skill2Name){
    skill2Box.style.display = '';
    const skill2Text = c.skill2Name + (c.skill2CooldownMax ? `(クールタイム${c.skill2CooldownMax}秒)` : '');
    document.getElementById('detail-skill2-text').textContent =
      skill2Text + (c.skill2Desc ? ' - ' + c.skill2Desc : '');
  } else {
    skill2Box.style.display = 'none';
  }

  const passiveBox = document.getElementById('detail-passive-text').closest('.detail-box');
  if(c.passiveName){
    passiveBox.style.display = '';
    document.getElementById('detail-passive-text').textContent =
      c.passiveName + (c.passiveDesc ? ' - ' + c.passiveDesc : '');
  } else {
    passiveBox.style.display = 'none';
  }

  showStartStep('chardetail');
}

document.getElementById('btn-back-from-detail').addEventListener('click', ()=>{
  renderCharacterCards();
  showStartStep('char');
});

document.getElementById('btn-equip-char').addEventListener('click', ()=>{
  selectedCharacterIndex = charPreviewIndex;
  saveData(SAVE_KEY_CHAR, String(selectedCharacterIndex));
  updateCharPreview();
  if(charSelectFromLobby){
    charSelectFromLobby = false;
    setPlayerCharacter(local, CHARACTERS[selectedCharacterIndex]);
    updateLobbyCharIcon();
    document.getElementById('start-overlay').style.display = 'none';
    document.getElementById('lobby-overlay').style.display = 'flex';
  } else {
    showStartStep(charSelectReturnTarget);
  }
});
renderCharacterCards();

/* ---------------- Start-screen step navigation (home -> character -> mode) ---------------- */
function showStartStep(name){
  document.getElementById('home-step').style.display = (name==='home') ? 'flex' : 'none';
  document.getElementById('home-topleft').style.display = (name==='home') ? 'flex' : 'none';
  document.getElementById('home-icon-col').style.display = (name==='home') ? 'flex' : 'none';
  document.getElementById('char-step').style.display = (name==='char') ? 'flex' : 'none';
  document.getElementById('char-detail-step').style.display = (name==='chardetail') ? 'flex' : 'none';
  document.getElementById('mode-step').style.display = (name==='mode') ? 'flex' : 'none';
  document.getElementById('btn-goto-play').style.display = (name==='home') ? 'block' : 'none';
}

function updateCharPreview(){
  const c = CHARACTERS[selectedCharacterIndex] || CHARACTERS[0];
  const hex = '#' + c.color.toString(16).padStart(6,'0');
  const dotEl = document.getElementById('char-preview-dot');
  const bodyEl = document.getElementById('char-preview-body');

  // the small dot next to the name is the player's own profile photo if
  // they've set one; otherwise it falls back to the selected character's icon
  if(customIconDataUrl){
    dotEl.style.backgroundImage = `url('${customIconDataUrl}')`;
    dotEl.style.backgroundSize = 'cover';
    dotEl.style.backgroundPosition = 'center';
  } else if(c.icon){
    dotEl.style.backgroundImage = `url('${c.icon}')`;
    dotEl.style.backgroundSize = 'cover';
    dotEl.style.backgroundPosition = 'center';
  } else {
    dotEl.style.backgroundImage = '';
    dotEl.style.background = hex;
  }

  if(c.icon){
    bodyEl.style.backgroundImage = `url('${c.icon}')`;
    bodyEl.style.backgroundSize = 'cover';
    bodyEl.style.backgroundPosition = 'center';
  } else {
    bodyEl.style.backgroundImage = '';
    bodyEl.style.background = hex;
  }
  document.getElementById('char-preview-name').textContent = c.name;
}
updateCharPreview();

// restore saved name
{
  const savedName = loadSaved(SAVE_KEY_NAME);
  if(savedName) document.getElementById('name-input').value = savedName;
}
document.getElementById('name-input').addEventListener('input', e=>{
  saveData(SAVE_KEY_NAME, e.target.value);
  notifyPresenceUpdate();
});

// custom profile icon upload
document.getElementById('btn-upload-icon').addEventListener('click', ()=>{
  document.getElementById('custom-icon-input').click();
});
document.getElementById('custom-icon-input').addEventListener('change', e=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      // downscale to keep localStorage small and loading fast
      const size = 160;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size/img.width, size/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      customIconDataUrl = dataUrl;
      saveData(SAVE_KEY_ICON, dataUrl);
      updateCharPreview();
      notifyPresenceUpdate();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

// ---- global presence: shows small icons of other people who currently
// have the app open (anywhere), below the fullscreen button on the home
// screen. Independent of match rooms - connects as soon as the page loads.
let presenceWs = null;
let presenceMap = new Map(); // id -> {name, icon}
function renderPresenceRow(){
  const row = document.getElementById('online-players-row');
  if(!row) return;
  row.innerHTML = '';
  for(const [id, p] of presenceMap){
    const dot = document.createElement('div');
    dot.className = 'online-player-icon';
    dot.title = p.name || 'Player';
    if(p.icon){
      dot.style.backgroundImage = `url('${p.icon}')`;
    }
    row.appendChild(dot);
  }
}
function notifyPresenceUpdate(){
  if(!presenceWs || presenceWs.readyState !== WebSocket.OPEN) return;
  const nameVal = document.getElementById('name-input').value.trim() || 'YOU';
  try{
    presenceWs.send(JSON.stringify({ t:'presence_update', name: nameVal, icon: customIconDataUrl || '' }));
  }catch(e){ /* ignore */ }
}
function connectPresence(){
  try{
    presenceWs = new WebSocket(NET_SERVER_URL);
  }catch(e){ return; }
  presenceWs.addEventListener('open', ()=>{
    const nameVal = document.getElementById('name-input').value.trim() || 'YOU';
    presenceWs.send(JSON.stringify({ t:'presence_hello', name: nameVal, icon: customIconDataUrl || '' }));
  });
  presenceWs.addEventListener('message', (ev)=>{
    let msg;
    try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    if(msg.t === 'presence_list'){
      presenceMap = new Map();
      (msg.players||[]).forEach(p=> presenceMap.set(p.id, {name:p.name, icon:p.icon}));
      renderPresenceRow();
    } else if(msg.t === 'presence_joined'){
      presenceMap.set(msg.id, {name:msg.name, icon:msg.icon});
      renderPresenceRow();
    } else if(msg.t === 'presence_updated'){
      presenceMap.set(msg.id, {name:msg.name, icon:msg.icon});
      renderPresenceRow();
    } else if(msg.t === 'presence_left'){
      presenceMap.delete(msg.id);
      renderPresenceRow();
    } else if(msg.t === 'presence_chat'){
      appendChatLine(msg.name, msg.text, msg.icon);
    } else if(msg.t === 'presence_chat_history'){
      (msg.messages||[]).forEach(m=> appendChatLine(m.name, m.text, m.icon));
    }
  });
  presenceWs.addEventListener('close', ()=>{
    presenceMap = new Map();
    renderPresenceRow();
    // try to reconnect after a short delay, in case the server restarted
    // or the connection dropped (e.g. tab was backgrounded)
    setTimeout(connectPresence, 5000);
  });
  presenceWs.addEventListener('error', ()=>{ try{ presenceWs.close(); }catch(e){} });
}
connectPresence();

  if(presenceWs && presenceWs.readyState === WebSocket.OPEN){
    try{ presenceWs.send(JSON.stringify({ t:'presence_ping' })); }catch(e){ /* ignore */ }
  }
}, 8000);

  }
});

function appendChatLine(name, text, icon){
  if(!chatLogEl) return;

// 平らな板をそのまま丸い頭に貼るとシールみたいになるので、頭の球面に沿って
// 少し膨らませた("湾曲した")板ジオメトリを作る
function makeCurvedFacePlateGeo(width, height, headRadius, margin, segments){
  const geo = new THREE.PlaneGeometry(width, height, segments, segments);
  const pos = geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), y = pos.getY(i);
    const d2 = x*x + y*y;
    // sit exactly on the head's own surface at this x/y, then push out a
    // fixed margin further so it's always clearly in front, never buried
    const headZ = Math.sqrt(Math.max(0, headRadius*headRadius - d2));
    pos.setZ(i, headZ + margin);
  }
  geo.computeVertexNormals();
  return geo;
}

function buildCharacterMesh(color){
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({color, roughness:0.6});
  const accentMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.5});

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.85,0.95,0.5), bodyMat);
  torso.position.y = 1.0;
  torso.castShadow = true;
  g.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.42,16,16), accentMat);
  head.position.y = 1.75;
  head.castShadow = true;
  g.add(head);

  const eyeGeo = new THREE.SphereGeometry(0.06,8,8);
  const eyeMat = new THREE.MeshStandardMaterial({color:0x1F2740});
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(0.16,1.8,0.38); g.add(eyeL);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(-0.16,1.8,0.38); g.add(eyeR);
  g.userData.eyeL = eyeL;
  g.userData.eyeR = eyeR;

  const armGeo = new THREE.BoxGeometry(0.26,0.75,0.26);
  const armL = new THREE.Mesh(armGeo, bodyMat); armL.position.set(0.58,1.0,0); armL.castShadow=true; g.add(armL);
  const armR = new THREE.Mesh(armGeo, bodyMat); armR.position.set(-0.58,1.0,0); armR.castShadow=true; g.add(armR);

  const legGeo = new THREE.BoxGeometry(0.32,0.65,0.32);
  const legMat = new THREE.MeshStandardMaterial({color:0x2b2f45, roughness:0.7});
  const legL = new THREE.Mesh(legGeo, legMat); legL.position.set(0.22,0.325,0); legL.castShadow=true; g.add(legL);
  const legR = new THREE.Mesh(legGeo, legMat); legR.position.set(-0.22,0.325,0); legR.castShadow=true; g.add(legR);

  g.userData.armL = armL; g.userData.armR = armR;
  g.userData.legL = legL; g.userData.legR = legR;
  g.userData.bodyMat = bodyMat;
  g.userData.headMat = accentMat;
  g.userData.legMat = legMat;
  return g;
}

function setPlayerColor(p, colorHex){
  p.color = colorHex;
  if(!p.mesh.userData.bodyMat) return;
  if(p.character && p.character.id === 'gunner'){
    // Punisher always wears black, regardless of the assigned player color
    p.mesh.userData.bodyMat.color.setHex(0x14161c);
  } else if(p.character && p.character.id === 'chainer'){
    // Daredevil always wears his red suit, regardless of the assigned player color
    p.mesh.userData.bodyMat.color.setHex(0xB01029);
  } else if(p.character && p.character.id === 'crusher'){
    // Crusher always wears his dark green kung-fu suit, regardless of the assigned player color
    p.mesh.userData.bodyMat.color.setHex(0x1F4A2E);
  } else if(p.character && p.character.id === 'captain'){
    // Captain always wears his navy blue suit, regardless of the assigned player color
    p.mesh.userData.bodyMat.color.setHex(0x1B2A5E);
  } else if(p.character && p.character.id === 'ironman'){
    // Iron Man always wears his red/gold armor, regardless of the assigned player color
    p.mesh.userData.bodyMat.color.setHex(0x9E1B1B);
  } else if(p.character && p.character.id === 'gambit'){
    // Gambit always wears his rust-brown trench coat, regardless of the assigned player color
    p.mesh.userData.bodyMat.color.setHex(0x6B3F2A);
  } else if(p.character && p.character.id === 'mantis'){
    // Mantis always has her green empath skin tone, regardless of the assigned player color
    p.mesh.userData.bodyMat.color.setHex(0x3F8F5C);
  } else {
    p.mesh.userData.bodyMat.color.setHex(colorHex);
  }
}

function attachWeaponVisual(p){
  const armR = p.mesh.userData.armR;
  const armL = p.mesh.userData.armL;
  if(p.mesh.userData.gunMesh){
    armR.remove(p.mesh.userData.gunMesh);
    p.mesh.userData.gunMesh = null;
  }
  if(p.mesh.userData.heldRod){
    armL.remove(p.mesh.userData.heldRod);
    p.mesh.userData.heldRod = null;
  }
  if(p.mesh.userData.chainRod1){
    armL.remove(p.mesh.userData.chainRod1);
    p.mesh.userData.chainRod1 = null;
  }
  if(p.mesh.userData.chainRod2){
    armR.remove(p.mesh.userData.chainRod2);
    p.mesh.userData.chainRod2 = null;
  }
  if(p.mesh.userData.chainCable){
    p.mesh.remove(p.mesh.userData.chainCable);
    p.mesh.userData.chainCable = null;
  }
  if(p.mesh.userData.shieldMesh2){
    armR.remove(p.mesh.userData.shieldMesh2);
    p.mesh.userData.shieldMesh2 = null;
  }
  if(p.mesh.userData.repulsorL){
    armL.remove(p.mesh.userData.repulsorL);
    armR.remove(p.mesh.userData.repulsorR);
    p.mesh.userData.repulsorL = null;
    p.mesh.userData.repulsorR = null;
  }
  if(p.character && p.character.weapon === 'gun'){
    const gunGroup = new THREE.Group();
    const bodyGeo = new THREE.BoxGeometry(0.15, 0.15, 0.62);
    const bodyMat = new THREE.MeshStandardMaterial({color:0x2b2f45, roughness:0.35, metalness:0.4});
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.set(0, -0.08, 0.48);
    body.castShadow = true;
    gunGroup.add(body);
    const gripGeo = new THREE.BoxGeometry(0.13, 0.24, 0.13);
    const grip = new THREE.Mesh(gripGeo, bodyMat);
    grip.position.set(0, -0.2, 0.2);
    gunGroup.add(grip);
    armR.add(gunGroup);
    p.mesh.userData.gunMesh = gunGroup;
  } else if(p.character && p.character.weapon === 'chain'){
    // Each hand grips the *plain* end of its own rod (not the chained end),
    // so the chained tips hang out in front of the body with a cable strung
    // between them (see updateChainWeaponVisual). The attack pivots the
    // right-hand rod ~180 degrees around that hand, so it whips the cable
    // and the (now released-looking) left rod around with it.
    const rodMat = new THREE.MeshStandardMaterial({color:0x9C1D2E, roughness:0.5, metalness:0.15});
    const capMat = new THREE.MeshStandardMaterial({color:0xC7CBD1, roughness:0.3, metalness:0.85});
    const cableMat = new THREE.MeshStandardMaterial({color:0x8a8f98, roughness:0.4, metalness:0.6});

    const ROD_LEN = 0.5, ROD_R = 0.045;
    const CAP_LEN = 0.07, CAP_R = 0.052;
    const GRIP_Y = -0.42; // roughly where the fist holds the rod

    function makeRodGroup(){
      const group = new THREE.Group();
      const rod = new THREE.Mesh(new THREE.CylinderGeometry(ROD_R, ROD_R, ROD_LEN, 10), rodMat);
      rod.position.set(0, -ROD_LEN/2, 0); // extends away from the grip (y=0)
      rod.castShadow = true;
      group.add(rod);
      // cap + chain-anchor sit at the FAR tip (away from the hand) - you grip
      // the plain end, not the chained end, so the chain hangs out in front
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(CAP_R, CAP_R, CAP_LEN, 10), capMat);
      cap.position.set(0, -ROD_LEN - CAP_LEN/2 + 0.01, 0);
      group.add(cap);
      const anchor = new THREE.Object3D();
      anchor.position.set(0, -ROD_LEN - CAP_LEN + 0.01, 0);
      group.add(anchor);
      group.userData.anchor = anchor;
      return group;
    }

    const rod1Group = makeRodGroup(); // left hand - stays put
    rod1Group.position.set(0, GRIP_Y, 0.05);
    armL.add(rod1Group);

    const rod2Group = makeRodGroup(); // right hand - pivots through the swing
    rod2Group.position.set(0, GRIP_Y, 0.05);
    armR.add(rod2Group);

    const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 1, 6), cableMat);
    p.mesh.add(cable);

    p.mesh.userData.chainRod1 = rod1Group;
    p.mesh.userData.chainRod2 = rod2Group;
    p.mesh.userData.chainCable = cable;
  } else if(p.character && p.character.weapon === 'shieldthrow'){
    const shieldGroup = new THREE.Group();
    const rimMat = new THREE.MeshStandardMaterial({color:0xC7CBD1, roughness:0.35, metalness:0.6});
    const frontMat = new THREE.MeshBasicMaterial({map:SHIELD_TEXTURE, transparent:true});
    const backMat = new THREE.MeshStandardMaterial({color:0x8a8f98, roughness:0.5, metalness:0.4});
    const shieldMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.48, 0.12, 32), [rimMat, frontMat, backMat]);
    shieldMesh.rotation.z = Math.PI/2; // reorient the cylinder's axis so its flat faces point sideways
    shieldGroup.add(shieldMesh);
    // outer side of the right arm, facing outward (to the right) so it
    // reads clearly from that side instead of sitting flat against the body
    shieldGroup.position.set(-0.22, -0.05, 0);
    armR.add(shieldGroup);
    p.mesh.userData.shieldMesh2 = shieldGroup;
  } else if(p.character && p.character.weapon === 'beam'){
    const repulsorMatL = new THREE.MeshBasicMaterial({color:0x8FE8FF, transparent:true, opacity:0.9});
    const repulsorL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), repulsorMatL);
    repulsorL.position.set(0, -0.4, 0.05);
    armL.add(repulsorL);
    p.mesh.userData.repulsorL = repulsorL;
    const repulsorMatR = new THREE.MeshBasicMaterial({color:0x8FE8FF, transparent:true, opacity:0.9});
    const repulsorR = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), repulsorMatR);
    repulsorR.position.set(0, -0.4, 0.05);
    armR.add(repulsorR);
    p.mesh.userData.repulsorR = repulsorR;
  }
}

// Called every frame for chain-weapon characters (local, bots, and remote
// players alike) to keep the cable stretched between the two rods, and to
// throw the right-hand rod forward on it during an attack swing.
// Grappling-hook style pull: raycasts against the platforms (a simple march
// along the aim ray, checking each platform's footprint/height) to find
// where a missed throw would land on the stage.
function raycastPlatformsForGrapple(origin, dir, maxRange){
  const steps = 90;
  const stepLen = maxRange/steps;
  const pos = origin.clone();
  for(let i=0;i<steps;i++){
    pos.addScaledVector(dir, stepLen);
    for(const pl of platforms){
      const dx = pos.x-pl.x, dz = pos.z-pl.z;
      if(Math.hypot(dx,dz) < pl.radius && Math.abs(pos.y-pl.topY) < 1.2){
        return new THREE.Vector3(pos.x, pl.topY + 0.05, pos.z);
      }
    }
    if(pos.y < VOID_Y+2) break;
  }
  return null;
}

const GRAPPLE_PULL_SPEED = 30; // units/sec - how fast the pull travel is

function startGrapplePull(p, destination){
  const dist = Math.hypot(destination.x-p.pos.x, destination.z-p.pos.z) || 0.001;
  p.isGrappled = true;
  p.grappleFrom = new THREE.Vector3(p.pos.x, p.pos.y, p.pos.z);
  p.grappleTo = destination.clone();
  p.grappleDuration = THREE.MathUtils.clamp(dist / GRAPPLE_PULL_SPEED, 0.18, 1.3);
  p.grappleTimer = p.grappleDuration;
  p.vel.set(0,0,0);
  p.wantAttack = false; p.wantSkill = false; p.wantJump = false;
}

function updateChainWeaponVisual(p){
  const rod2 = p.mesh.userData.chainRod2;
  if(!rod2) return; // not a chain-weapon character
  const rod1 = p.mesh.userData.chainRod1;
  const cable = p.mesh.userData.chainCable;
  const armL = p.mesh.userData.armL;

  const REST_TILT = -1.2;
  rod2.rotation.x = REST_TILT; // right rod: held firmly, this is the fixed axis

  if(p.attacking > 0){
    const t = 1 - p.attacking/0.28;
    // left rod has been let go - it's now just dangling off the chain, and
    // swings on an arc around the right rod's tip (the fixed pivot), out
    // toward whatever's in front, then back.
    const pivotWorld = new THREE.Vector3();
    rod2.userData.anchor.getWorldPosition(pivotWorld);
    const orbitRadius = 1.15;
    const angle = p.yaw + Math.PI/2 * (1 - 2*t); // sweeps from the side, through the front, to the other side
    const desiredWorld = new THREE.Vector3(
      pivotWorld.x + Math.sin(angle)*orbitRadius,
      pivotWorld.y - 0.1,
      pivotWorld.z + Math.cos(angle)*orbitRadius
    );
    rod1.position.copy(armL.worldToLocal(desiredWorld));

    // orient it lying flat (parallel to the ground), pointing along the
    // direction of travel around the arc, instead of hanging straight down
    const tangentDir = new THREE.Vector3(Math.cos(angle), 0, -Math.sin(angle));
    const worldQuat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), tangentDir);
    const armLWorldQuat = new THREE.Quaternion();
    armL.getWorldQuaternion(armLWorldQuat);
    rod1.quaternion.copy(armLWorldQuat.clone().invert().multiply(worldQuat));
  } else {
    rod1.rotation.x = REST_TILT;
    rod1.position.set(0, -0.42, 0.05); // back in hand, at rest
  }

  const wp1 = new THREE.Vector3(); rod1.userData.anchor.getWorldPosition(wp1);
  const wp2 = new THREE.Vector3(); rod2.userData.anchor.getWorldPosition(wp2);
  const lp1 = p.mesh.worldToLocal(wp1.clone());
  const lp2 = p.mesh.worldToLocal(wp2.clone());
  const diff = lp2.clone().sub(lp1);
  const len = Math.max(0.05, diff.length());
  cable.position.copy(lp1).add(lp2).multiplyScalar(0.5);
  cable.scale.y = len;
  const dirN = diff.clone().normalize();
  cable.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dirN);
}

function setPlayerCharacter(p, character){
  p.character = character;
  p.maxHp = character.maxHp || 300;
  p.hp = p.maxHp;
  p.shieldActive = false;
  p.shieldDurability = character.shieldMaxDurability || 150;
  p.shieldBrokenUntil = 0;
  p.assaultActive = false;
  p.assaultTimer = 0;
  p.pendingDragonfall = false;
  p.dragonfallApexDone = false;
  p.dragonfallLandPoseTimer = 0;
  if(p.stickyCards){ for(const c of p.stickyCards){ if(c.mesh && c.mesh.parent) c.mesh.parent.remove(c.mesh); } }
  p.stickyCards = [];
  p.stickyCardGeneration = (p.stickyCardGeneration||0) + 1;
  p.stickyAmmo = 3;
  p.stickyAmmoRegenTimer = 0;
  p.kineticChargeCounts = new Map();
  p.slowMult = 1;
  p.slowUntil = 0;
  p.chargingUnibeam = false;
  p.unibeamFrozenPos = null;
  p.hoverActive = false;
  p.hoverPhase = null;
  p.hoverTimer = 0;
  p.mesh.scale.setScalar(character.scale || 1);
  attachWeaponVisual(p);
  applyCharacterLook(p);
  setPlayerColor(p, p.color); // re-apply now that character-specific overrides may exist
  if(p.isLocal) updateHpUI();
}

  return {
    name, color, isBot, isLocal,
    isRemote:false, netId:null, net:null, joinedAt:0,

function colorForId(id){
  let h = 0;
  for(let i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i)) >>> 0; }
  return NET_COLOR_PALETTE[h % NET_COLOR_PALETTE.length];
}

// 静止したマネキンを置き、攻撃を当てるとダメージが入るようにする
function createDummy(plat){
  const d = makePlayer('マネキン', 0x9E1B1B, false, false);
  d.isDummy = true;
  const ironmanChar = CHARACTERS.find(c=>c.id === 'ironman');
  if(ironmanChar) setPlayerCharacter(d, ironmanChar);
  d.maxHp = 9999;
  d.hp = 9999;
  d.pos.set(plat.x, plat.topY, plat.z);
  d.mesh.position.copy(d.pos);
  d.yaw = Math.atan2(-plat.x, -plat.z); // roughly face the center of the stage
  d.mesh.rotation.y = d.yaw;
  d.alive = true;
  d.onGround = true;
  d.team = null;

  const barBgMat = new THREE.MeshBasicMaterial({color:0x330000, transparent:true, opacity:0.85, depthTest:false});
  const barBg = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.16), barBgMat);
  const barFgMat = new THREE.MeshBasicMaterial({color:0x3ddc5a, transparent:true, opacity:0.95, depthTest:false});
  const barFg = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.1), barFgMat);
  barFg.position.z = 0.001;
  const barGroup = new THREE.Group();
  barGroup.add(barBg); barGroup.add(barFg);
  barGroup.position.set(0, 2.5, 0);
  barGroup.renderOrder = 999;
  d.mesh.add(barGroup);
  d.mesh.userData.dummyHpBarFg = barFg;
  d.mesh.userData.dummyHpBarGroup = barGroup;

  players.push(d);
  return d;
}

function updateDummyHpBar(d){
  const frac = Math.max(0, Math.min(1, d.hp/d.maxHp));
  const bar = d.mesh.userData.dummyHpBarFg;
  if(bar){
    bar.scale.x = Math.max(0.001, frac);
    bar.position.x = -0.5*(1-frac);
    bar.material.color.setHex(frac > 0.5 ? 0x3ddc5a : (frac > 0.2 ? 0xFFD23F : 0xE53939));
  }
  const barGroup = d.mesh.userData.dummyHpBarGroup;
  if(barGroup){
    // keep the bar facing the camera regardless of the dummy's own facing
    barGroup.rotation.y = (camYaw + Math.PI) - d.mesh.rotation.y;
  }
}

// ボット対戦: 毎ラウンド開始時にボットのキャラをランダムに入れ替える。
// キャラ数がボットの人数以上ある限り、同じラウンド内でキャラが重複しない
// ようにシャッフルした配列から順番に割り当てる。
function randomizeBotCharacters(){
  const bots = players.filter(p=>p.isBot);
  if(bots.length === 0) return;
  const shuffled = CHARACTERS.slice();
  for(let i=shuffled.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  bots.forEach((bot,i)=>{
    setPlayerCharacter(bot, shuffled[i % shuffled.length]);
  });
}

// applies damage to a LOCAL/bot target directly (remote targets are handled
// by their own client after receiving the network message that carries dmg)
function nowSec(){ return performance.now()/1000; }

// Punisher's "復讐" (Revenge) passive: +20 damage against any enemy that has
// hit the Punisher within the last 10 seconds.
// チーム戦では味方同士は攻撃が当たらない
// パニックウェーブに当たった後、一定時間内にクールタイムに入った技は
// 自動的に延長される。実際にクールタイムをセットする箇所でこれを通す。
function withCooldownExtension(p, cooldown){
  if(p.cooldownExtendUntil && nowSec() < p.cooldownExtendUntil){
    return cooldown + (p.cooldownExtendAmount || 0);
  }
  return cooldown;
}

function isFriendlyFire(attacker, target){
  return matchMode === 'team' && attacker.team && target.team && attacker.team === target.team;
}

// ガンビットのパッシブ「キネティックチャージ」: このキャラの技(スキル)の
// ダメージを合計5回受けた相手は、自分のいる場所で爆発してダメージ50を
// 追加で受ける。回数はラウンドが変わるとリセットされる(round-startのリ
// セット処理でkineticChargeCountsをクリアしている)。
function trackKineticCharge(attacker, target){
  if(!attacker || !attacker.character || attacker.character.id !== 'gambit') return;
  if(!target || !target.alive) return;
  if(!attacker.kineticChargeCounts) attacker.kineticChargeCounts = new Map();
  const threshold = attacker.character.passiveHitThreshold || 5;
  const count = (attacker.kineticChargeCounts.get(target) || 0) + 1;
  if(count >= threshold){
    attacker.kineticChargeCounts.set(target, 0);
    const explosionDamage = attacker.character.passiveExplosionDamage || 50;
    const pos = new THREE.Vector3(target.pos.x, target.pos.y+1.0, target.pos.z);
    spawnGrenadeBurst(pos, 1.8, 0xCF6FFF);
    applyHit(attacker, target, new THREE.Vector3(0,0,1), 6, 4, explosionDamage);
  } else {
    attacker.kineticChargeCounts.set(target, count);
  }
}

function computeDamageWithPassives(attacker, target, baseDmg){
  if(!baseDmg) return baseDmg;
  let dmg = baseDmg;
  // エンパシー: マンティスは相手に与えたダメージの一部を、共感によって
  // 自分のHPとして取り込む(与えたダメージの50%を自身が回復)
  if(attacker && attacker.character && attacker.character.id === 'mantis' && target && target !== attacker){
    const healAmount = Math.round(dmg * (attacker.character.passiveLifestealMult || 0.5));
    if(healAmount > 0){
      attacker.hp = Math.min(attacker.maxHp || attacker.hp, attacker.hp + healAmount);
      if(attacker.isLocal) updateHpUI();
    }
  }
  if(attacker && attacker.character && attacker.character.id === 'gunner'){
    const recent = attacker.recentDamageFrom;
    if(recent && recent.some(e => e.attacker === target && (nowSec() - e.time) <= 10)){
      dmg += 20;
    }
  }
  // 不屈の意志: taking a hit within the last 5 seconds reduces further
  // incoming damage by 20% (checked against the *previous* hit's timestamp,
  // not the one currently being computed)
  if(target && target.character && target.character.id === 'captain'){
    if(target.lastDamagedTime && (nowSec() - target.lastDamagedTime) <= 5){
      dmg = Math.round(dmg * 0.8);
    }
  }
  // シールドアサルト中は受けるダメージを軽減
  if(target && target.assaultActive && target.character && target.character.assaultDamageReduction){
    dmg = Math.round(dmg * (1 - target.character.assaultDamageReduction));
  }
  // 龍盾 (Dragon Shield) block absorption is handled separately in
  // applyDamageLocal, since it needs to know the attacker's direction.
  return dmg;
}

function applyDamageLocal(target, dmg, attacker){
  if(!target.alive || !dmg) return;

  // 龍盾 (Dragon Shield): if the shield is up, still has durability, and the
  // hit came from roughly the direction the shield is facing, it eats the
  // whole hit instead of the player's own HP.
  if(target.shieldActive && target.character && target.character.skillType === 'shield'
     && target.shieldDurability > 0 && attacker && attacker.pos){
    const toAttacker = new THREE.Vector3(attacker.pos.x-target.pos.x, 0, attacker.pos.z-target.pos.z);
    if(toAttacker.lengthSq() > 0.0001){
      toAttacker.normalize();
      const facing = new THREE.Vector3(Math.sin(target.yaw), 0, Math.cos(target.yaw));
      if(facing.dot(toAttacker) > 0.3){ // roughly within the shield's frontal arc
        target.shieldDurability = Math.max(0, target.shieldDurability - dmg);
        if(target.shieldDurability <= 0){
          target.shieldActive = false;
          target.shieldBrokenUntil = nowSec() + (target.character.shieldBrokenLockout || 5);
        }
        if(target.isLocal) updateSkillCooldownUI();
        spawnHitSpark(new THREE.Vector3(target.pos.x, target.pos.y+1.2, target.pos.z), 0xFFD93D);
        return; // fully absorbed - the player takes no HP damage from this hit
      }
    }
  }

  target.hp = Math.max(0, (target.hp != null ? target.hp : (target.maxHp||300)) - dmg);
  target.lastDamagedTime = nowSec();
  if(attacker){
    const now = nowSec();
    if(!target.recentDamageFrom) target.recentDamageFrom = [];
    target.recentDamageFrom = target.recentDamageFrom.filter(e => now - e.time <= 10);
    target.recentDamageFrom.push({attacker, time: now});
  }
  if(target.isLocal) updateHpUI();
  if(target.isDummy){
    if(target.hp <= 0){
      target.hp = target.maxHp; // instantly reset so it stays a repeatable target
    }
    return;
  }
  if(target.hp <= 0){
    eliminateByDamage(target);
  }
}

// HP hit zero - knocked out on the spot, same overall flow as falling off
function eliminateByDamage(p){
  if(!p.alive) return;
  p.alive = false;
  p.mesh.visible = false;
  spawnFallBurst(new THREE.Vector3(p.pos.x, p.pos.y+1, p.pos.z), p);
  if(p.isLocal){
    youFellEl.classList.add('show');
    if(isChargingGrenade){ isChargingGrenade = false; clearGrenadePreview(); }
    if(isChargingSmoke){ isChargingSmoke = false; clearSmokePreview(); }
    if(isPracticeMode){ setTimeout(respawnPracticePlayer, 1000); }
    else{ startSpectating(); }
  }
  refreshAliveChips();
  checkRoundOutcome();
}

function placePlayersAtStart(){
  const resettable = players.filter(p=>!p.isRemote && !p.isDummy);

  // 練習場ではマネキンを他の柱に固定で置いているので、自分は必ず0番の柱に
  // スポーンさせる(ランダムだとマネキンと同じ柱にかぶる可能性があるため)
  if(isPracticeMode){
    const plat = MEDIUM_PLATFORMS[0];
    resettable.forEach(p=>{
      p.pos.set(plat.x, plat.topY, plat.z);
      p.vel.set(0,0,0);
      p.yaw = Math.random()*Math.PI*2;
      p.alive = true;
      p.onGround = true;
      p.hitstun = 0;
      p.attackCooldown = 0;
      p.skillCooldown = 0;
      p.skill2Cooldown = 0;
      p.hp = p.maxHp || (p.character && p.character.maxHp) || 300;
      p.shieldActive = false;
      p.shieldDurability = (p.character && p.character.shieldMaxDurability) || 150;
      p.shieldBrokenUntil = 0;
      p.assaultActive = false;
      p.assaultTimer = 0;
      p.pendingDragonfall = false;
      p.dragonfallApexDone = false;
      p.dragonfallLandPoseTimer = 0;
      if(p.stickyCards){ for(const c of p.stickyCards){ if(c.mesh && c.mesh.parent) c.mesh.parent.remove(c.mesh); } }
      p.stickyCards = [];
      p.stickyCardGeneration = (p.stickyCardGeneration||0) + 1;
      p.stickyAmmo = 3;
      p.stickyAmmoRegenTimer = 0;
      p.kineticChargeCounts = new Map();
      p.slowMult = 1;
      p.slowUntil = 0;
      p.chargingUnibeam = false;
      p.unibeamFrozenPos = null;
      p.hoverActive = false;
      p.hoverPhase = null;
      p.hoverTimer = 0;
      p.chargingPunch = false;
      p.attackWasCharged = false;
      p.attackWasFullyCharged = false;
      p.mesh.visible = true;
      p.mesh.scale.setScalar(1);
      p.aiTarget = null;
    });
    updateHpUI();
    return;
  }

  // scatter everyone across the medium pillars (shuffled each round) instead
  // of piling everyone onto the center pillar
  const order = MEDIUM_PLATFORMS.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }

  resettable.forEach((p,i)=>{
    const plat = MEDIUM_PLATFORMS[order[i % order.length]];
    const wrap = Math.floor(i / order.length);
    const offsetAng = wrap * 1.4;
    const offsetR = wrap > 0 ? 2.2 : 0;
    p.pos.set(plat.x + Math.cos(offsetAng)*offsetR, plat.topY, plat.z + Math.sin(offsetAng)*offsetR);
    p.vel.set(0,0,0);
    p.yaw = Math.random()*Math.PI*2;
    p.alive = true;
    p.onGround = true;
    p.hitstun = 0;
    p.attackCooldown = 0;
    p.skillCooldown = 0;
    p.skill2Cooldown = 0;
    p.hp = p.maxHp || (p.character && p.character.maxHp) || 300;
    p.shieldActive = false;
    p.shieldDurability = (p.character && p.character.shieldMaxDurability) || 150;
    p.shieldBrokenUntil = 0;
    p.assaultActive = false;
    p.assaultTimer = 0;
    p.pendingDragonfall = false;
    p.dragonfallApexDone = false;
    p.dragonfallLandPoseTimer = 0;
    if(p.stickyCards){ for(const c of p.stickyCards){ if(c.mesh && c.mesh.parent) c.mesh.parent.remove(c.mesh); } }
    p.stickyCards = [];
    p.stickyCardGeneration = (p.stickyCardGeneration||0) + 1;
    p.stickyAmmo = 3;
    p.stickyAmmoRegenTimer = 0;
    p.kineticChargeCounts = new Map();
    p.slowMult = 1;
    p.slowUntil = 0;
    p.chargingUnibeam = false;
    p.unibeamFrozenPos = null;
    p.hoverActive = false;
    p.hoverPhase = null;
    p.hoverTimer = 0;
    p.chargingPunch = false;
    p.attackWasCharged = false;
    p.attackWasFullyCharged = false;
    p.mesh.visible = true;
    p.mesh.scale.setScalar(1);
    p.aiTarget = null;
  });
  updateHpUI();
}

function startRound(){
  roundNumber++;
  roundLabel.textContent = 'ROUND ' + roundNumber;
  randomizeBotCharacters();
  placePlayersAtStart();
  roundActive = true;
  banner.classList.remove('show');
  youFellEl.classList.remove('show');
  refreshAliveChips();
  stopSpectating();

  // face the camera toward the middle of the stage from wherever we spawned
  camYaw = Math.atan2(local.pos.x, local.pos.z);
  camPitch = 0.46;

  // "3, 2, 1, START!" - everyone can move during this, but attacks/skills
  // are locked out until it finishes
  attacksLocked = true;
  roundStartTimer = 3.6;
}

function endRoundWithWinner(winner, winningTeam){
  roundActive = false;
  const showScore = NET.enabled; // only online matches track a first-to-3 series

  if(matchMode === 'team' && winningTeam){
    teamWins[winningTeam] = (teamWins[winningTeam]||0) + 1;
    bannerTitle.textContent = 'チーム' + winningTeam + ' WINS!';
    bannerSub.textContent = 'チーム' + winningTeam + ' の勝利!' + (showScore ? '(' + teamWins[winningTeam] + '/3)' : '');
    banner.style.setProperty('--winner-color', winningTeam===1 ? '#4D96FF' : '#FF6B6B');
  } else if(winner){
    winner.roundWins = (winner.roundWins||0) + 1;
    bannerTitle.textContent = 'WINNER!';
    bannerSub.textContent = winner.name + ' の勝利!' + (showScore ? '(' + winner.roundWins + '/3)' : '');
    banner.style.setProperty('--winner-color', '#'+winner.color.toString(16).padStart(6,'0'));
  } else {
    bannerTitle.textContent = 'DRAW!';
    bannerSub.textContent = '全員脱落…';
    banner.style.setProperty('--winner-color', '#ffffff');
  }
  banner.classList.add('show');
  refreshAliveChips();

  // only an actual online match (with a lobby to return to) ends at 3 wins -
  // bots/practice play just keeps going round after round like before
  matchOver = NET.enabled && (matchMode === 'team'
    ? (teamWins[1] >= 3 || teamWins[2] >= 3)
    : !!(winner && winner.roundWins >= 3));

  roundEndTimer = 3.2;
  let cd = 3;
  countdownEl.textContent = matchOver ? 'ロビーに戻ります…' : ('次のラウンドまで ' + cd);
  countdownEl.classList.add('show');
  const iv = setInterval(()=>{
    cd--;
    if(cd<=0){ clearInterval(iv); countdownEl.classList.remove('show'); return; }
    if(!matchOver) countdownEl.textContent = '次のラウンドまで ' + cd;
  }, 1000);
}

function checkRoundOutcome(){
  if(!roundActive) return;
  if(players.length <= 1) return; // オンラインで自分しかいない間は判定しない
  const alive = players.filter(p=>p.alive);

  if(matchMode === 'team'){
    const aliveTeams = new Set(alive.map(p=>p.team).filter(t=>t===1||t===2));
    if(aliveTeams.size <= 1){
      const winningTeam = aliveTeams.size === 1 ? [...aliveTeams][0] : null;
      const winner = winningTeam ? alive.find(p=>p.team===winningTeam) : null;
      endRoundWithWinner(winner, winningTeam);
    }
  } else {
    if(alive.length <= 1){
      endRoundWithWinner(alive[0] || null);
    }
  }
}

/* ---------------- Networking (online mode via dedicated WebSocket relay server) ----------------
   Connects to the Pillar Rumble relay server (Node.js + ws), which keeps players
   grouped by room code and relays position/attack/host-start messages between them
   in real time (no polling - the server pushes events as they happen). */

const NET = {
  enabled:false,
  ws:null,
  room:'LOBBY',
  localId:null,
  hostId:null,
  remotes: new Map(),
  joined:false,
  pushInterval:null,
};

function sanitizeRoomCode(s){
  return (s||'').toString().trim().replace(/[\s\/\\'"]+/g,'').toUpperCase().slice(0,16) || 'LOBBY';
}

function getOrCreateRemote(id, data){
  let p = NET.remotes.get(id);
  if(!p){
    const color = (typeof data.color === 'number') ? data.color : 0xAAAAAA;
    p = makePlayer(data.name || '?', color, false, false);
    p.isRemote = true;
    p.netId = id;
    p.net = {x:data.x||0, y:data.y||0, z:data.z||0, yaw:data.yaw||0, lastSeen:Date.now()};
    p.pos.set(data.x||0, data.y||0, data.z||0);
    p.yaw = data.yaw || 0;
    p.alive = data.alive !== false;
    p.customIcon = data.icon || null;
    const char = CHARACTERS.find(c=>c.id === data.charId) || CHARACTERS[0];
    setPlayerCharacter(p, char);
    if(typeof data.color === 'number') setPlayerColor(p, data.color); // keep player's own color, not the character's default
    NET.remotes.set(id, p);
    players.push(p);
    refreshAliveChips();
  }
  return p;
}

function removeRemote(id){
  const p = NET.remotes.get(id);
  if(!p) return;
  scene.remove(p.mesh);
  const idx = players.indexOf(p);
  if(idx>=0) players.splice(idx,1);
  NET.remotes.delete(id);
  refreshAliveChips();
}

function netSendHit(targetId, dirX, dirZ, force, up, dmg){
  if(NET.ws && NET.ws.readyState === WebSocket.OPEN){
    NET.ws.send(JSON.stringify({ t:'hit', targetId, dirX, dirZ, force, up, dmg: dmg||0 }));
  }
}

function netSendGrapplePull(targetId, x, y, z, dmg){
  if(NET.ws && NET.ws.readyState === WebSocket.OPEN){
    NET.ws.send(JSON.stringify({ t:'grapple', targetId, x, y, z, dmg: dmg||0 }));
  }
}

function netSendSmoke(x, y, z, radius, duration){
  if(NET.ws && NET.ws.readyState === WebSocket.OPEN){
    NET.ws.send(JSON.stringify({ t:'smoke', x, y, z, radius, duration }));
  }
}

function netSendRules(){
  if(!(NET.ws && NET.ws.readyState === WebSocket.OPEN)) return;
  const teams = {};
  teams[NET.localId] = local.team || null;
  NET.remotes.forEach((p,id)=>{ teams[id] = p.team || null; });
  NET.ws.send(JSON.stringify({ t:'rules', mode: matchMode, teams }));
}

function handleNetMessage(msg){
  if(!msg || typeof msg.t !== 'string') return;
  switch(msg.t){
    case 'welcome': {
      NET.joined = true;
      NET.localId = msg.id;
      NET.hostId = msg.hostId;
      (msg.players || []).forEach(p=>{
        if(p.id === NET.localId){
          if(typeof p.color === 'number') setPlayerColor(local, p.color);
          return;
        }
        getOrCreateRemote(p.id, p);
      });
      updateLobbyUI();
      break;
    }
    case 'player_joined': {
      getOrCreateRemote(msg.id, msg);
      updateLobbyUI();
      if(NET.hostId === NET.localId) netSendRules();
      break;
    }
    case 'rules': {
      matchMode = msg.mode === 'team' ? 'team' : 'solo';
      if(msg.teams){
        for(const id in msg.teams){
          const team = msg.teams[id] || null;
          if(id === NET.localId){ local.team = team; }
          else { const p = NET.remotes.get(id); if(p) p.team = team; }
        }
      }
      updateLobbyUI();
      break;
    }
    case 'player_left': {
      removeRemote(msg.id);
      updateLobbyUI();
      checkRoundOutcome();
      break;
    }
    case 'host_changed': {
      NET.hostId = msg.hostId;
      updateLobbyUI();
      break;
    }
    case 'state': {
      const p = NET.remotes.get(msg.id);
      if(!p) return;
      p.net.x = msg.x; p.net.y = msg.y; p.net.z = msg.z; p.net.yaw = msg.yaw;
      p.net.lastSeen = Date.now();
      const wasAlive = p.alive;
      p.alive = !!msg.alive;
      if(p.alive && !wasAlive){ p.mesh.visible = true; p.mesh.scale.setScalar(1); }
      if(msg.attacking && p.attacking <= 0) p.attacking = 0.28;
      p.chargingPunch = !!msg.charging;
      p.punchChargeReadySynced = !!msg.chargeReady;
      p.shieldActive = !!msg.shield;
      if(msg.charId && (!p.character || p.character.id !== msg.charId)){
        const newChar = CHARACTERS.find(c=>c.id === msg.charId);
        if(newChar) setPlayerCharacter(p, newChar);
      }
      p.isReady = !!msg.ready;
      p.assaultActive = !!msg.assault;
      p.chargingUnibeam = !!msg.unibeam;
      updateLobbyUI();
      checkRoundOutcome();
      break;
    }
    case 'hit': {
      const force = (typeof msg.force === 'number') ? msg.force : KNOCKBACK_FORCE;
      const up = (typeof msg.up === 'number') ? msg.up : KNOCKBACK_UP;
      if(!hasKnockbackImmunity(local)){
        const mult = (local.character && local.character.knockbackTakenMult != null) ? local.character.knockbackTakenMult : 1;
        local.vel.x += msg.dirX * force * mult;
        local.vel.z += msg.dirZ * force * mult;
        local.vel.y = up * mult;
        local.hitstun = HITSTUN;
        local.onGround = false;
      }
      spawnHitSpark(new THREE.Vector3(local.pos.x, local.pos.y+1.1, local.pos.z), 0xFFFFFF);
      if(msg.dmg) applyDamageLocal(local, msg.dmg, players.find(p=>p.netId===msg.from));
      break;
    }
    case 'grapple': {
      startGrapplePull(local, new THREE.Vector3(msg.x, msg.y, msg.z));
      if(msg.dmg) applyDamageLocal(local, msg.dmg, players.find(p=>p.netId===msg.from));
      break;
    }
    case 'smoke': {
      activeSmokeZones.push({x:msg.x, y:msg.y, z:msg.z, radius:msg.radius, expireAt: nowSec()+(msg.duration||4)});
      break;
    }
    case 'chat': {
      appendLobbyChatLine(msg.name, msg.text, msg.icon);
      break;
    }
    case 'start_countdown': {
      beginLobbyCountdown(msg.ts);
      break;
    }
  }
}

function startNetworking(roomCodeRaw){
  NET.enabled = true;
  NET.room = sanitizeRoomCode(roomCodeRaw);
  clearLobbyChat();

  const startBtn = document.getElementById('lobby-start-btn');
  startBtn.style.display = 'block';
  startBtn.disabled = true;
  startBtn.textContent = 'サーバーに接続中…';
  document.getElementById('lobby-wait-msg').style.display = 'none';

  let ws;
  try{ ws = new WebSocket(NET_SERVER_URL); }
  catch(e){
    startBtn.textContent = 'サーバーに接続できませんでした';
    return;
  }
  NET.ws = ws;

  ws.addEventListener('open', ()=>{
    ws.send(JSON.stringify({ t:'join', room:NET.room, name:local.name, charId: (local.character && local.character.id) || CHARACTERS[0].id, icon: customIconDataUrl || '' }));
  });
  ws.addEventListener('message', (ev)=>{
    let msg;
    try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    handleNetMessage(msg);
  });
  ws.addEventListener('close', ()=>{
    if(!NET.joined){
      startBtn.style.display = 'none';
      const waitMsg = document.getElementById('lobby-wait-msg');
      waitMsg.style.display = 'block';
      waitMsg.textContent = 'サーバーに接続できませんでした。無料サーバーはスリープから起きるのに時間がかかることがあるので、少し待ってから画面を再読み込みしてみてください。';
    }
  });

  // push our own transform to the server at a steady rate; the server relays
  // it to everyone else in the room the moment it arrives (no polling delay)
  NET.pushInterval = setInterval(()=>{
    if(ws.readyState === WebSocket.OPEN){
      ws.send(JSON.stringify({
        t:'state',
        x: local.pos.x, y: local.pos.y, z: local.pos.z, yaw: local.yaw,
        alive: local.alive, attacking: local.attacking > 0, charging: local.chargingPunch,
        chargeReady: !!(local.chargingPunch && local.punchChargeStartTime && (nowSec()-local.punchChargeStartTime) >= 1),
        shield: !!local.shieldActive,
        charId: (local.character && local.character.id) || CHARACTERS[0].id,
        ready: localReady,
        assault: !!local.assaultActive,
        unibeam: !!local.chargingUnibeam
      }));
    }
  }, 100);

  const chip = document.getElementById('net-chip');
  chip.style.display = 'flex';
  chip.textContent = '🌐 ' + NET.room;
}

/* ---------------- Lobby / waiting room (host-gated synchronized start) ---------------- */
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function updateLobbyUI(){
  const hostId = NET.hostId;
  const isHost = hostId === NET.localId;
  const entries = [{id:NET.localId, name:local.name, color:local.color, ready:localReady, team:local.team, icon:customIconDataUrl}];
  NET.remotes.forEach((p,id)=> entries.push({id, name:p.name, color:p.color, ready:!!p.isReady, team:p.team, icon:p.customIcon}));
  entries.sort((a,b)=> (a.id===hostId?-1:0) - (b.id===hostId?-1:0));

  const nonHostEntries = entries.filter(e=>e.id !== hostId);
  const allNonHostReady = nonHostEntries.length > 0 && nonHostEntries.every(e=>e.ready);

  // rules row: mode toggle (host can click; everyone else just sees the current state)
  const soloBtn = document.getElementById('rule-mode-solo');
  const teamBtn = document.getElementById('rule-mode-team');
  soloBtn.classList.toggle('active', matchMode === 'solo');
  teamBtn.classList.toggle('active', matchMode === 'team');
  soloBtn.disabled = !isHost;
  teamBtn.disabled = !isHost;

  const listEl = document.getElementById('lobby-players');
  listEl.innerHTML = entries.map(e=>{
    const readyTag = e.id === hostId
      ? ''
      : (e.ready ? '<span class="lobby-ready-tag ready">✅ 準備完了</span>' : '<span class="lobby-ready-tag notready">準備中…</span>');
    let teamHtml = '';
    if(matchMode === 'team'){
      teamHtml = isHost
        ? `<div class="lobby-team-btns">
             <button class="lobby-team-btn team1 ${e.team===1?'active':''}" data-team-target="${e.id}" data-team-value="1">1</button>
             <button class="lobby-team-btn team2 ${e.team===2?'active':''}" data-team-target="${e.id}" data-team-value="2">2</button>
           </div>`
        : (e.team ? `<span class="lobby-team-tag team${e.team}">チーム${e.team}</span>` : '<span class="lobby-team-tag" style="background:rgba(0,0,0,0.15);">未定</span>');
    }
    const dotStyle = e.icon
      ? `background-image:url('${e.icon}'); background-size:cover; background-position:center;`
      : `background:#${e.color.toString(16).padStart(6,'0')};`;
    return `<div class="lobby-player-row"><span class="lobby-dot" style="${dotStyle}"></span>`+
    `<span class="lobby-player-name">${escapeHtml(e.name)}${e.id===hostId ? ' 👑' : ''}</span>${matchMode==='team' ? teamHtml : readyTag}</div>`;
  }).join('');
  document.getElementById('lobby-count').textContent = entries.length + '人参加中';

  if(isHost){
    listEl.querySelectorAll('.lobby-team-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.teamTarget;
        const team = parseInt(btn.dataset.teamValue, 10);
        if(id === NET.localId){ local.team = team; }
        else { const p = NET.remotes.get(id); if(p) p.team = team; }
        netSendRules();
        updateLobbyUI();
      });
    });
  }

  // team mode win condition needs every non-host AND host actually assigned
  // to a team before the host can start
  const allAssigned = matchMode !== 'team' || entries.every(e=>e.team === 1 || e.team === 2);

  const startBtn = document.getElementById('lobby-start-btn');
  const waitMsg = document.getElementById('lobby-wait-msg');
  const readyBtn = document.getElementById('lobby-ready-btn');
  if(isHost){
    startBtn.style.display = 'block';
    waitMsg.style.display = 'none';
    readyBtn.style.display = 'none';
    if(!startBtn.dataset.clicked){
      const canStart = entries.length >= 2 && allNonHostReady && allAssigned;
      startBtn.disabled = !canStart;
      startBtn.textContent = entries.length < 2
        ? 'あと1人以上待っています…'
        : (!allAssigned ? 'チーム分けを完了してください' : (allNonHostReady ? 'ゲームを開始する' : '全員の準備完了を待っています…'));
    }
  } else {
    startBtn.style.display = 'none';
    readyBtn.style.display = 'block';
    readyBtn.textContent = localReady ? '🔲 準備完了を取り消す' : '✅ 準備完了にする';
    readyBtn.classList.toggle('is-ready', localReady);
    waitMsg.style.display = 'block';
    const hostEntry = entries.find(e=>e.id===hostId);
    waitMsg.textContent = (hostEntry ? hostEntry.name : 'ホスト') + ' の開始を待っています…';
  }
}
document.getElementById('lobby-ready-btn').addEventListener('click', ()=>{
  localReady = !localReady;
  updateLobbyUI();
});
document.getElementById('rule-mode-solo').addEventListener('click', ()=>{
  if(NET.hostId !== NET.localId) return;
  matchMode = 'solo';
  netSendRules();
  updateLobbyUI();
});
document.getElementById('rule-mode-team').addEventListener('click', ()=>{
  if(NET.hostId !== NET.localId) return;
  matchMode = 'team';
  netSendRules();
  updateLobbyUI();
});

// A full match (first to 3 round wins) just ended - send everyone (each on

function beginLobbyCountdown(signalTs){
  document.getElementById('lobby-idle').style.display = 'none';
  const cdEl = document.getElementById('lobby-countdown');
  cdEl.style.display = 'block';
  const DURATION = 10000;
  function tick(){
    const remain = DURATION - (Date.now() - signalTs);
    if(remain <= 0){
      document.getElementById('lobby-overlay').style.display = 'none';
      gameStarted = true;
      roundNumber = 0;
      startRound();
      return;
    }
    cdEl.textContent = Math.ceil(remain/1000) + '秒後にスタート!';
    requestAnimationFrame(tick);
  }
  tick();
}

/* ---------------- Input: joystick (fixed position, PointerEvent based) ---------------- */
const stickZone = document.getElementById('stick-zone');
const joyBase = document.getElementById('joy-base');
const joyKnob = document.getElementById('joy-knob');
const JOY_RADIUS = 55;
const JOY_DEADZONE = 0.35;
let joyPointerId = null;
let joyCenter = {x:0, y:0};

function updateJoyCenter(){
  const r = joyBase.getBoundingClientRect();
  const p = remapXY(r.left + r.width/2, r.top + r.height/2);
  joyCenter.x = p.x;
  joyCenter.y = p.y;
}
updateJoyCenter();
window.addEventListener('resize', updateJoyCenter);
window.addEventListener('orientationchange', updateJoyCenter);

function joySetKnob(kx, ky){
  joyKnob.style.left = (joyBase.offsetWidth/2 - joyKnob.offsetWidth/2 + kx) + 'px';
  joyKnob.style.top = (joyBase.offsetHeight/2 - joyKnob.offsetHeight/2 + ky) + 'px';
}

function joyApply(clientX, clientY){
  const p = remapXY(clientX, clientY);
  const dx = p.x - joyCenter.x, dy = p.y - joyCenter.y;
  const dist = Math.hypot(dx,dy);
  const clamped = Math.min(JOY_RADIUS, dist);
  const ang = Math.atan2(dy,dx);
  const kx = Math.cos(ang)*clamped, ky = Math.sin(ang)*clamped;
  joySetKnob(kx, ky);
  let nx = kx / JOY_RADIUS, ny = -ky / JOY_RADIUS; // forward = up on screen
  if(Math.hypot(nx,ny) < JOY_DEADZONE){ nx = 0; ny = 0; }
  local.moveInput.x = nx;
  local.moveInput.y = ny;
}

function joyReset(){
  joyPointerId = null;
  joyBase.classList.remove('active');
  joySetKnob(0,0);
  local.moveInput.x = 0; local.moveInput.y = 0;
}
joyReset();

stickZone.addEventListener('pointerdown', e=>{
  if(joyPointerId !== null) return;
  joyPointerId = e.pointerId;
  updateJoyCenter();
  joyBase.classList.add('active');
  stickZone.setPointerCapture(e.pointerId);
  joyApply(e.clientX, e.clientY);
  e.preventDefault();
});
stickZone.addEventListener('pointermove', e=>{
  if(e.pointerId !== joyPointerId) return;
  joyApply(e.clientX, e.clientY);
  e.preventDefault();
});
function stickPointerEnd(e){
  if(e.pointerId !== joyPointerId) return;
  joyReset();
}
stickZone.addEventListener('pointerup', stickPointerEnd);
stickZone.addEventListener('pointercancel', stickPointerEnd);

// keyboard support (desktop convenience)
const keys = {};
window.addEventListener('keydown', e=>{ keys[e.key.toLowerCase()]=true; if(e.key===' ') local.wantJump = true; });
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });
function keyboardVector(){
  let x=0,y=0;
  if(keys['a']||keys['arrowleft']) x -= 1;
  if(keys['d']||keys['arrowright']) x += 1;
  if(keys['w']||keys['arrowup']) y += 1;
  if(keys['s']||keys['arrowdown']) y -= 1;
  return {x,y};
}

/* ---------------- Input: buttons ---------------- */
const btnJump = document.getElementById('btn-jump');
const btnAttack = document.getElementById('btn-attack');
const btnSkill = document.getElementById('btn-skill');
const btnSkill2 = document.getElementById('btn-skill2');
const btnDetonate = document.getElementById('btn-detonate');
btnDetonate.addEventListener('click', ()=>{
  if(local.character && local.character.skillType === 'stickycard') detonateStickyCards(local);
});

function bindPressButton(el, onDown){
  el.addEventListener('touchstart', e=>{ e.preventDefault(); el.classList.add('pressed'); onDown(); }, {passive:false});
  el.addEventListener('touchend', e=>{ e.preventDefault(); el.classList.remove('pressed'); }, {passive:false});
  el.addEventListener('mousedown', e=>{ el.classList.add('pressed'); onDown(); });
  el.addEventListener('mouseup', ()=>{ el.classList.remove('pressed'); });
  el.addEventListener('mouseleave', ()=>{ el.classList.remove('pressed'); });
}
bindPressButton(btnJump, ()=>{ local.wantJump = true; });
// FIRE/ATTACK button: for ranged (gun) and melee characters, pressing down
// does NOT attack right away - you can keep dragging that same finger to
// adjust aim (camera), and releasing is what actually attacks/fires.
// Chain-weapon characters still attack the instant the button is pressed.
let gunChargePointerId = null;
let gunChargeLast = null;

btnAttack.addEventListener('pointerdown', e=>{
  e.preventDefault();
  btnAttack.classList.add('pressed');
  if(local.character && (local.character.weapon === 'gun' || local.character.weapon === 'melee' || local.character.weapon === 'shieldthrow' || local.character.weapon === 'beam' || local.character.weapon === 'card' || local.character.weapon === 'orb')){
    gunChargePointerId = e.pointerId;
    gunChargeLast = remapXY(e.clientX, e.clientY);
    if(local.character.weapon === 'melee'){
      local.chargingPunch = true;
      local.punchChargeStartTime = nowSec();
    } else if(local.character.weapon === 'card'){
      local.chargingCard = true;
      local.cardChargeStartTime = nowSec();
    }
    try{ btnAttack.setPointerCapture(e.pointerId); }catch(err){}
  } else {
    local.wantAttack = true;
  }
});
btnAttack.addEventListener('pointermove', e=>{
  if(e.pointerId !== gunChargePointerId || !gunChargeLast) return;
  const cur = remapXY(e.clientX, e.clientY);
  const dx = cur.x - gunChargeLast.x, dy = cur.y - gunChargeLast.y;
  camYaw -= dx * LOOK_SENSITIVITY_X;

function disconnectFromServer(){
  if(NET.pushInterval){ clearInterval(NET.pushInterval); NET.pushInterval = null; }
  if(NET.ws){
    try{
      if(NET.ws.readyState === WebSocket.OPEN) NET.ws.send(JSON.stringify({t:'leave'}));
      NET.ws.close();
    }catch(e){ /* ignore */ }
  }
  NET.enabled = false;
  NET.joined = false;
  NET.hostId = null;
  NET.localId = null;
  NET.ws = null;
  for(const p of NET.remotes.values()) scene.remove(p.mesh);
  NET.remotes.clear();
  document.getElementById('net-chip').style.display = 'none';
}

function exitGame(){
  if(!confirm('今の対戦から退出しますか？')) return;

  isChargingGrenade = false;
  clearGrenadePreview();
  isChargingSmoke = false;
  clearSmokePreview();
  isPracticeMode = false;
  attacksLocked = false;
  roundStartTimer = null;
  stopSpectating();
  document.getElementById('round-start-countdown').style.display = 'none';

  disconnectFromServer();

  // remove every other player's mesh (remote opponents and/or bots) from the scene
  for(const p of players){
    if(p !== local) scene.remove(p.mesh);
  }
  players.length = 0;
  players.push(local);

  local.alive = true;
  local.mesh.visible = true;
  local.vel.set(0,0,0);

  gameStarted = false;
  roundActive = false;
  banner.classList.remove('show');
  youFellEl.classList.remove('show');
  countdownEl.classList.remove('show');
  document.getElementById('lobby-overlay').style.display = 'none';
  document.getElementById('start-overlay').style.display = 'flex';
  document.getElementById('lobby-start-btn').dataset.clicked = '';

  // the confirm() dialog above typically forces the browser out of
  // fullscreen mode, which is what exposes the address bar - re-request it
  tryLockLandscape();
}
document.getElementById('btn-exit').addEventListener('click', exitGame);

/* ---------------- Camera follow state (yaw/pitch driven by screen swipe) ---------------- */
let camYaw = Math.PI;   // current camera orbit angle (radians)
let camPitch = 0.46;    // current camera orbit pitch (radians); larger = looking down more
const CAM_PITCH_MIN = -1.48;
const CAM_PITCH_MAX = 1.05;
const CAM_DIST = 8.5;
const CAM_LOOK_HEIGHT = 1.5;
const LOOK_SENSITIVITY_X = 0.006;
const LOOK_SENSITIVITY_Y = 0.005;
const camPos = new THREE.Vector3();
const camLook = new THREE.Vector3();
camPos.set(0, CENTER.topY+8, 12);
camera.position.copy(camPos);

/* ---------------- Input: camera look via screen swipe (anywhere except stick/buttons) ---------------- */
const lookPointers = new Map();
let activeLookId = null;

function isControlElement(el){
  return !!(el && el.closest && (el.closest('#stick-zone') || el.closest('.action-btn')));
}

window.addEventListener('pointerdown', e=>{
  if(activeLookId !== null) return;
  if(isControlElement(e.target)) return;
  activeLookId = e.pointerId;
  lookPointers.set(e.pointerId, remapXY(e.clientX, e.clientY));
});
window.addEventListener('pointermove', e=>{
  if(e.pointerId !== activeLookId) return;
  const prev = lookPointers.get(e.pointerId);
  if(!prev) return;
  const cur = remapXY(e.clientX, e.clientY);
  const dx = cur.x - prev.x, dy = cur.y - prev.y;
  camYaw -= dx * LOOK_SENSITIVITY_X;
  camPitch = THREE.MathUtils.clamp(camPitch + dy * LOOK_SENSITIVITY_Y, CAM_PITCH_MIN, CAM_PITCH_MAX);
  lookPointers.set(e.pointerId, cur);
});
function endLook(e){
  if(e.pointerId === activeLookId) activeLookId = null;
  lookPointers.delete(e.pointerId);
}
window.addEventListener('pointerup', endLook);
window.addEventListener('pointercancel', endLook);

/* ---------------- Physics helpers ---------------- */
function resolvePlatformCollision(p, prevY){
  let grounded = false;
  let groundTopY = -Infinity;
  if(prevY === undefined) prevY = p.pos.y;

  for(const pl of platforms){
    const dx = p.pos.x - pl.x, dz = p.pos.z - pl.z;
    const distXZ = Math.hypot(dx, dz);
    const combinedR = pl.radius + PLAYER_RADIUS;

    // standing on top? only land when we actually crossed the surface this frame
    // (or are already resting essentially on it) - not when merely "close" -
    // otherwise falls get cut short and land earlier than they physically should.
    if(distXZ < pl.radius){
      const crossedDown = prevY >= pl.topY - 0.02 && p.pos.y <= pl.topY;
      const restingOnTop = Math.abs(p.pos.y - pl.topY) < 0.02 && p.vel.y <= 0.01;
      if((crossedDown || restingOnTop) && p.vel.y <= 0.01){
        if(pl.topY > groundTopY){ groundTopY = pl.topY; grounded = true; }
      }
    }

    // side collision (push out) only when clearly below the surface - keep a
    // gap from the "standing on top" check above so the two never fight over
    // a player right at the edge (that fight is what caused edge bounces).
    if(distXZ < combinedR && distXZ > 0.0001 && p.pos.y < pl.topY - 1.1){
      const push = (combinedR - distXZ);
      const nx = dx/distXZ, nz = dz/distXZ;
      p.pos.x += nx*push;
      p.pos.z += nz*push;
      if(p.vel.x*nx + p.vel.z*nz < 0){
        // cancel inward velocity component
        const vDotN = p.vel.x*nx + p.vel.z*nz;
        p.vel.x -= vDotN*nx;
        p.vel.z -= vDotN*nz;
      }
    }
  }

  if(grounded){
    p.pos.y = groundTopY;
    p.vel.y = 0;
    p.onGround = true;
  } else {
    p.onGround = false;
  }
}

/* ---------------- Attack logic ---------------- */
// 不動の構え (Immovable Stance): Crusher ignores knockback entirely while
// at 50% HP or above.
function hasKnockbackImmunity(target){
  if(target.assaultActive) return true; // シールドアサルト中はノックバックを受けない
  if(!target.character || target.character.id !== 'crusher') return false;
  const maxHp = target.maxHp || 1;
  const hpFrac = (target.hp != null ? target.hp : maxHp) / maxHp;
  return hpFrac >= 0.5;
}

function applyHit(attacker, target, dir, force, up, dmg){
  if(target.isRemote){
    netSendHit(target.netId, dir.x, dir.z, force, up, dmg||0);
  } else {
    if(!hasKnockbackImmunity(target)){
      const mult = (target.character && target.character.knockbackTakenMult != null) ? target.character.knockbackTakenMult : 1;
      target.vel.x += dir.x * force * mult;
      target.vel.z += dir.z * force * mult;
      target.vel.y = up * mult;
      target.hitstun = HITSTUN;
      target.onGround = false;
    }
    if(dmg) applyDamageLocal(target, dmg, attacker);
  }
  spawnHitSpark(new THREE.Vector3(target.pos.x, target.pos.y+1.1, target.pos.z), 0xFFFFFF);
}

// 光線(origin + t*dir)がキャラの体(足元から頭の先まで)を通っているかを
// 判定する。今までは胸の高さ一点だけを基準にしていたため、頭を狙うと外れて
// いたが、これで足〜頭まで縦に円柱として当たるようになる。
// 光線の途中に、実体のある柱(足場)が挟まっていないかを判定する。
// 柱は半径radius・高さ0〜topYの円柱として扱う。
// 飛んでいるカードや盾のような、実際に動く物体の"今の座標"が柱の内部(地面)
// に入り込んでいないかを判定する。isRayBlockedByStageは光線全体の判定用で、
// こちらは移動する物体を毎フレームチェックするための単純な点の判定
function isPositionInsideStage(pos){
  for(const pl of platforms){
    const dx = pos.x-pl.x, dz = pos.z-pl.z;
    if(Math.hypot(dx,dz) <= pl.radius && pos.y >= 0 && pos.y <= pl.topY) return true;
  }
  return false;
}

// 上と同じ判定だが、実際に刺さっている柱のtopY(正確な地表の高さ)も返す。
// 移動が速いフレームでは、地表を通り越して少し埋まった位置で検出される
// ことがあるので、刺さる時はこの正確な高さにクランプして使う。
function findStageSurfaceAt(pos){
  for(const pl of platforms){
    const dx = pos.x-pl.x, dz = pos.z-pl.z;
    if(Math.hypot(dx,dz) <= pl.radius && pos.y >= 0 && pos.y <= pl.topY) return pl.topY;
  }
  return null;
}

// isRayBlockedByStageと同じ判定だが、真偽値ではなく「最初にぶつかる距離」
// を返す(何にもぶつからなければnull)。突進技を柱の手前で止めるのに使う。
function findStageBlockDistance(origin, dir, maxDist){
  let closest = null;
  for(const pl of platforms){
    const ocx = origin.x - pl.x, ocz = origin.z - pl.z;
    const a = dir.x*dir.x + dir.z*dir.z;
    if(a < 0.000001) continue;
    const b = 2*(dir.x*ocx + dir.z*ocz);
    const c = ocx*ocx + ocz*ocz - pl.radius*pl.radius;
    const disc = b*b - 4*a*c;
    if(disc < 0) continue;
    const sq = Math.sqrt(disc);
    let s1 = (-b-sq)/(2*a), s2 = (-b+sq)/(2*a);
    if(s1 > s2){ const tmp = s1; s1 = s2; s2 = tmp; }
    s1 = Math.max(s1, 0); s2 = Math.min(s2, maxDist);
    if(s1 > s2) continue;
    const y1 = origin.y + dir.y*s1, y2 = origin.y + dir.y*s2;
    const yLo = Math.min(y1,y2), yHi = Math.max(y1,y2);
    if(yHi >= 0 && yLo <= pl.topY){
      if(closest === null || s1 < closest) closest = s1;
    }
  }
  return closest;
}

function isRayBlockedByStage(origin, dir, maxDist){
  for(const pl of platforms){
    const ocx = origin.x - pl.x, ocz = origin.z - pl.z;
    const a = dir.x*dir.x + dir.z*dir.z;
    if(a < 0.000001) continue; // shooting straight up/down never clips a pillar sideways
    const b = 2*(dir.x*ocx + dir.z*ocz);
    const c = ocx*ocx + ocz*ocz - pl.radius*pl.radius;
    const disc = b*b - 4*a*c;
    if(disc < 0) continue; // ray's XZ path never comes within the pillar's radius
    const sq = Math.sqrt(disc);
    let s1 = (-b-sq)/(2*a), s2 = (-b+sq)/(2*a);
    if(s1 > s2){ const tmp = s1; s1 = s2; s2 = tmp; }
    s1 = Math.max(s1, 0); s2 = Math.min(s2, maxDist);
    if(s1 > s2) continue; // that XZ overlap doesn't fall within this shot's segment
    const y1 = origin.y + dir.y*s1, y2 = origin.y + dir.y*s2;
    const yLo = Math.min(y1,y2), yHi = Math.max(y1,y2);
    if(yHi >= 0 && yLo <= pl.topY) return true; // overlaps the pillar's solid height range
  }
  return false;
}

function rayHitsBody(origin, dir, targetPos, radius, maxRange){
  const dx = targetPos.x - origin.x, dz = targetPos.z - origin.z;
  const dDotD_xz = dir.x*dir.x + dir.z*dir.z;
  let t;
  if(dDotD_xz < 0.0001){
    // aiming almost straight up/down - fall back to full 3D projection
    const toTarget = new THREE.Vector3(dx, (targetPos.y+1.0)-origin.y, dz);
    t = toTarget.dot(dir);
  } else {
    t = (dx*dir.x + dz*dir.z) / dDotD_xz;
  }
  if(t <= 0 || t > maxRange) return null;
  const closestX = origin.x + dir.x*t;
  const closestZ = origin.z + dir.z*t;
  const closestY = origin.y + dir.y*t;
  const perpXZ = Math.hypot(closestX-targetPos.x, closestZ-targetPos.z);
  if(perpXZ > radius) return null;
  const yBottom = targetPos.y + 0.05;   // feet
  const yTop = targetPos.y + 2.15;      // top of the head
  const yMargin = 0.15;
  if(closestY < yBottom - yMargin || closestY > yTop + yMargin) return null;
  if(isRayBlockedByStage(origin, dir, t)) return null; // a pillar is in the way
  return t;
}

function tryAttack(attacker){
  if(attacker.attackCooldown > 0 || !attacker.alive) return;
  const char = attacker.character || {
    attackRange:ATTACK_RANGE, attackAngle:ATTACK_ANGLE, attackCooldown:ATTACK_COOLDOWN,
    knockback:KNOCKBACK_FORCE, knockUp:KNOCKBACK_UP, weapon:'melee'
  };
  attacker.attackCooldown = char.attackCooldown;
  // if this punch was already wound up (held via the charge-and-release
  // button gesture), skip straight past the wind-up portion of the
  // animation into the strike itself, since the arm is already pulled back
  const wasCharged = attacker.attackWasCharged && char.weapon === 'melee';
  attacker.attackWasCharged = false;
  attacker.attacking = wasCharged ? 0.28 * 0.72 : 0.28;

  const fullyCharged = attacker.attackWasFullyCharged;
  attacker.attackWasFullyCharged = false;
  const attackDamage = (fullyCharged && char.attackDamageCharged) ? char.attackDamageCharged : char.attackDamage;

  const fwd = new THREE.Vector3(Math.sin(attacker.yaw), 0, Math.cos(attacker.yaw));
  const origin = new THREE.Vector3(attacker.pos.x, attacker.pos.y+1.05, attacker.pos.z);

  if(char.weapon === 'gun' || char.weapon === 'shieldthrow' || char.weapon === 'beam' || char.weapon === 'card' || char.weapon === 'orb'){
    // For the local player, aim from the camera's actual eye point/direction
    // (matching the on-screen crosshair exactly, including up/down aim).
    // Bots use their own computed pitch (see updateBotAI) so they can aim
    // up/down at targets too, not just left/right.
    let aimOrigin = origin, aimFwd = fwd;
    if(attacker.isLocal){
      aimOrigin = camera.position.clone();
      aimFwd = new THREE.Vector3();
      camera.getWorldDirection(aimFwd);
    } else {
      const pitch = (attacker.aimPitch || 0) + (attacker.aimJitterPitch || 0);
      const yaw = attacker.yaw + (attacker.aimJitterYaw || 0);
      aimFwd = new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch));
    }

    // hitscan: whoever is closest to the exact crosshair point wins - checked
    // against each target's full body height (feet to head), not a single
    // fixed reference point, so aiming at the head actually connects
    const hitRadius = (char.attackHitRadius || 1.1) + TARGET_HIT_RADIUS;
    let hitTarget = null, hitDist = char.attackRange;
    for(const target of players){
      if(target === attacker || !target.alive) continue;
      if(isFriendlyFire(attacker, target)) continue;
      const t = rayHitsBody(aimOrigin, aimFwd, target.pos, hitRadius, hitDist);
      if(t === null) continue;
      if(t < hitDist){ hitDist = t; hitTarget = target; }
    }
    const endPoint = aimOrigin.clone().addScaledVector(aimFwd, hitDist);
    if(char.weapon === 'gun'){
      // 銃口(手元)から照準の到達点へ、見た目上の弾道を飛ばす。当たり判定
      // 自体はすでに上のヒットスキャンで確定済みで、これは演出のみ。
      let muzzlePos = new THREE.Vector3(attacker.pos.x, attacker.pos.y+1.05, attacker.pos.z);
      if(attacker.mesh.userData.handR){
        attacker.mesh.userData.handR.getWorldPosition(muzzlePos);
      }
      spawnBulletTracer(muzzlePos, endPoint, 0xFFF3B0, char.attackHitRadius || 0.3);
      playSfx(GUNSHOT_SFX, 0.5);
      if(hitTarget && hitTarget.alive){
        const dirToTarget = new THREE.Vector3(hitTarget.pos.x-attacker.pos.x, 0, hitTarget.pos.z-attacker.pos.z).normalize();
        applyHit(attacker, hitTarget, dirToTarget, char.knockback, char.knockUp, computeDamageWithPassives(attacker, hitTarget, char.attackDamage));
      }
    } else if(char.weapon === 'shieldthrow'){
      let shieldStartPos = new THREE.Vector3(attacker.pos.x, attacker.pos.y+1.05, attacker.pos.z);
      if(attacker.mesh.userData.shieldMesh2){
        attacker.mesh.userData.shieldMesh2.getWorldPosition(shieldStartPos);
      }
      // the shield is a real projectile now - it's checked against everyone's
      // actual live position every frame as it flies, not a position decided
      // the instant it's thrown
      const shieldHitRadius = (char.attackHitRadius || 1.1);
      spawnShieldThrow(attacker, shieldStartPos, endPoint, shieldHitRadius, (target, hitPos)=>{
        if(target && target.alive){
          const dirToTarget = new THREE.Vector3(target.pos.x-attacker.pos.x, 0, target.pos.z-attacker.pos.z).normalize();
          applyHit(attacker, target, dirToTarget, char.knockback, char.knockUp, computeDamageWithPassives(attacker, target, char.attackDamage));
          performShieldRicochet(attacker, char, hitPos, target);
        }
      });
    } else if(char.weapon === 'card'){
      let cardStartPos = new THREE.Vector3(attacker.pos.x, attacker.pos.y+1.05, attacker.pos.z);
      if(attacker.mesh.userData.handR){
        attacker.mesh.userData.handR.getWorldPosition(cardStartPos);
      }
      const chargeTier = attacker.cardChargeTier || 0;
      attacker.cardChargeTier = 0;
      spawnCardThrow(attacker, cardStartPos, endPoint, char, chargeTier);
      playCardFlickSound(0.35);
    } else if(char.weapon === 'orb'){
      let orbStartPos = new THREE.Vector3(attacker.pos.x, attacker.pos.y+1.05, attacker.pos.z);
      if(attacker.mesh.userData.handR){
        attacker.mesh.userData.handR.getWorldPosition(orbStartPos);
      }
      // aim FROM where the orb actually starts (the hand) TOWARD the exact
      // point the crosshair is looking at - a direction merely parallel to
      // the camera's own ray (starting from an offset origin) wouldn't
      // converge with the crosshair at all, especially at close range
      const orbDir = endPoint.clone().sub(orbStartPos).normalize();
      spawnOrbProjectile(attacker, orbStartPos, orbDir, char, {allyHealAmount: char.attackAllyHeal || 35});
      playPewSound(0.32, 1500, 320, 0.15);
    } else if(char.weapon === 'beam'){
      const useRight = attacker.beamHandRight;
      attacker.attackingHandRight = useRight;
      attacker.beamHandRight = !attacker.beamHandRight; // alternate hands next shot
      const repulsor = useRight ? attacker.mesh.userData.repulsorR : attacker.mesh.userData.repulsorL;
      let beamStartPos = new THREE.Vector3(attacker.pos.x, attacker.pos.y+1.05, attacker.pos.z);
      if(repulsor){
        repulsor.getWorldPosition(beamStartPos);
      }
      spawnBeamEffect(beamStartPos, endPoint, 0xBFEFFF);
      playSfx(BEAM_SFX, 0.5);
      if(hitTarget){
        const dirToTarget = new THREE.Vector3(hitTarget.pos.x-attacker.pos.x, 0, hitTarget.pos.z-attacker.pos.z).normalize();
        applyHit(attacker, hitTarget, dirToTarget, char.knockback, char.knockUp, computeDamageWithPassives(attacker, hitTarget, char.attackDamage));
      }
    } else {
      spawnTracer(aimOrigin, endPoint);
      if(hitTarget){
        const dirToTarget = new THREE.Vector3(hitTarget.pos.x-attacker.pos.x, 0, hitTarget.pos.z-attacker.pos.z).normalize();
        applyHit(attacker, hitTarget, dirToTarget, char.knockback, char.knockUp, computeDamageWithPassives(attacker, hitTarget, char.attackDamage));
      }
    }
  } else {
    // some melee characters (e.g. Crusher) lunge forward a bit as part of
    // the swing itself, regardless of whether the punch actually connects
    if(char.attackLungeForce){
      // use the real 3D aim direction (including up/down camera pitch) for
      // local players, so aiming up/down actually sends the lunge that way
      let lungeDir = fwd;
      if(attacker.isLocal){
        lungeDir = new THREE.Vector3();
        camera.getWorldDirection(lungeDir);
      }
      attacker.vel.x += lungeDir.x * char.attackLungeForce;
      attacker.vel.z += lungeDir.z * char.attackLungeForce;
      // vertical velocity isn't damped the way horizontal movement is (it's
      // pure gravity-driven ballistic motion), so the same force number
      // would send an upward lunge absurdly high - scale it way down
      attacker.vel.y += lungeDir.y * char.attackLungeForce * 0.28;
      attacker.onGround = false;
      spawnPunchTrail(attacker, char.attackRange || 3, lungeDir);
      // keep checking for hits while the lunge is still carrying the
      // attacker forward, not just at the instant the button was pressed
      attacker.punchLungeTimer = 0.35;
      attacker.punchLungeHitSet = new Set();
    }
    // melee: a punch/swing can hit everyone caught in the wide cone at once
    for(const target of players){
      if(target === attacker || !target.alive) continue;
      if(isFriendlyFire(attacker, target)) continue;
      const toTarget = new THREE.Vector3(target.pos.x-attacker.pos.x, 0, target.pos.z-attacker.pos.z);
      const dist = toTarget.length();
      if(dist > char.attackRange + TARGET_HIT_RADIUS || dist < 0.0001) continue;
      const dirToTarget = toTarget.clone().normalize();
      const ang = Math.acos(THREE.MathUtils.clamp(fwd.dot(dirToTarget), -1, 1));
      if(ang > char.attackAngle/2) continue;
      if(attacker.punchLungeHitSet) attacker.punchLungeHitSet.add(target);
      applyHit(attacker, target, dirToTarget, char.knockback, char.knockUp, computeDamageWithPassives(attacker, target, attackDamage));
    }
    if(char.weapon === 'chain'){
      spawnChainSwingTrail(attacker, char.attackRange);
      playWhooshThud(0.4);
    }
  }
}

function trySkill(attacker){
  const char = attacker.character;
  if(!char || !attacker.alive || attacker.hitstun > 0) return;
  if(char.skillType === 'stickycard'){
    // このスキルは通常のクールタイムではなく専用の弾数(アモ)で管理する
    if(attacker.stickyAmmo <= 0) return;
    if(attacker.stickyCards.length >= (char.skillAmmoMax || 3)) return;
    attacker.stickyAmmo -= 1;
    attacker.attacking = 0.2;
    let origin = new THREE.Vector3(attacker.pos.x, attacker.pos.y+1.05, attacker.pos.z);
    let aimDir = new THREE.Vector3(Math.sin(attacker.yaw), 0, Math.cos(attacker.yaw));
    if(attacker.isLocal){
      origin = camera.position.clone();
      aimDir = new THREE.Vector3();
      camera.getWorldDirection(aimDir);
    } else {
      const pitch = attacker.aimPitch || 0;
      aimDir = new THREE.Vector3(Math.sin(attacker.yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(attacker.yaw)*Math.cos(pitch));
    }
    const maxRange = char.skillRange || 40;
